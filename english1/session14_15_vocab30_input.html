"分詞・形容詞", "loc": "(11)", "phrase": "play a mediating role", "note": "mediate = 仲介する。"}, {"word": "prominence", "jp": "重要性、目立つこと", "pos": "名詞", "loc": "(12)", "phrase": "social prominence", "note": "prominent（著名な、目立つ）の名詞形。"}, {"word": "illegitimacy", "jp": "正統性の欠如", "pos": "名詞", "loc": "(13)", "phrase": "their aura of illegitimacy", "note": "legitimate / illegitimate の語形成も要確認。"}, {"word": "alacrity", "jp": "敏速さ、性急な積極性", "pos": "名詞", "loc": "(15)", "phrase": "the alacrity with which they have jettisoned ...", "note": "難語。ここでは「あっさりと捨てた」感じ。"}, {"word": "jettisoned", "jp": "捨て去った", "pos": "動詞", "loc": "(15)", "phrase": "jettisoned their traditional republicanism", "note": "比喩的に「捨てる」。"}, {"word": "travesty", "jp": "ひどい歪曲、茶番", "pos": "名詞", "loc": "(17)", "phrase": "The degree of travesty", "note": "本来の制度を滑稽なほど変形しているという批判。"}, {"word": "displaced", "jp": "取って代わった", "pos": "動詞", "loc": "(18)", "phrase": "igwes ... displaced the memory of republicanism", "note": "displace = 置き換える、立場を奪う。"}, {"word": "anomic", "jp": "無秩序な、規範を失った", "pos": "形容詞", "loc": "(20)", "phrase": "an anomic, unhappy state", "note": "社会規範が弱い・失われた状態。"}, {"word": "reproaching", "jp": "非難している", "pos": "動詞・分詞", "loc": "(21)", "phrase": "reproaching them for the delay", "note": "reproach A for B = BについてAを非難する。"}, {"word": "normative", "jp": "規範的な、標準とされる", "pos": "形容詞", "loc": "(22)", "phrase": "a stronger, normative form", "note": "「あるべき形」とみなされる、の意。"}, {"word": "spectacle", "jp": "見世物、壮観", "pos": "名詞", "loc": "(24)", "phrase": "a crucial form of political spectacle", "note": "政治権力を視覚的に見せる儀礼・イベント。"}, {"word": "repertoire", "jp": "レパートリー、持ち合わせ", "pos": "名詞", "loc": "(27)", "phrase": "the symbolic repertoire of royal authority", "note": "象徴表現の「持ち札・レパートリー」。"}, {"word": "staple", "jp": "定番、主要なもの", "pos": "名詞", "loc": "(28)", "phrase": "a staple of Nigerian television programming", "note": "food staple だけでなく「定番」の意味。"}, {"word": "palavers", "jp": "長々しい議論、口論", "pos": "名詞", "loc": "(30)", "phrase": "the palavers of democracy", "note": "西アフリカ文脈で「長い話し合い・口論」。"}, {"word": "anathema", "jp": "忌み嫌われるもの", "pos": "名詞", "loc": "(33)", "phrase": "monarchy ... is viewed as anathema", "note": "be anathema to A = Aにとって忌むべきもの。"}, {"word": "entailed", "jp": "伴った、必然的に含んだ", "pos": "動詞", "loc": "(39)", "phrase": "they never entailed executive authority", "note": "entail = 必然的に伴う。"}, {"word": "indiscriminate", "jp": "無差別の", "pos": "形容詞", "loc": "(41)", "phrase": "wholesale and indiscriminate sale of titles", "note": "discriminate（区別する）に in- がついた形。"}], "15": [{"word": "crouches", "jp": "しゃがむ", "pos": "動詞", "loc": "ll.1–3", "phrase": "Kaylee Byers crouches ...", "note": "冒頭の現在形描写。"}, {"word": "dumpster", "jp": "大型ごみ容器", "pos": "名詞", "loc": "ll.3–5", "phrase": "a large blue dumpster", "note": "都市ネズミの生息環境を描く語。"}, {"word": "overgrown", "jp": "草木が生い茂った", "pos": "形容詞", "loc": "ll.5–6", "phrase": "an overgrown ... lot", "note": "overgrow の過去分詞形。"}, {"word": "unfussy", "jp": "気取らない、飾り気のない", "pos": "形容詞", "loc": "ll.10–12", "phrase": "an “unfussy” traditional Ethiopian restaurant", "note": "fussy = 細かくうるさい、凝った。"}, {"word": "anesthesia", "jp": "麻酔", "pos": "名詞", "loc": "ll.12–14", "phrase": "put under anesthesia", "note": "under anesthesia = 麻酔下で。"}, {"word": "anecdotally", "jp": "体験談・個別事例に基づいて", "pos": "副詞", "loc": "ll.18–20", "phrase": "exploding anecdotally", "note": "統計ではなく目撃談ベース、という重要点。"}, {"word": "boil down to", "jp": "結局～に要約される", "pos": "熟語", "loc": "ll.21–23", "phrase": "could be boiled down to a single study", "note": "受動形 boiled down to で登場。"}, {"word": "landfill", "jp": "ごみ埋立地", "pos": "名詞", "loc": "ll.21–23", "phrase": "living in a landfill", "note": "都市環境を表す語。"}, {"word": "reconsider", "jp": "考え直す", "pos": "動詞", "loc": "ll.27–28", "phrase": "made her reconsider ...", "note": "本文の価値観が転換する重要箇所。"}, {"word": "invaders", "jp": "侵入者", "pos": "名詞", "loc": "ll.27–28", "phrase": "labeling of rats as invaders", "note": "従来のネズミ観を表す。"}, {"word": "thrive", "jp": "繁栄する、よく育つ", "pos": "動詞", "loc": "l.31", "phrase": "Rats thrive as a result of people", "note": "Session 15 の重要動詞。"}, {"word": "disruptions", "jp": "攪乱、混乱", "pos": "名詞", "loc": "ll.31–33", "phrase": "modern disruptions caused by urban development", "note": "disturbance と並ぶ本文の最重要概念。"}, {"word": "ecological niches", "jp": "生態的地位、生息上の場所", "pos": "名詞句", "loc": "ll.32–33", "phrase": "new ecological niches", "note": "生態学用語。"}, {"word": "domestication", "jp": "家畜化", "pos": "名詞", "loc": "ll.35–36", "phrase": "without active domestication", "note": "domesticate の名詞形。"}, {"word": "burrow", "jp": "巣穴", "pos": "名詞", "loc": "ll.37–40", "phrase": "a place to build a burrow", "note": "生存の最低条件の1つ。"}, {"word": "bare necessities", "jp": "最低限必要なもの", "pos": "名詞句", "loc": "ll.37–40", "phrase": "In terms of the bare necessities", "note": "bare = 最低限の、むき出しの。"}, {"word": "come down to", "jp": "結局～に帰着する", "pos": "熟語", "loc": "ll.42–45", "phrase": "it comes down to where rats ...", "note": "論理をまとめる重要熟語。"}, {"word": "parasitic", "jp": "寄生的な", "pos": "形容詞", "loc": "ll.46–61", "phrase": "a parasitic response", "note": "Q5の中心語。後半で繰り返される。"}, {"word": "take advantage of", "jp": "～を利用する", "pos": "熟語", "loc": "ll.49–51", "phrase": "take advantage of the disruptions", "note": "人間が作る攪乱を利用する、という核心。"}, {"word": "opportunists", "jp": "機会を利用して生きるもの", "pos": "名詞", "loc": "ll.52–54", "phrase": "the ultimate opportunists", "note": "ネズミの生存戦略を端的に表す。"}, {"word": "intact", "jp": "損なわれていない、手つかずの", "pos": "形容詞", "loc": "ll.57–58", "phrase": "a lush, primary, intact forest", "note": "disturbed environment と対比される。"}, {"word": "bring into question", "jp": "～に疑問を投げかける", "pos": "熟語", "loc": "ll.62–63", "phrase": "brings into question the constant human quest ...", "note": "前の議論から駆除への疑問につなぐ表現。"}, {"word": "tight-knit", "jp": "結びつきの強い", "pos": "形容詞", "loc": "ll.64–66", "phrase": "tight-knit family groups", "note": "ネズミ集団の安定性を示す。"}, {"word": "ousted", "jp": "追い出された", "pos": "動詞・過去分詞", "loc": "ll.66–69", "phrase": "a rat is ousted from its family", "note": "駆除による集団崩壊の起点。"}, {"word": "quarantined", "jp": "隔離された", "pos": "動詞・過去分詞", "loc": "ll.68–69", "phrase": "effectively quarantined to that family", "note": "病原体が家族内に封じ込められていること。"}, {"word": "backfiring", "jp": "逆効果になっている", "pos": "動詞・分詞", "loc": "ll.69–71", "phrase": "could be backfiring", "note": "Q6の結論。かなり重要。"}, {"word": "absorb", "jp": "吸収する", "pos": "動詞", "loc": "ll.73–75", "phrase": "absorb a diverse collection of bacteria", "note": "“like sponges” の比喩を支える動詞。"}, {"word": "pathogens", "jp": "病原体", "pos": "名詞", "loc": "ll.77–78", "phrase": "place-specific pathogens", "note": "感染症の議論で頻出。"}, {"word": "converge", "jp": "一か所に集まる", "pos": "動詞", "loc": "ll.81–83", "phrase": "bacteria can converge, mix ...", "note": "mixing bowl の説明に直結。"}, {"word": "strain", "jp": "菌株、系統", "pos": "名詞", "loc": "ll.86–87", "phrase": "a strain of methicillin-resistant ...", "note": "細菌の具体例で使われる科学語。"}]};
let session=localStorage.getItem('vocab30-session')||'14';
let direction=localStorage.getItem('vocab30-direction')||'en-ja';
let listMode=localStorage.getItem('vocab30-list')==='1';
let dark=localStorage.getItem('vocab30-dark')==='1';
let order={14:[...Array(30).keys()],15:[...Array(30).keys()]};
try{const x=JSON.parse(localStorage.getItem('vocab30-order')||'null');if(x)order=x}catch(e){}
let marks={};try{marks=JSON.parse(localStorage.getItem('vocab30-marks')||'{}')}catch(e){}
document.documentElement.classList.toggle('dark',dark);document.getElementById('direction').value=direction;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function key(i){return session+'|'+i}
function save(){localStorage.setItem('vocab30-session',session);localStorage.setItem('vocab30-direction',direction);localStorage.setItem('vocab30-list',listMode?'1':'0');localStorage.setItem('vocab30-dark',dark?'1':'0');localStorage.setItem('vocab30-order',JSON.stringify(order));localStorage.setItem('vocab30-marks',JSON.stringify(marks))}
function setSession(s){session=s;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function setDirection(d){direction=d;save();render()}
function toggleList(){listMode=!listMode;save();render()}
function toggleDark(){dark=!dark;document.documentElement.classList.toggle('dark',dark);save()}
function shuffleCards(){const a=[...order[session]];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}order[session]=a;save();render()}
function setMark(e,i,v){e.stopPropagation();const k=key(i);marks[k]=marks[k]===v?'':v;save();render()}
function resetMarks(){if(!confirm('現在のSessionの記録を消しますか？'))return;Object.keys(marks).filter(k=>k.startsWith(session+'|')).forEach(k=>delete marks[k]);save();render()}
function flip(el){if(!listMode)el.classList.toggle('flipped')}

function normalizeAnswer(s){
 return String(s||'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[、，]/g,",").replace(/\s+/g,' ');
}
function acceptableAnswers(ans){
 const raw=String(ans||'').trim();
 const parts=raw.split(/[、,]/).map(x=>normalizeAnswer(x)).filter(Boolean);
 return [normalizeAnswer(raw),...parts];
}
function checkAnswer(e,input){
 if(e.key!=='Enter') return;
 e.preventDefault();e.stopPropagation();
 input.classList.remove('correct','wrong');
 const answer=input.dataset.answer||'';
 const val=normalizeAnswer(input.value);
 if(val==='?'){
   input.value=answer;
   input.classList.add('correct');
   return;
 }
 const ok=acceptableAnswers(answer).some(a=>a===val);
 input.classList.add(ok?'correct':'wrong');
 if(ok){
   setTimeout(()=>{
     const cards=[...document.querySelectorAll('.card')];
     const card=input.closest('.card');
     const idx=cards.indexOf(card);
     if(idx>=0 && idx+1<cards.length){
       const next=cards[idx+1].querySelector('.quizbox input');
       if(next){next.focus();next.scrollIntoView({behavior:'smooth',block:'center'})}
     }
   },180);
 }
}

function render(){
 document.getElementById('b14').classList.toggle('active',session==='14');document.getElementById('b15').classList.toggle('active',session==='15');document.getElementById('listBtn').classList.toggle('active',listMode);document.getElementById('main').classList.toggle('mode-list',listMode);
 const q=document.getElementById('search').value.trim().toLowerCase(),grid=document.getElementById('grid');grid.innerHTML='';let shown=0;
 order[session].forEach(i=>{const v=DATA[session][i],hay=(v.word+' '+v.jp+' '+v.pos+' '+v.phrase+' '+v.note).toLowerCase();if(q&&!hay.includes(q))return;shown++;const m=marks[key(i)]||'';const frontMain=direction==='en-ja'?v.word:v.jp,frontSub=direction==='en-ja'?v.loc:v.pos+' · '+v.loc,backMain=direction==='en-ja'?v.jp:v.word,backSub=direction==='en-ja'?v.pos:v.jp;
 const card=document.createElement('div');card.className='card '+(m==='known'?'mark-known':m==='review'?'mark-review':'');card.onclick=()=>flip(card);card.innerHTML=`<div class="inner"><div class="face front"><div class="num">#${String(i+1).padStart(2,'0')} · SESSION ${session}</div><div class="word">${esc(frontMain)}</div><div class="loc">${esc(frontSub)}</div>
<div class="quizbox" onclick="event.stopPropagation()">
 <input type="text" autocomplete="off" spellcheck="false"
  placeholder="${direction==='en-ja'?'日本語を入力':'英単語・熟語を入力'}"
