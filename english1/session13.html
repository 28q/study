<header><div class="session">SESSION 13</div><div class="title"><h1>Nollywood, Part I</h1><p>Jonathan Haynes — 英文に触れると対応する訳を表示／クリックで固定</p></div><div class="controls"><button id="smaller">A−</button><button id="larger">A＋</button><button id="prev">↑</button><span class="counter" id="counter">1 / 13</span><button id="next">↓</button></div></header><div class="progress" id="progress"></div>
<main class="app"><div class="pane en" id="en"><div class="pane-head">ENGLISH · ORIGINAL</div></div><div class="pane ja" id="ja"><div class="pane-head">日本語 · TRANSLATION</div></div></main><div class="hint">← → / ↑ ↓ で段落移動　Escで固定解除</div>
<script>
const pairs=[
{en:`Glamour Girls 1, which came out in 1994, was the first video film made in English. This was an event no less momentous than the appearance of Living in Bondage. It opened up a huge new market—a national Nigerian market, in the first place, and also, as an unintended consequence, an international one. Nollywood’s hegemony across Africa, its deep penetration of the Caribbean, and its inroads among African Americans would be unlikely if its medium were not the most powerful world language.`,ja:`1994年公開の『Glamour Girls 1』は、英語で作られた最初のビデオ映画だった。これは『Living in Bondage』の登場に劣らず重大な出来事である。まずナイジェリア全国という巨大な新市場を開き、意図しない結果として国際市場も開いた。英語を媒体にしていなければ、ノリウッドのアフリカ全域での覇権、カリブ海への浸透、アフリカ系アメリカ人の間への進出は起こりにくかっただろう。`},
{en:`It was not obvious that filmmaking in English would work. Afolabi Adesanya concluded, after poor returns on his English-language film Vigilante (1988), that while Nigerian audiences would watch television programs in English, they would not spend their own money to see English-language films. Films in Nigerian languages have a cultural depth and resonance, an immediate emotional power and a communal adhesion that films in English cannot match. Nigerian actors are more spontaneous, lively, and authentic in their mother tongues.`,ja:`英語映画が成功することは自明ではなかった。アフォラビ・アデサンヤは英語映画『Vigilante』（1988）の収益不振から、観客は英語のテレビ番組なら見るが、自分の金で英語映画を見ないと結論した。ナイジェリア諸語の映画には、英語映画では及ばない文化的な深みと響き、直接的な感情の力、共同体を結びつける力がある。俳優も母語の方が自然で、生き生きとし、真正らしくなる。`},
{en:`But “English is the language of success.” Nigerian audiences did not see English as a foreign language in the sense of unpleasantly alien to them: it is the national language, the language of education past the primary level, and it has been indigenized through a spectrum of Nigerian Englishes, from a lightly accented Queen’s English to Pidgin, which is as much African as European in its grammatical structures and soaks up loan words from every locality.`,ja:`しかし「英語は成功の言語」である。ナイジェリアの観客は、英語を不快でよそよそしい意味での外国語とは見ていない。英語は国の共通語であり、初等教育以後の教育言語であり、標準イギリス英語からピジンまで幅広い「ナイジェリア英語」を通して土着化されている。ピジンの文法構造はヨーロッパ的であると同じほどアフリカ的で、各地の借用語を吸収する。`},
{en:`English is part of the Nigerian cultural landscape, and it signifies an elevated class status and a desirable cosmopolitanism. It stands for making it. These connotations compensate for the lost emotional immediacy. The adoption of English shifts the films’ horizon away from cultural depth and particularism and toward the multiethnic nation. That move is crucial in allowing Nollywood films to travel throughout the African continent and diaspora.`,ja:`英語はナイジェリアの文化的風景の一部で、高い階級的地位と望ましい国際性を意味する。「成功すること」の象徴なのだ。この含意が、失われる感情の直接性を補う。英語採用は映画の地平を文化的深みや地域的特殊性から多民族国家へ移す。この移動が、ノリウッド映画をアフリカ大陸全体とディアスポラへ流通させる。`},
{en:`African writers debated for half a century whether to work in their mother tongues or the colonial languages; film marketers saw that English films sold better than Igbo ones and within months the industry was transformed. Achebe’s Okonkwo is transcribed transparently in English, but in the NTA’s 1986 serial drama of Things Fall Apart, the English dialogue seems in jarring relation to the carefully reconstructed settings.`,ja:`アフリカの作家が母語で書くべきか植民者の言語で書くべきかは半世紀議論された。映画販売業者は英語映画がイボ語映画より売れると見抜き、産業は数か月で一変した。アチェベのオコンクウォは英語で透明に書き移されているが、NTAの1986年連続ドラマ版『Things Fall Apart』では、英語の会話が慎重に再現された舞台設定と不調和を起こす。`},
{en:`The literary debates turn on a binary opposition between African cultural localism and the universality that comes with the colonizers’ languages, but Nollywood’s situation is not exactly binary. Many Americans find Nigerian accents in English so hard to understand that they cannot follow the stories. Foreign festival audiences may have an easier time with a subtitled Yoruba film than with an English-language Nollywood one.`,ja:`文学論争は、アフリカ文化の地域的特殊性と植民者の言語がもたらす普遍性との二項対立を軸にする。しかしノリウッドは単純な二項対立ではない。多くのアメリカ人はナイジェリア訛りの英語を、物語を追えないほど理解しにくいと感じる。外国映画祭の観客は、英語のノリウッド映画より字幕付きヨルバ語映画の方が理解しやすいことさえある。`},
{en:`The shift from Igbo into English greatly expanded the reservoir of filmmaking talent as well as the potential audience. A number of the most important directors and actors of Nollywood’s next phase are not Igbo, including the Glamour Girls stars Liz Benson, Sola Fosudo, and Golda John.`,ja:`イボ語から英語への移行は、潜在的観客だけでなく映画製作人材の層も大幅に広げた。次の段階のノリウッドを担った最重要監督・俳優の多くはイボ人ではない。『Glamour Girls』のスター、リズ・ベンソン、ソラ・フォスド、ゴルダ・ジョンもそうである。`},
{en:`More than fifteen producers followed Nnebue into making Igbo films, but filmmaking in Igbo proved to be a flash in the pan, declining rapidly once English-language production began and sputtering since then. Some years the censors board registered no Igbo films. Yoruba and Hausa production, in contrast, has steadily flourished. Even Edo filmmaking has established a healthy modest market.`,ja:`15人を超える製作者がネブエに続いてイボ語映画へ入ったが、イボ語映画は一時的流行に終わり、英語映画が始まると急速に衰え、その後も途切れがちになった。イボ語映画が一本も登録されない年さえあった。対照的にヨルバ語とハウサ語は着実に栄え、人口の少ないエド語映画も健全で控えめな市場を確立した。`},
{en:`One explanation relies on the stereotype of the Igbo as less attached to their language, illustrated by the supposed difficulty of getting through a sentence without throwing in some English. The other relies on the stereotype of Igbo marketers as having no motivation except profits, which are higher in English. But there were other factors, including a general weakness of cultural infrastructure.`,ja:`一つの説明は、イボ人は自分の言語への愛着が弱く、英語を混ぜず一文を最後まで話すのが難しいという固定観念に依存する。もう一つは、イボ人販売業者は利益以外に動機がなく、英語の方が高収益だという固定観念である。しかし文化的基盤の弱さなど、他の要因もあった。`},
{en:`Yoruba and Hausa evolved strong central standard dialects that became bases for literary output, journalism, drama, and broadcasting. A standard Igbo dialect was created but never took strong hold. The scenarios and scripts for all Igbo films were in English because neither writers nor actors were used to written Igbo. Many Igbos feel they do not meet the high standard of the art of conversation, having been educated in English rather than mastering proverbs at the feet of elders.`,ja:`ヨルバ語とハウサ語では強力な中央標準方言が発達し、文学、新聞、演劇、放送の基盤となった。標準イボ語は強く定着しなかった。作家も俳優も書き言葉のイボ語に慣れず、イボ語映画の台本は英語だった。多くのイボ人は、年長者にことわざを学ぶ代わりに英語教育を受けたため、会話技術の高い基準に届かないと感じる。`},
{en:`Outside Enugu and Aba there was no established pool of actors used to working in Igbo. Casting Living in Bondage was slow and careful, and Ogunjiofor spent hours coaching actors, introducing adages, flowery turns of phrase, and light bantering sarcasm. These nuances were impossible to capture in subtitles. So few actors performed well in Igbo that the same faces appeared over and over.`,ja:`エヌグとアバの外には、イボ語演技に慣れた俳優層がなかった。『Living in Bondage』の配役は慎重に進められ、オグンジオフォーは格言、華麗な言い回し、軽くからかう皮肉を俳優へ何時間も指導した。こうしたニュアンスは字幕で捉えられない。うまく演じられる俳優が少なく、同じ顔ばかり登場した。`},
{en:`Amaka Igwe found that once her actors began speaking Igbo they enjoyed it so much they would not stop, lost in the elaborate metaphors and philosophical dimensions of the language. The first part of Rattlesnake (1995) was supposed to run two hours but produced eleven hours of material, cut laboriously to three. It was also difficult to assemble a cast speaking the same dialect: northern and southern Igbo can be almost mutually unintelligible. Subtitling added expense and degraded image quality through another generation of videotape reproduction.`,ja:`アマカ・イグウェは、俳優がイボ語を話し始めると精緻な比喩と哲学的な広がりに夢中になり、話をやめなくなると気づいた。『Rattlesnake』（1995）第一部は2時間の予定が素材11時間となり、苦労して3時間へ縮めた。同じ方言の配役も難しく、北部と南部のイボ語はほぼ相互理解不能な場合がある。字幕は費用を加え、再複製によって画質も落とした。`},
{en:`The brief efflorescence of Igbo films crystallized many themes fundamental to Nollywood. Igbo marketers remain the industry’s most powerful players, a fact often grumbled about in ethnic terms, and Igbo culture is represented more often than any other. But the contribution of the founding Igbo films passed into the whole Nollywood film culture without creating a particular style or genre recognized as specifically Igbo.`,ja:`イボ語映画の短い開花は、後にノリウッドの基礎となる多くの主題を結晶化させた。イボ人販売業者は今も業界で最も強力で、その事実は民族問題として不満を言われることが多い。イボ文化も最も頻繁に表象される。しかし初期イボ語映画の貢献は、特にイボ的と認識される様式やジャンルを作らず、ノリウッド文化全体へ溶け込んだ。`}
];
const en=document.getElementById('en'),ja=document.getElementById('ja'),counter=document.getElementById('counter'),progress=document.getElementById('progress');let locked=-1,current=0,syncing=false,fs=17;pairs.forEach((p,i)=>{for(const [pane,key] of [[en,'en'],[ja,'ja']]){const s=document.createElement('section');s.className='card';s.dataset.n=String(i+1).padStart(2,'0');s.textContent=p[key];pane.appendChild(s)}});const E=[...en.querySelectorAll('.card')],J=[...ja.querySelectorAll('.card')];function mark(i,lock=false,scroll=false){current=Math.max(0,Math.min(pairs.length-1,i));[...E,...J].forEach(x=>x.classList.remove('active'));E[current].classList.add('active');J[current].classList.add('active');counter.textContent=`${current+1} / ${pairs.length}`;if(lock)locked=current;if(scroll){E[current].scrollIntoView({block:'center',behavior:'smooth'});J[current].scrollIntoView({block:'center',behavior:'smooth'})}}[E,J].forEach((list,side)=>list.forEach((c,i)=>{c.addEventListener('mouseenter',()=>{if(locked<0){mark(i);(side?E:J)[i].scrollIntoView({block:'center',behavior:'smooth'})}});c.addEventListener('click',()=>mark(i,true,true))}));function sync(a,b){if(syncing)return;syncing=true;const ma=a.scrollHeight-a.clientHeight,mb=b.scrollHeight-b.clientHeight;b.scrollTop=ma?a.scrollTop/ma*mb:0;progress.style.width=`${Math.min(100,a.scrollTop/Math.max(1,ma)*100)}%`;requestAnimationFrame(()=>syncing=false)}en.addEventListener('scroll',()=>sync(en,ja));ja.addEventListener('scroll',()=>sync(ja,en));prev.onclick=()=>mark(current-1,true,true);next.onclick=()=>mark(current+1,true,true);smaller.onclick=()=>{fs=Math.max(13,fs-1);document.documentElement.style.setProperty('--fs',fs+'px')};larger.onclick=()=>{fs=Math.min(24,fs+1);document.documentElement.style.setProperty('--fs',fs+'px')};document.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();mark(current+1,true,true)}if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();mark(current-1,true,true)}if(e.key==='Escape'){locked=-1;mark(current)}});mark(0);
</script></body></html>
