<header><div class="session">SESSION 9</div><div class="title"><h1>William Hodges: Artist of Empire, Part I</h1><p>Geoff Quilley — 英文に触れると対応する訳を表示／クリックで固定</p></div><div class="controls"><button id="smaller" title="文字を小さく">A−</button><button id="larger" title="文字を大きく">A＋</button><button id="prev" title="前の段落">↑</button><span class="counter" id="counter">1 / 11</span><button id="next" title="次の段落">↓</button></div></header>
<div class="progress" id="progress"></div>
<main class="app"><div class="pane en" id="en"><div class="pane-head">ENGLISH · ORIGINAL</div></div><div class="pane ja" id="ja"><div class="pane-head">日本語 · TRANSLATION</div></div></main><div class="hint">← → / ↑ ↓ で段落移動　Escで固定解除</div>
<script>
const pairs=[
{en:`The artistic career of William Hodges RA (1744–97) coincided precisely with the decline and foundation, respectively, of what have been termed “the first and second British empires.” At the close of the Seven Years’ War in 1763, when Britain established itself as the foremost imperial nation of Europe, Hodges was coming to the final year of his apprenticeship under Richard Wilson, the leading British landscape painter of the day, and emerging as an important member of the younger generation of British painters.`,ja:`王立美術院会員ウィリアム・ホッジズ（1744～97）の画家としての経歴は、それぞれ「第一および第二の大英帝国」と呼ばれてきたものの衰退と成立に、まさに重なっていた。1763年に七年戦争が終わり、イギリスがヨーロッパ随一の帝国国家となったころ、ホッジズはリチャード・ウィルソンのもとでの徒弟修業を終え、若い世代の重要な画家として頭角を現しつつあった。`},
{en:`Hodges’s subsequent career revolved around two major—indeed, by eighteenth-century standards, epic—voyages, both intimately connected with the rise of empire. The first, Captain James Cook’s second voyage to the Pacific (1772–75), to which Hodges was appointed official draughtsman, has justly been noted as one of the most important single contributions to the understanding of world geography and the natural sciences. It was also a key moment in the foundation of the methodologies of ethnography and anthropology, as they would develop in the nineteenth century.`,ja:`その後のホッジズの経歴は、18世紀の基準では叙事詩的ともいえる二つの大航海を中心に展開した。どちらも帝国の勃興と密接に結びついていた。第一は、ホッジズが公式記録画家となったクック船長の第2回太平洋航海（1772～75）である。これは世界地理と自然科学の理解への最重要級の貢献であり、19世紀に発達する民族誌学と人類学の方法論が形成される契機でもあった。`},
{en:`However, coming at a time when the British were seeking to consolidate their maritime empire, against the backdrop of Wilkite riots in London and growing colonial rebellion in America, the military and strategic importance of Cook’s voyage should not be overlooked. Hodges’s second major journey, to India (1780–83), was made …`,ja:`しかし、イギリスが海洋帝国を固めようとしていた時期、すなわちロンドンのウィルクス派暴動とアメリカ植民地で高まる反乱を背景として行われた以上、クックの航海がもった軍事的・戦略的重要性を見落としてはならない。ホッジズの第二の大旅行であるインド行き（1780～83）は……`},
{en:`… alignments and misalignments, congruences and fractures between the metropolitan and non-metropolitan spaces of empire. This relates to a series of issues, from the large question of Hodges’s role in representing the non-European world through the filter of a “European vision,” to how he tempers and adapts his visions of the Pacific and India to suit the cultural and economic demands of the metropolitan audience for art.`,ja:`……帝国の本国空間と非本国空間との間にある一致と不一致、適合と断絶である。これは、ホッジズが「ヨーロッパ的視線」というフィルターを通して非ヨーロッパ世界を表象した役割から、太平洋やインドについての見方を、本国の美術鑑賞者の文化的・経済的要求に合うよう調整した方法まで、一連の問題に関わる。`},
{en:`His career flourished at a moment not just of imperial expansion, but also of the explosive expansion of the British art world, with the formulation of a distinctive, influential and increasingly professionalized art establishment, headed by the newly formed Royal Academy. Parallel with the redefinition of the nation’s cultural and political self-image provoked by its changing imperial horizons, the theoretical and practical values of art and aesthetics were also subject to constant revision.`,ja:`彼の経歴は、帝国拡大だけでなく、イギリス美術界の爆発的拡大の時期にも栄えた。新設のロイヤル・アカデミーを頂点として、独自性と影響力をもち、ますます専門職化した美術制度が形づくられた。変化する帝国の地平が国家の文化的・政治的自己像を作り直す一方、美術と美学の理論的・実践的価値も絶えず見直された。`},
{en:`Perhaps the most marked changes occurred with respect to landscape painting, which from the 1790s was increasingly associated with discourses on national identity. Discussion of landscape was mediated through reference to the cult of the “picturesque.” Here Hodges is a key figure, in proposing landscape painting both as the obvious means of recording the topographies of empire, and, most revolutionary, as a suitably philosophical medium for evaluating them and commenting on their significance.`,ja:`最も顕著な変化は風景画に生じたのかもしれない。1790年代以降、風景画は国民的アイデンティティをめぐる言説と結びついた。「風景」の議論は「ピクチャレスク」の流行を通して行われた。ホッジズは、風景画を帝国の地形を記録する手段としただけでなく、より革新的には、その地形を評価し意味を論評する哲学的媒体として提示した点で重要である。`},
{en:`Given such apparent importance, Hodges’s significance lies, finally, in the consequent anomaly that after his death he was largely forgotten and was later effectively excised from the orthodox history of British art as it was academically articulated during the twentieth century. He was known, if at all, only as Cook’s artist or as one of the early British artists in India.`,ja:`これほど明白な重要性をもつにもかかわらず、ホッジズの意義は一つの逆説に現れる。死後、彼はほぼ忘れられ、20世紀に学問的に体系化された正統的イギリス美術史から事実上切り落とされた。知られていたとしても、クックの同行画家、またはインドで活動した初期イギリス人画家の一人としてだけだった。`},
{en:`If, in the picture of Hodges’s career, empire provided the ground on which his art was composed, its frame was war. He both was born and died during periods of war, and for nearly half of his life Britain was involved in major—and increasingly global—conflicts. Born in London in 1744, the son of a smith, Hodges’s artistic training overlapped with the Seven Years’ War, as a result of which Britain acquired unprecedented colonial possessions.`,ja:`ホッジズの経歴を一枚の絵にたとえるなら、芸術が描かれる「地」を帝国が提供し、その「額縁」を戦争が形づくった。彼は戦争の時代に生まれ、戦争の時代に死んだ。生涯のほぼ半分、イギリスは大規模で次第に世界規模となる紛争に関与した。彼の美術修業は七年戦争と重なり、その結果イギリスは前例のない規模の植民地を獲得した。`},
{en:`On his return from Cook’s voyage in 1775, Britain was launching itself into the American Revolutionary War; and his time in India coincided with the First Maratha War and the Second Mysore War. Hodges witnessed British engagements in India at first hand, celebrating the “opportunity … of observing the military operations of a siege.” War, openly or discreetly addressed, is a recurrent subject for his art, including his final one-man exhibition in 1794–95 of War and Peace.`,ja:`1775年にクックの航海から帰ると、イギリスはアメリカ独立戦争へ突入しつつあった。インド滞在は第一次マラーター戦争と第二次マイソール戦争に重なり、ホッジズはイギリス軍の戦闘を直接目撃して「包囲戦の軍事行動を観察する機会」を喜んだ。戦争は明示的であれ控えめであれ、最後の個展『戦争と平和』を含め、彼の芸術に繰り返し現れる。`},
{en:`The exhibition was closed down at the prompting of the Duke of York, on the grounds that its treatment of war was dangerously radical. This disgrace led Hodges to abandon painting, auction his remaining pictures and invest in a banking partnership in Devon. The unstable financial climate caused by the ongoing war with France led to the failure of the bank in 1797, and Hodges died immediately upon his return from a journey to Dartmouth to close it.`,ja:`個展は戦争の扱いが危険なほど急進的だとして、ヨーク公の働きかけで閉鎖された。この不名誉のためホッジズは絵を捨て、残りの作品を競売にかけ、デヴォンの共同経営銀行へ投資した。フランスとの戦争による不安定な金融情勢で銀行は1797年に破綻し、ホッジズは銀行を閉鎖するためダートマスへ行き、戻った直後に死亡した。`},
{en:`What is significant is the centrality of war to Hodges’s career and to its demise. Yet he was not an advocate of war. His writings lament the ruinous impact of war upon art and civilized culture. However disingenuous this may seem, given his reliance upon the military both for security and subject matter, it betokens a sentimental idealization of peace as the opposite of “the great scourge of human nature, the great enemy of the arts, war.” This was allied to nostalgia for the past that suffuses his monuments, ruins and landscapes.`,ja:`重要なのは、戦争がホッジズの経歴とその終焉の中心にあったことである。だが彼は戦争の擁護者ではなく、文章では戦争が芸術と文明文化に与える破壊的影響を嘆いた。安全と題材を軍隊に依存していたため不誠実にも見えるが、それは「人間性を襲う大災厄、芸術の大敵である戦争」の反対物として、平和を感傷的に理想化する態度を示す。この態度は、彼の記念建造物・廃墟・風景にしみ込む過去への郷愁と結びついていた。`}
];
const en=document.getElementById('en'),ja=document.getElementById('ja'),counter=document.getElementById('counter'),progress=document.getElementById('progress');let locked=-1,current=0,syncing=false,fs=17;
pairs.forEach((p,i)=>{for(const [pane,key] of [[en,'en'],[ja,'ja']]){const s=document.createElement('section');s.className='card';s.dataset.i=i;s.dataset.n=String(i+1).padStart(2,'0');s.textContent=p[key];pane.appendChild(s)}});const E=[...en.querySelectorAll('.card')],J=[...ja.querySelectorAll('.card')];
function mark(i,lock=false,scroll=false){current=Math.max(0,Math.min(pairs.length-1,i));[...E,...J].forEach(x=>x.classList.remove('active'));E[current].classList.add('active');J[current].classList.add('active');counter.textContent=`${current+1} / ${pairs.length}`;if(lock)locked=current;if(scroll){E[current].scrollIntoView({block:'center',behavior:'smooth'});J[current].scrollIntoView({block:'center',behavior:'smooth'})}}
[E,J].forEach((list,side)=>list.forEach((c,i)=>{c.addEventListener('mouseenter',()=>{if(locked<0){mark(i);(side?E:J)[i].scrollIntoView({block:'center',behavior:'smooth'})}});c.addEventListener('click',()=>mark(i,true,true))}));
function sync(a,b){if(syncing)return;syncing=true;const maxA=a.scrollHeight-a.clientHeight,maxB=b.scrollHeight-b.clientHeight;b.scrollTop=maxA? a.scrollTop/maxA*maxB:0;progress.style.width=`${Math.min(100,a.scrollTop/Math.max(1,maxA)*100)}%`;requestAnimationFrame(()=>syncing=false)}en.addEventListener('scroll',()=>sync(en,ja));ja.addEventListener('scroll',()=>sync(ja,en));
document.getElementById('prev').onclick=()=>mark(current-1,true,true);document.getElementById('next').onclick=()=>mark(current+1,true,true);document.getElementById('smaller').onclick=()=>{fs=Math.max(13,fs-1);document.documentElement.style.setProperty('--fs',fs+'px')};document.getElementById('larger').onclick=()=>{fs=Math.min(24,fs+1);document.documentElement.style.setProperty('--fs',fs+'px')};document.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();mark(current+1,true,true)}if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();mark(current-1,true,true)}if(e.key==='Escape'){locked=-1;mark(current)}});mark(0);
</script>
