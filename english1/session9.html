<header><div class="session">SESSION 9</div><div class="title"><h1>William Hodges: Artist of Empire, Part I</h1><p>Geoff Quilley — 英文に触れると対応する訳を表示／クリックで固定</p></div><div class="controls"><button id="smaller" title="文字を小さく">A−</button><button id="larger" title="文字を大きく">A＋</button><button id="prev" title="前の段落">↑</button><span class="counter" id="counter">1 / 13</span><button id="next" title="次の段落">↓</button></div></header>

<main class="app"><div class="pane en" id="en"><div class="pane-head">ENGLISH · ORIGINAL</div></div><div class="pane ja" id="ja"><div class="pane-head">日本語 · TRANSLATION</div></div></main><div class="hint">← → / ↑ ↓ で段落移動　Escで固定解除</div>
<script>
const pairs=[
{en:`The artistic career of William Hodges RA (1744–97) coincided precisely with the decline and foundation, respectively, of what have been termed “the first and second British empires.” At the close of the Seven Years’ War in 1763, when Britain established itself as the foremost imperial nation of Europe, Hodges was coming to the final year of his apprenticeship under Richard Wilson, the leading British landscape painter of the day, and emerging as an important member of the younger generation of British painters.`,ja:`王立美術院会員ウィリアム・ホッジズ（1744～97）の画家としての経歴は、それぞれ「第一および第二の大英帝国」と呼ばれてきたものの衰退と成立に、まさに重なっていた。1763年に七年戦争が終わり、イギリスがヨーロッパ随一の帝国国家となったころ、ホッジズはリチャード・ウィルソンのもとでの徒弟修業を終え、若い世代の重要な画家として頭角を現しつつあった。`},
{en:`Hodges’s subsequent career revolved around two major—indeed, by eighteenth-century standards, epic—voyages, both intimately connected with the rise of empire. The first, Captain James Cook’s second voyage to the Pacific (1772–75), to which Hodges was appointed official draughtsman, has justly been noted as one of the most important single contributions to the understanding of world geography and the natural sciences. It was also a key moment in the foundation of the methodologies of ethnography and anthropology, as they would develop in the nineteenth century, and Hodges’s works from the voyage have frequently been cited in this connection.`,ja:`その後のホッジズの経歴は、18世紀の基準では叙事詩的ともいえる二つの大航海を中心に展開した。どちらも帝国の勃興と密接に結びついていた。第一は、ホッジズが公式記録画家となったクック船長の第2回太平洋航海（1772～75）である。これは世界地理と自然科学の理解への最重要級の貢献であり、19世紀に発達する民族誌学と人類学の方法論が形成される契機でもあった。航海中のホッジズ作品は、この関連でしばしば引用されてきた。`},
{en:`However, coming at a time when the British were seeking to consolidate their maritime empire, against the backdrop of Wilkite riots in London and growing colonial rebellion in America, the military and strategic importance of Cook’s voyage should not be overlooked. Hodges’s second major journey, to India (1780–83), was made under the patronage of the first Governor General, Warren Hastings, and with the full support of the East India Company, which is given due acknowledgement in Hodges’s subsequent publications of Indian subjects. It coincided with a period of concentrated British military action against local rulers, in particular the conflict with Chait Singh that would figure prominently in Hastings’s later impeachment. Not only was Hodges reliant on East India Company forces in paving the way for him to travel through the contested territories west of Bengal, but his painterly subjects also frequently represent overtly the recent and ongoing history of British conquest in India.`,ja:`しかし、イギリスが海洋帝国を固めようとしていた時期、すなわちロンドンのウィルクス派暴動とアメリカ植民地で高まる反乱を背景として行われた以上、クックの航海がもった軍事的・戦略的重要性を見落としてはならない。ホッジズの第二の大旅行であるインド行き（1780～83）は、初代総督ウォレン・ヘイスティングズの後援と東インド会社の全面的支援のもとで実現した。旅行は、イギリス軍が現地支配者に対して集中的に軍事行動を行った時期と重なった。ホッジズは、ベンガル西方の係争地域を旅するため東インド会社軍に頼っただけでなく、彼の絵の主題も、イギリスによるインド征服の直近かつ進行中の歴史をしばしば明白に表している。`},
{en:`It is not just that the rise of empire facilitated Hodges’s art, providing him with subjects and making him surely the most widely travelled artist of his day, it also provided commercial opportunities for the artist-entrepreneur, which operated within a specifically metropolitan context: “empire” was itself given visual and conceptual definition by Hodges’s (and, of course, others’) representations of the non-European world. At the very least, they provided or consolidated the cognitive assimilation of the territories depicted, by making an explicit connection, through the visual artefact, between those territories and the British metropolis.`,ja:`帝国の勃興は、ホッジズに題材を与え、彼を当時もっとも広範囲を旅した画家にしたことで、その芸術を可能にしただけではない。帝国は、本国中心の状況で活動する「芸術家＝事業家」としての商業的機会も与えた。「帝国」自体が、ホッジズらによる非ヨーロッパ世界の表象を通して、視覚的・概念的な輪郭を与えられた。作品は、描かれた領土とイギリス本国を視覚的に結びつけ、その領土を人々の認識の中に取り込み、定着させた。`},
{en:`Hodges’s importance lies, therefore, in four principal areas, the first and most striking of which is that he was the first professional landscape artist (British or otherwise) to represent such extensive global territories so profusely and on such a scale; and that this artistic production was the result of a complex symbiosis between the development of British art and the rise of British global dominion. Secondly, he figures crucially, within the larger context of the history of eighteenth-century colonialism, in being pivoted between colonial and metropolitan spheres: his work and career provide an important case study of the exchanges, relations, alignments and misalignments, congruences and fractures between the metropolitan and non-metropolitan spaces of empire. This relates to a series of issues, from the large question of Hodges’s role in representing the non-European world through the filter of a “European vision,” to how he tempers and adapts his visions of the Pacific and India to suit the cultural and economic demands of the metropolitan audience for art.`,ja:`ホッジズの重要性は主に四つの領域にある。第一に、彼は広大な世界各地を大量かつ大規模に表現した最初の職業的風景画家であり、その制作はイギリス美術の発展と世界的支配の勃興との複雑な共生関係から生まれた。第二に、彼は植民地と本国の領域を結ぶ重要な位置を占める。彼の作品と経歴は、本国空間と非本国空間の間の交流、関係、一致と不一致、適合と断絶を考察する事例となる。これは「ヨーロッパ的視線」を通した非ヨーロッパ世界の表象から、太平洋やインドについての見方を本国市場の要求に合わせて調整した方法までに関わる。`},
{en:`In this connection, thirdly, it is significant that his career flourished at a moment not just of imperial expansion, but also of the explosive expansion of the British art world, with the formulation of a distinctive, influential and increasingly professionalized art establishment, headed by the newly formed Royal Academy. Parallel with the redefinition of the nation’s cultural and political self-image provoked by its changing imperial horizons (of which Hodges was himself a catalyst), the theoretical and practical values of art and aesthetics were also subject to constant revision through this period.`,ja:`第三に重要なのは、彼の経歴が、帝国拡大だけでなくイギリス美術界の爆発的拡大の時期にも栄えたことである。新設のロイヤル・アカデミーを頂点として、独自性と影響力をもち、専門職化した美術制度が形づくられた。変化する帝国の地平が国家の文化的・政治的自己像を作り直す一方、美術と美学の理論的・実践的価値も絶えず見直された。`},
{en:`Perhaps the most marked changes occurred with respect to landscape painting, which from the 1790s was increasingly associated with discourses on national identity and the question of what might properly constitute the character of a national style of painting. Discussion of landscape, as both physical topography and visual representation, was particularly mediated through reference to the cult of the “picturesque,” and in this regard the aesthetics of landscape have been critically linked to the imperial context. But wider connections between imperialism and the discourse of landscape at this period surely cannot be overlooked. Here Hodges is a key figure, in proposing landscape painting, in theory and practice, both as the obvious means of recording the topographies of empire, and (most revolutionary) also as a suitably philosophical medium for evaluating them and commenting on their significance.`,ja:`最も顕著な変化は風景画に生じたのかもしれない。1790年代以降、風景画は国民的アイデンティティや国民的絵画様式をめぐる言説と結びついた。物理的地形であると同時に視覚表象でもある「風景」の議論は、「ピクチャレスク」の流行を参照することで媒介され、風景美学は帝国の文脈と結びつけられた。ホッジズは、風景画を帝国の地形を記録する手段だけでなく、その地形を評価し意味を論評する哲学的媒体としても提示した。`},
{en:`Given such apparent importance, therefore, Hodges’s significance lies, finally, in the consequent anomaly that after his death he was largely forgotten and was later effectively excised from the orthodox history of British art as it was academically articulated during the twentieth century. He was known, if at all, only as Cook’s artist or as one of the early British artists in India. Until now there has been no fully representative monographic exhibition devoted to him.`,ja:`これほど明白な重要性をもつにもかかわらず、ホッジズの意義は最後には一つの逆説に現れる。死後、彼はほぼ忘れられ、20世紀に学問的に体系化された正統的イギリス美術史から事実上切り落とされた。知られていたとしても、クックの同行画家、またはインドで活動した初期イギリス人画家の一人としてだけだった。これまで彼一人を十分に代表する回顧展は開かれてこなかった。`},
{en:`If, in the picture of Hodges’s career, empire provided the ground on which his art was composed, its frame was war. He both was born and died during periods of war, and for nearly half of his life Britain was involved in major—and increasingly global—conflicts. Born in London, in 1744, the son of a smith, when the country was in the middle of the War of the Austrian Succession, Hodges’s artistic training, first at William Shipley’s drawing school, followed by his apprenticeship to Richard Wilson, overlapped with the Seven Years’ War, as a result of which Britain acquired unprecedented colonial possessions, principally in India, North America and Canada, and the Caribbean.`,ja:`ホッジズの経歴を一枚の絵にたとえるなら、芸術が描かれる「地」を帝国が提供し、その「額縁」を戦争が形づくった。彼は戦争の時代に生まれ、戦争の時代に死んだ。鍛冶職人の息子として1744年のロンドンに生まれた時、国はオーストリア継承戦争のさなかにあった。ウィリアム・シプリーの図画学校、次いでリチャード・ウィルソンのもとで行った美術修業は七年戦争と重なり、その結果イギリスはインド、北米・カナダ、カリブ海で前例のない植民地を獲得した。`},
{en:`On his return from Cook’s voyage in 1775, Britain was launching itself into the internecine colonial conflict of the American Revolutionary War; and his time in India coincided with the final phase of the First Maratha War and the bulk of the Second Mysore War. Hodges, indeed, witnessed British engagements in India at first hand, celebrating the “opportunity which falls to the lot of but few professional men in my line; I mean that of observing the military operations of a siege.” War, openly or discreetly addressed, is a recurrent subject for his art, whether in the context of Tahiti, or India, or his final one-man exhibition in 1794–95 of War and Peace.`,ja:`1775年にクックの航海から帰ると、イギリスはアメリカ独立戦争へ突入しつつあった。インド滞在は第一次マラーター戦争末期と第二次マイソール戦争の大部分に重なり、ホッジズはイギリス軍の戦闘を直接目撃して「包囲戦の軍事行動を観察する機会」を喜んだ。戦争は、タヒチ、インド、そして1794～95年の最後の個展『戦争と平和』に至るまで、彼の芸術に繰り返し現れる主題である。`},
{en:`As a consequence, war, both as subject for that exhibition and also as the wider cultural background against which it was produced and received, was critically influential upon the turn of events that led to his death. For not only was the exhibition closed down at the prompting of the Duke of York, on the grounds that the treatment of such subjects was dangerously radical, in Britain’s first year of war with Revolutionary France, but this disgrace also led Hodges to abandon painting, auction his remaining pictures—including War and Peace—and to invest his funds in a banking partnership in Devon, for which he abandoned London and moved to Brixham in 1795.`,ja:`戦争は、その個展の主題であると同時に、作品が制作され受容された広い文化的背景でもあり、彼の死へつながる出来事に決定的な影響を与えた。革命期フランスとの戦争が始まった年、個展は主題の扱いが危険なほど急進的だとしてヨーク公の働きかけで閉鎖された。この不名誉のため、ホッジズは絵を捨て、『戦争と平和』を含む残りの作品を競売にかけ、資金をデヴォンの共同経営銀行に投じ、1795年にロンドンを離れてブリクサムへ移った。`},
{en:`The unstable financial climate caused by the ongoing war with France in 1797 led to the failure of the bank and Hodges died immediately upon his return from the journey to Dartmouth to close it. There was mention of financial corruption and also rumour that Hodges had committed suicide, but these issues remain unresolved.`,ja:`1797年、フランスとの戦争がもたらした不安定な金融情勢によって銀行は破綻し、ホッジズは銀行を閉鎖するためダートマスへ行き、戻った直後に死亡した。資金上の不正や自殺の噂もあったが、真相は解明されていない。`},
{en:`What is significant is the centrality of war to Hodges’s career and to its demise. However, this is not to say that he was an advocate of war. On the contrary, his writings frequently lament the ruinous impact of war upon the practice of art, as well as other aspects of civilized culture. However disingenuous this may seem, given his reliance, particularly in India, upon the military both for his security and his painterly subject matter, it betokens a sentimental idealization of peace, as the opposite of “the great scourge of human nature, the great enemy of the arts, war” (Travels); that is, in the first place, typical of the gestures of late eighteenth-century discourse of sensibility, and, secondly, allied to a form of nostalgia for the past that suffuses Hodges’s sense of history with respect to the monuments, ruins and landscapes comprising the majority of his art.`,ja:`重要なのは、戦争がホッジズの経歴とその終焉の中心にあったことである。とはいえ、彼が戦争の擁護者だったわけではない。逆に彼の文章は、芸術活動や文明文化の他の側面に戦争が及ぼす破壊的影響をしばしば嘆いている。特にインドでは、安全と絵の題材の両方を軍隊に依存していたことを考えると、不誠実にも見える。しかしそれは、「人間性を襲う大災厄、芸術の大敵である戦争」（『インド旅行記』）の反対物として平和を感傷的に理想化する態度を示す。これは18世紀後半の感受性をめぐる言説に典型的であり、また、彼の作品の大半を占める記念建造物・廃墟・風景についての歴史感覚にしみ込む、過去への郷愁と結びついていた。`}
];
const en=document.getElementById('en'),ja=document.getElementById('ja'),counter=document.getElementById('counter'),progress=document.getElementById('progress');let locked=-1,current=0,syncing=false,fs=17;
pairs.forEach((p,i)=>{for(const [pane,key] of [[en,'en'],[ja,'ja']]){const s=document.createElement('section');s.className='card';s.dataset.i=i;s.dataset.n=String(i+1).padStart(2,'0');s.textContent=p[key];pane.appendChild(s)}});const E=[...en.querySelectorAll('.card')],J=[...ja.querySelectorAll('.card')];
function mark(i,lock=false,scroll=false){current=Math.max(0,Math.min(pairs.length-1,i));[...E,...J].forEach(x=>x.classList.remove('active'));E[current].classList.add('active');J[current].classList.add('active');counter.textContent=`${current+1} / ${pairs.length}`;if(lock)locked=current;if(scroll){E[current].scrollIntoView({block:'center',behavior:'smooth'});J[current].scrollIntoView({block:'center',behavior:'smooth'})}}
[E,J].forEach((list,side)=>list.forEach((c,i)=>{c.addEventListener('mouseenter',()=>{if(locked<0){mark(i);(side?E:J)[i].scrollIntoView({block:'center',behavior:'smooth'})}});c.addEventListener('click',()=>mark(i,true,true))}));
function sync(a,b){if(syncing)return;syncing=true;const maxA=a.scrollHeight-a.clientHeight,maxB=b.scrollHeight-b.clientHeight;b.scrollTop=maxA? a.scrollTop/maxA*maxB:0;progress.style.width=`${Math.min(100,a.scrollTop/Math.max(1,maxA)*100)}%`;requestAnimationFrame(()=>syncing=false)}en.addEventListener('scroll',()=>sync(en,ja));ja.addEventListener('scroll',()=>sync(ja,en));
document.getElementById('prev').onclick=()=>mark(current-1,true,true);document.getElementById('next').onclick=()=>mark(current+1,true,true);document.getElementById('smaller').onclick=()=>{fs=Math.max(13,fs-1);document.documentElement.style.setProperty('--fs',fs+'px')};document.getElementById('larger').onclick=()=>{fs=Math.min(24,fs+1);document.documentElement.style.setProperty('--fs',fs+'px')};document.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();mark(current+1,true,true)}if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();mark(current-1,true,true)}if(e.key==='Escape'){locked=-1;mark(current)}});mark(0);
</script>
