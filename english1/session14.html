<style>
:root{
  --ink:#172033;--muted:#667085;--line:#dce2ea;--left:#fbfcff;--right:#fffdfa;
  --accent:#7756c6;--accent2:#f1ecff;--head:112px;--fs:17px;--panel:#fff;
  --shadow:0 10px 30px #16213d12;--mark:#ffe58f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#eef1f5;color:var(--ink);font-family:"Segoe UI","Yu Gothic UI",sans-serif}
body{overflow:hidden}
header{height:var(--head);display:flex;align-items:center;gap:16px;padding:12px 18px;background:#14213d;color:white;border-bottom:4px solid var(--accent);position:relative;z-index:20}

.title{min-width:0;flex:1}
.title h1{font-size:clamp(17px,1.9vw,26px);margin:0 0 3px}
.title p{margin:0;color:#b9c2d3;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
button,select,input{font:inherit}
button,.selectlike{border:1px solid #64718a;background:#263552;color:white;border-radius:8px;height:34px;font-weight:700;cursor:pointer}
button{min-width:34px;padding:0 9px}
button:hover,.selectlike:hover{background:#36496f}
button.on{background:#7756c6;border-color:#a58ae6}
select.selectlike{padding:0 8px}
.search{height:34px;width:min(230px,18vw);border:1px solid #64718a;background:#fff;color:#172033;border-radius:8px;padding:0 10px;outline:none}
.counter{min-width:58px;text-align:center;font-variant-numeric:tabular-nums;font-size:12px}
.progress{position:fixed;top:calc(var(--head) - 4px);left:0;width:0;height:4px;background:#bba3ff;z-index:30;transition:width .15s}
.app{height:calc(100vh - var(--head));display:grid;grid-template-columns:1fr 1fr}
.pane{overflow:auto;scroll-behavior:smooth;padding:18px clamp(16px,2.8vw,42px) 80px;font-size:var(--fs);line-height:1.82}
.pane.en{background:var(--left);border-right:1px solid var(--line);font-family:Georgia,"Times New Roman",serif}
.pane.ja{background:var(--right)}
.pane-head{position:sticky;top:-18px;z-index:4;margin:-18px -10px 16px;padding:14px 10px 10px;background:inherit;border-bottom:1px solid var(--line);font:800 11px/1 "Segoe UI",sans-serif;letter-spacing:.14em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.card{position:relative;margin:0 0 16px;padding:18px 20px 18px 58px;border:1px solid transparent;border-radius:12px;white-space:pre-wrap;transition:.16s;min-height:90px}
.card::before{content:attr(data-n);position:absolute;left:15px;top:19px;min-width:29px;height:25px;padding:0 5px;border-radius:999px;display:grid;place-items:center;background:#e8edf4;color:#536076;font:700 11px/1 "Segoe UI",sans-serif}
.card::after{content:attr(data-label);display:block;margin-top:10px;color:#8a94a6;font:600 10px/1.25 "Segoe UI",sans-serif;letter-spacing:.04em}
.card:hover,.card.active{background:var(--accent2);border-color:#b7a3e7;box-shadow:var(--shadow)}
.card.active{outline:2px solid var(--accent);outline-offset:-2px}
.card.bookmarked::before{background:#fff2b8;color:#8b6510}
.card.hidden-by-search{display:none}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.floating{position:fixed;right:14px;bottom:12px;display:flex;gap:7px;z-index:12}
.floating button{background:#16223bdd;backdrop-filter:blur(6px);font-size:12px;border-color:#536076}
.drawer{position:fixed;right:14px;top:calc(var(--head) + 12px);width:min(390px,calc(100vw - 28px));max-height:calc(100vh - var(--head) - 26px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px #11182730;z-index:40;padding:16px;display:none}
.drawer.open{display:block}
.drawer h2{margin:0 0 8px;font-size:16px}
.drawer p{margin:0 0 12px;line-height:1.65;font-size:13px;color:var(--muted)}
.drawer textarea{width:100%;min-height:180px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;font:14px/1.55 "Segoe UI","Yu Gothic UI",sans-serif;background:#fff;color:#172033}
.drawer .row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.drawer button{background:#263552}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(20px);opacity:0;background:#111827e8;color:white;padding:9px 13px;border-radius:9px;font-size:12px;z-index:60;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.summarybox{margin:0 0 16px;padding:15px 18px;border:1px solid #d8d0ef;border-radius:12px;background:#f7f4ff;font-family:"Segoe UI","Yu Gothic UI",sans-serif;font-size:14px;line-height:1.7}
.summarybox strong{color:#5f42aa}
.summarybox.collapsed .sumtext{display:none}
.translation-hidden .pane.ja .card{filter:blur(8px);user-select:none;cursor:pointer}
.translation-hidden .pane.ja .card.active{filter:blur(5px)}
.view-en .app{grid-template-columns:1fr}
.view-en .pane.ja{display:none}
.view-ja .app{grid-template-columns:1fr}
.view-ja .pane.en{display:none}
.focus-mode .pane .card:not(.active){opacity:.22;filter:grayscale(.5)}
.dark{--ink:#e8edf7;--muted:#aab4c7;--line:#34405a;--left:#171d2a;--right:#1c1b22;--accent2:#352b52;--panel:#202738;--mark:#695819}
.dark body{background:#0f1420}
.dark .card::before{background:#2c3548;color:#c8d1e3}
.dark .drawer textarea,.dark .search{background:#111827;color:#eef2ff;border-color:#475569}
.dark .summarybox{background:#2a2340;border-color:#4d416e}
@media(max-width:900px){

  header{align-items:flex-start;flex-wrap:wrap;padding:10px 12px}

}

<script>
const pairs=[{"range": "1–6", "label": "Igbo republicanism", "en": "(1) As representations of the Igbo past, the most surprising feature of the cultural epics is the complete occlusion of republicanism and village democracy as political forms (Haynes 2005a, 16–17; Haynes 2006; Dandaura and Okoli 2010; Olaoluwa 2014). (2) In the movies, there is always an igwe surrounded by a council of elders. (3) Kingship was not unknown among the Igbos, but generally the Igbos did not have kings and did not want them. (4) In Things Fall Apart, when the first white men come to Mbanta, “They asked who the king of the village was, but the villagers told them that there was no king. (5) ‘We have men of high title and the chief priests and the elders,’ they said” (Achebe 1994b, 148). (6) One of the first things Achebe shows us about Igbo society is direct democracy in action, the ten thousand freeborn clansmen of Umuofia meeting to debate a resolution to go to war (ibid., 10).", "ja": "(1) イボ族の過去を描く文化的叙事映画で最も意外なのは、実際のイボ社会に重要だった共和制や村落民主制という政治のあり方が、映画の中ではほとんど描かれていないことです。(2) 映画では、たいていイグウェ（王・伝統的支配者）がいて、その周りを長老会議が取り囲んでいます。(3) イボ社会に王がまったく存在しなかったわけではありませんが、一般にイボ人には王がおらず、王を置くことも望んでいませんでした。(4) アチェベの『Things Fall Apart（崩れゆく絆）』では、最初の白人たちがムバンタに来たとき、「この村の王は誰か」と尋ねます。しかし村人たちは、王はいないと答えます。(5) そして「高い称号を持つ者や祭司、長老たちはいる」と説明します。(6) アチェベがイボ社会について早い段階で示すものの一つが、まさに直接民主制です。ウムオフィアでは、自由民である一万人もの氏族の男たちが集まり、戦争を始めるかどうかの決議を議論します。"}, {"range": "7–13", "label": "Colonial rule", "en": "(7) The British, themselves saddled with an absurd monarchy and aristocracy, had trouble understanding a democratic African society; in any case they could not tolerate it, because of the inherently anti-democratic character of the colonial project and the practical necessity, given how few British colonizers there ever were in Nigeria, to institute a policy of “indirect rule” through pliable local chiefs. (8) Since chiefs in the required sense did not exist in Igboland, the British invented them: the so-called “Warrant Chiefs” (Afigbo 1972). (9) They were generally despised. (10) Often they were drawn from what many Igbo considered the dregs of society, and they were hated not just for their collaboration with the colonizers but for their flagrant corruption. (11) Under successive structures of colonial and postcolonial governance, “traditional rulers” were certified or invented in order to play a mediating role between local communities and higher levels of government (Jones 1970; Harneit-Sievers 1998; cf. Mamdani 1996). (12) They have blossomed in number and social prominence since the 1970s (Harneit-Sievers 1998). (13) Over time they became familiar elements of the political and social landscape and gradually lost some or most of their aura of illegitimacy.", "ja": "(7) イギリス人は、自分たち自身が君主制と貴族制を抱える社会に生きていたこともあり、民主的なアフリカ社会を理解するのに苦労しました。しかも植民地支配そのものが反民主的な性格を持っていたうえ、ナイジェリアにいたイギリス人植民者はごく少数でした。そのため、従わせやすい現地の首長を通して統治する「間接統治」を行う必要があり、イボ社会の民主的な仕組みをそのまま認めることはできませんでした。(8) ところがイボランドには、イギリス側が必要とするような「首長」がもともと存在しませんでした。そこでイギリスは、いわゆる「ワラント・チーフ（Warrant Chiefs）」を新たに作り出しました。(9) 彼らは一般に人々から軽蔑されていました。(10) その中には、イボ人の多くが社会的に低い立場と見なしていた人々から選ばれた者も多く、植民地支配者に協力したことだけでなく、目に余る腐敗のためにも嫌われました。(11) その後も、植民地期から独立後にかけて、地域社会と上位の政府を仲介するために「伝統的支配者」が公認されたり、新たに作られたりしました。(12) 1970年代以降、こうした支配者は数を増やし、社会的な存在感も大きくなりました。(13) 時間がたつにつれて彼らは政治・社会の風景にすっかりなじみ、「本来の伝統には根拠がない」という印象も次第に薄れていきました。"}, {"range": "14–17", "label": "Achebe’s critique", "en": "(14) But hear Achebe, in his 1983 screed The Trouble with Nigeria: (15) The bankrupt state of Igbo leadership is best illustrated in the alacrity with which they have jettisoned their traditional republicanism in favour of mushroom kingships. (16) From having no kings in their recent past the Igbo swung around to set an all-time record of four hundred “kings” in Imo and four hundred in Anambra! And most of them are traders in their stall by day and monarchs at night; city dwellers five days a week and traditional village rulers on Saturdays and Sundays! They adopt “traditional” robes from every land, including, I am told, the ceremonial regalia of the Lord Mayor of London! (17) The degree of travesty to which the Igbo man is apparently ready to reduce his institutions in his eagerness “to get up” can be truly amazing. (Achebe 1983)", "ja": "(14) しかし、アチェベが1983年の『The Trouble with Nigeria』で行った痛烈な批判を見てみましょう。(15) アチェベによれば、イボの指導者層の破綻ぶりは、伝統的な共和制をあっさり捨て、雨後のたけのこのように乱立する「王制」を受け入れたことに最もよく表れています。(16) つい最近まで王などいなかったはずのイボ社会に、イモ州で400人、アナンブラ州でも400人という前代未聞の数の「王」が生まれました。しかも、その多くは昼間は店で商売をし、夜になると君主になる。平日は都市で暮らし、土日だけ村の伝統的支配者になる、といった具合です。衣装まで各地の「伝統」から取り入れ、ロンドン市長の儀礼服まで真似しているというのです。(17) アチェベは、イボ人が「成り上がろう」とするあまり、自分たちの制度をここまで滑稽なものに変えてしまうことがある、と強く批判しています。"}, {"range": "18–22", "label": "Monarchy in the movies", "en": "(18) Why have the igwes so completely displaced the memory of republicanism and village democracy in the movies? (19) I have never seen an epic that offers an image of village democracy beyond a bare glimpse of rule by a council of elders until an igwe can be installed. (20) Pestilence (2004) begins in such an anomic, unhappy state, before a whole new set of institutions—chief priest, laws and customs, and an igwe—can be instituted. (21) In Kasalama: The Slave Merchant, a dibia addresses the elders of a community, reproaching them for the delay in choosing a new igwe after the death of the old one: “Any community or a group of communities without an igwe is like a slave land.” (22) Monarchy is assumed to be a stronger, normative form.", "ja": "(18) では、なぜ映画の中では、イグウェが共和制や村落民主制の記憶をこれほど完全に押しのけてしまったのでしょうか。(19) 筆者によれば、イグウェが選ばれるまで一時的に長老会議が統治している場面を少し見せる程度ならあっても、村人たちによる民主的な政治そのものをきちんと描いた叙事映画はほとんどありません。(20) たとえば『Pestilence』（2004）は、社会の規範や秩序が失われた不幸な状態から始まり、その後、祭司長・法律と慣習・イグウェという新しい制度一式が整えられていきます。(21) 『Kasalama: The Slave Merchant』では、ディビア（宗教的・霊的な専門家）が長老たちに対し、前のイグウェが死んだのに新しいイグウェをなかなか選ばないことを責め、「イグウェのいない共同体、あるいは共同体の集まりは、奴隷の土地のようなものだ」と言います。(22) つまり映画の中では、君主制のほうが、より強く、当然あるべき政治形態として扱われているのです。"}, {"range": "23–28", "label": "Political spectacle", "en": "(23) The proximate example of Yoruba “kabiyesi films” must be a powerful factor, reinforced by other national political and cultural framings in which the Igbos needed an equivalent monarchical figure. (24) The British imported into Nigeria the durbar of traditional rulers, a crucial form of political spectacle in colonial India. (25) In the 1950s, following the same logic, after the Northern and Western Regions had set up their own “Houses of Chiefs” as upper legislative chambers on the Westminster model, the predominantly Igbo Eastern Region decided it had better have one too (Jones 1970; Harneit-Sievers 1998). (26) The displays of ethnic identity within the Nigerian national identity at FESTAC continued the tradition (Apter 2005). (27) Larkin points out that from colonial times, “For Northern rulers, having one’s installation filmed became part of the symbolic repertoire of royal authority. . . . Filming, and the demand to be filmed, had become part of how elite status was constituted” (2008, 104–5). (28) Coverage of traditional rulers remains a staple of Nigerian television programming.", "ja": "(23) その理由の一つとして、ヨルバ映画にすでに存在していた「カビエシ映画」、つまり王を中心に据えた映画の影響は大きかったはずです。さらに、ナイジェリアの政治や文化を民族ごとに表現する枠組みの中で、イボ人にもヨルバなどに対応する「王のような人物」が必要だと考えられるようになりました。(24) イギリスは植民地期のインドで重要な政治的見世物だった、伝統的支配者によるダーバル（大規模な儀礼的集会）をナイジェリアにも持ち込みました。(25) 1950年代には、北部地域と西部地域がウェストミンスター型の上院にあたる「首長院」を設けると、イボ人が多数を占める東部地域も「自分たちにも必要だ」と考えて同じ制度を設けました。(26) FESTACでも、ナイジェリアという一つの国家の中で各民族のアイデンティティを見せるという形で、この伝統が続きました。(27) ラーキンによれば、植民地期以来、北部の支配者にとって就任式を撮影してもらうこと自体が王権を示す象徴の一つになっていました。撮影されること、そして撮影を求めることそのものが、エリートとしての地位を作り出す一部になっていたのです。(28) 現在でも、伝統的支配者を取り上げる報道はナイジェリアのテレビ番組の定番です。"}, {"range": "29–32", "label": "Why monarchy works on screen", "en": "(29) Dramatic convenience and habit probably also enter into it. (30) Monarchical decisions, even after consultation with a council, are more efficiently represented than the palavers of democracy or the diffused functioning of the segmented lineages of Igbo clans. (31) The Hollywood model of action by a single hero may also be relevant. (32) The emotional structures of the (more or less) nuclear family are easily projected onto a monarchical royal family, with a pleasant sense of inflation, enabling the whole usual set of romantic and family-melodramatic issues to be played out in this setting: jealousy among cowives and/or siblings (Red Matchet), and children whose romantic choices do not meet with parental approval (Ola) or are otherwise wayward or persecuted (Amina).", "ja": "(29) さらに、単純に「ドラマとして描きやすい」という事情や、既に定着した表現上の慣習も関係しているでしょう。(30) 王が長老会議に相談したうえで最終決定を下す、という形なら、村人たちが長時間議論して合意を作る民主制や、複数の血縁集団に権限が分散しているイボ社会の仕組みより、はるかに簡潔に映像化できます。(31) 一人の主人公が行動を起こして物語を動かす、というハリウッド型の物語構造も関係しているかもしれません。(32) また、私たちになじみのある家族の感情関係を、王家という少し大げさで華やかな舞台にそのまま拡大して描くこともできます。そのため、複数の妻や兄弟姉妹のあいだの嫉妬（『Red Matchet』）、親が認めない恋愛（『Ola』）、問題を起こしたり迫害されたりする子ども（『Amina』）といった、恋愛・家族メロドラマの定番を自然に展開できるのです。"}, {"range": "33–36", "label": "Royalty ≠ monarchy", "en": "(33) The folklorist Chukwuma Azuonye argues that royalty (in the sense of the majesty of the king as an embodiment of sovereign power) has remained one of the most highly cherished values in Igbo thought in a situation in which monarchy (in the sense of the monopoly of power by one man or one family) is viewed as anathema. (34) It would, therefore, appear that the saying Igbo enwe eze is better translated as “The Igbo abhor monarchical power” [rather than as “The Igbo have no kings”]. (1995) (35) As Azuonye put it succinctly to me, the Igbos rejected monarchy because every Igbo man wants to be a king himself and therefore can’t tolerate anyone else holding the position. (Cf. the title of Henderson’s The King in Every Man: Evolutionary Trends in Onitsha Igbo Society and Culture, 1972.) (36) For our purposes, this provides a beautifully efficient explanation based on the relation of, and the difference between, movies and real life.", "ja": "(33) 民俗学者チュクウマ・アズオニエは、ここで「王の威厳」と「君主制」を区別しています。イボ社会では、一人の人間や一つの家系が権力を独占するという意味での君主制は強く嫌われてきました。その一方で、共同体の力や威厳を体現する存在としての「王らしさ」や「王の威厳」は、非常に高く評価されてきたというのです。(34) そのため、Igbo enwe eze という言葉も、単純に「イボ人には王がいない」と訳すより、「イボ人は一人の王が権力を独占することを嫌う」と理解するほうが適切だとされます。(1995) (35) アズオニエはこれをもっと端的に、「イボ人は一人ひとりが自分こそ王でありたいと思うから、他人だけが王になることには耐えられない。そのため君主制を拒んだのだ」と説明しています。(36) 筆者にとってこれは、現実のイボ社会と映画の中のイボ社会が、どこでつながり、どこで違っているのかを非常にうまく説明する考え方です。"}, {"range": "37–40", "label": "Titles and prestige", "en": "(37) Igbo titles were and are eagerly sought after: “It is the ambition of every free-born youth to rise to chieftainship, and in this democratic country the highest honours are open to every freeman equally,” G. T. Basden observed in 1921 (Basden 1966, 255–56). (38) Achebe’s Okonkwo is obsessed with titles, and in Living in Bondage Andy Okeke naturally converts his new wealth into the social prestige of chieftaincy. (39) Igbo titles signify distinguished status, but—unlike Yoruba or European feudal titles—they never entailed executive authority or parcellized sovereignty over a defined territory. (40) There can be only one otun at a time (originally the general commanding the right flank of a Yoruba army), but there is no natural limit to the number of titles an Igbo community can confer.", "ja": "(37) 実際、イボ社会では昔から現在まで、称号を得ること自体は非常に強く望まれてきました。G・T・バスデンは1921年、「自由民として生まれた若者なら誰もが首長の地位に上がることを目指している。この民主的な社会では、最高の名誉もすべての自由民に平等に開かれている」と述べています。(38) アチェベのオコンコーは称号を得ることに執着していますし、『Living in Bondage』のアンディ・オケケも、手に入れた富を首長の称号という社会的威信へと自然に変えていきます。(39) ただし、イボの称号は高い社会的地位や名誉を表すものであって、ヨルバやヨーロッパの封建的称号のように、実際の行政権や、一定の領域を支配する主権を伴うものではありませんでした。(40) たとえばヨルバの「オトゥン」という地位は同時に一人しか持てませんが、イボの共同体では、原理上、与えられる称号の人数に決まった上限はありません。"}, {"range": "41–45", "label": "Title inflation", "en": "(41) Basden continues: “In modern times the dignity of the chieftainship has been degraded and the tendency is to bring the whole system into disrepute, owing to the wholesale and indiscriminate sale of titles to any youth who can produce the stipulated fee” (1966, 256). (42) So-called “money chiefs”—“men or women of means on whom chieftaincy titles or positions have been awarded for hard cash by cash-starved or avaricious eze”—seem to be a phenomenon that predated contact with the British (Azuonye 1995, 67–68). (43) Bond Emeruwa waved a hand around his Surulere neighborhood, saying there were thirty chiefs on his street. (44) They compete for prestige in a currency devalued by inflation. (45) In precolonial republican Igboland, titles existed independently of a monarchy, but in imagination, in the movies, all the social and emotional desires invested in title taking can find expression in one collectively fantasized plenipotent figure on a throne.", "ja": "(41) バスデンはさらに、「現代では首長という地位の威厳が低下している。決められた金額さえ払える若者なら誰にでも無差別に称号を売るようになったため、制度そのものの評判が悪くなりつつある」と述べています。(42) いわゆる「マネー・チーフ」、つまり金に困っていたり強欲だったりするエゼから、現金と引き換えに首長の称号や地位を与えられた裕福な男女は、イギリスとの接触より前から存在していたらしいとされます。(43) ボンド・エメルワは、自分の住むスルレレの通りを指して、「この通りだけで首長が30人いる」と語りました。(44) つまり彼らは、数が増えすぎたため価値の下がった「称号」という通貨を使って、互いに威信を競っているようなものです。(45) 植民地以前の共和制的なイボランドでも、称号そのものは君主制とは独立して存在していました。しかし映画という想像の世界では、称号を得たいという社会的・感情的な欲望のすべてを、一人の「玉座に座る絶大な権力者」にまとめて表現することができるのです。"}, {"range": "46–50", "label": "Igwe beyond Igboland", "en": "(46) No less remarkable than the somewhat invented quality of the figure of the igwe is the way it has traveled beyond the borders of Igboland. (47) Senayon Olaoluwa and Adewole Adejayan describe how mostly Yoruba soccer fans in southwestern Nigeria christened Thierry Henry, a Frenchman of Antillean extraction then playing for a British team, with the title of “Igwe” (2011). (48) In another essay Olaoluwa adds examples of how “igwe” has spread: it is the title of a Yoruba hit gospel song and the brand name of a top-of-the-line electricity generator; in South Africa, where many young professionals marinate themselves in Nigerian film culture, people wearing any style of Nigerian clothing will be hailed on the street with cries of “Igwe!” (Olaoluwa 2011). (49) This is all Nollywood’s doing. (50) It has created probably the most widespread image of traditional African kingship for the whole continent.", "ja": "(46) イグウェという存在がある程度「作られた伝統」であることと同じくらい興味深いのは、そのイメージがイボランドの外にまで広がったことです。(47) セナヨン・オラオルワとアデウォレ・アデジャヤンによれば、ナイジェリア南西部の主にヨルバ人のサッカーファンは、当時イギリスのクラブでプレーしていたフランス人選手ティエリ・アンリを「Igwe」と呼びました。(48) オラオルワはさらに、「Igwe」という言葉が広がった例を挙げています。ヨルバ語の人気ゴスペル曲のタイトルになったり、高級発電機のブランド名になったりしています。また、ナイジェリア映画文化に深く親しんでいる若い専門職が多い南アフリカでは、ナイジェリア風の服を着ているだけで、通りすがりの人から「Igwe!」と声をかけられることさえあります。(49) 筆者は、こうした広がりはすべてノリウッドの影響だと述べます。(50) ノリウッドは、伝統的な「アフリカの王」のイメージとして、おそらくアフリカ大陸全体で最も広く共有されるものを作り出したのです。"}];
const summary="イボ族の歴史を描く映画において特徴的な形象の一つとしてイグウェ（酋長）があるが、これは実際には民主制や共和制の色が濃かったイボの歴史や文化を正確に反映したものではない。ここでは、なぜそのような描かれ方をされるようになったのかを、イギリスによる植民地支配の影響やイボ族の社会の特徴から読み解き、ノリウッド映画に表象されているものと、それが与えた影響を明らかにする。";
const KEY='session14-viewer-v2';
const state=Object.assign({current:0,fs:17,view:'split',hideJa:false,focus:false,dark:false,bookmarks:[],notes:{},summaryCollapsed:false},JSON.parse(localStorage.getItem(KEY)||'{}'));
const $=id=>document.getElementById(id);
const en=$('en'),ja=$('ja'),counter=$('counter'),progress=$('progress'),jump=$('jump'),search=$('search');
let locked=-1,current=Math.max(0,Math.min(pairs.length-1,state.current||0)),syncing=false,fs=state.fs||17;

$('summarytext').textContent=summary;
pairs.forEach((p,i)=>{
  const opt=document.createElement('option');
  opt.value=i; opt.textContent=`${String(i+1).padStart(2,'0')} · (${p.range}) ${p.label}`; jump.appendChild(opt);
  for(const [pane,key] of [[en,'en'],[ja,'ja']]){
    const s=document.createElement('section');
    s.className='card';
    s.dataset.index=i;
    s.dataset.n=p.range;
    s.dataset.label=p.label;
    s.dataset.raw=p[key];
    s.textContent=p[key];
    pane.appendChild(s);
  }
});
const E=[...en.querySelectorAll('.card')],J=[...ja.querySelectorAll('.card')];

function persist(){
  state.current=current;state.fs=fs;state.view=$('view').value;
  state.hideJa=document.body.classList.contains('translation-hidden');
  state.focus=document.body.classList.contains('focus-mode');
  state.dark=document.documentElement.classList.contains('dark');
  state.summaryCollapsed=$('summarybox').classList.contains('collapsed');
  localStorage.setItem(KEY,JSON.stringify(state));
}
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),1100);
}
function applyBookmarks(){
  [...E,...J].forEach(x=>x.classList.toggle('bookmarked',state.bookmarks.includes(+x.dataset.index)));
  $('bookmark').textContent=state.bookmarks.includes(current)?'★ Bookmarked':'☆ Bookmark';
}
function mark(i,lock=false,scroll=false){
  current=Math.max(0,Math.min(pairs.length-1,i));
  [...E,...J].forEach(x=>x.classList.remove('active'));
  E[current].classList.add('active');J[current].classList.add('active');
  counter.textContent=`${current+1} / ${pairs.length}`;jump.value=current;
  if(lock)locked=current;
  if(scroll){
    if(E[current].offsetParent)E[current].scrollIntoView({block:'center',behavior:'smooth'});
    if(J[current].offsetParent)J[current].scrollIntoView({block:'center',behavior:'smooth'});
  }
  applyBookmarks();persist();
}
[E,J].forEach((list,side)=>list.forEach((c,i)=>{
  c.addEventListener('mouseenter',()=>{if(locked<0){mark(i);const other=(side?E:J)[i];if(other.offsetParent)other.scrollIntoView({block:'center',behavior:'smooth'})}});
  c.addEventListener('click',()=>{
    if(document.body.classList.contains('translation-hidden') && side===1){c.style.filter='none';setTimeout(()=>c.style.filter='',1600);return}
    mark(i,true,true);
  });
}));
function sync(a,b){
  if(syncing||!b.offsetParent)return;
  syncing=true;
  const ma=a.scrollHeight-a.clientHeight,mb=b.scrollHeight-b.clientHeight;
  b.scrollTop=ma?a.scrollTop/ma*mb:0;
  progress.style.width=`${Math.min(100,a.scrollTop/Math.max(1,ma)*100)}%`;
  requestAnimationFrame(()=>syncing=false);
}
en.addEventListener('scroll',()=>sync(en,ja));
ja.addEventListener('scroll',()=>sync(ja,en));

function setView(v){
  document.body.classList.toggle('view-en',v==='en');
  document.body.classList.toggle('view-ja',v==='ja');
  $('view').value=v;persist();
}
function setFont(n){
  fs=Math.max(13,Math.min(25,n));document.documentElement.style.setProperty('--fs',fs+'px');persist();
}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function highlight(el,q){
  const raw=el.dataset.raw;
  if(!q){el.textContent=raw;return 0}
  const re=new RegExp(escRe(q),'gi');let count=0,last=0,m;el.textContent='';
  while((m=re.exec(raw))){
    count++;el.append(document.createTextNode(raw.slice(last,m.index)));
    const mk=document.createElement('mark');mk.textContent=m[0];el.append(mk);
    last=m.index+m[0].length;if(!m[0].length)re.lastIndex++;
  }
  el.append(document.createTextNode(raw.slice(last)));return count;
}
function runSearch(){
  const q=search.value.trim();let eh=0,jh=0,visible=0;
  pairs.forEach((p,i)=>{
    const match=!q||(p.en+' '+p.ja+' '+p.label).toLowerCase().includes(q.toLowerCase());
    E[i].classList.toggle('hidden-by-search',!match);J[i].classList.toggle('hidden-by-search',!match);
    eh+=highlight(E[i],q);jh+=highlight(J[i],q);if(match)visible++;
  });
  $('enHits').textContent=q?`${eh} hit${eh===1?'':'s'}`:'';
  $('jaHits').textContent=q?`${jh} hit${jh===1?'':'s'}`:'';
  if(q)toast(`${visible} / ${pairs.length} cards`);
}
search.addEventListener('input',runSearch);

$('prev').onclick=()=>mark(current-1,true,true);
$('next').onclick=()=>mark(current+1,true,true);
$('smaller').onclick=()=>setFont(fs-1);
$('larger').onclick=()=>setFont(fs+1);
jump.onchange=()=>mark(+jump.value,true,true);
$('view').onchange=e=>setView(e.target.value);
$('hideJa').onclick=()=>{document.body.classList.toggle('translation-hidden');$('hideJa').classList.toggle('on');persist()};
$('focus').onclick=()=>{document.body.classList.toggle('focus-mode');$('focus').classList.toggle('on');persist()};
$('dark').onclick=()=>{document.documentElement.classList.toggle('dark');$('dark').classList.toggle('on');persist()};
$('summaryToggle').onclick=()=>{$('summarybox').classList.toggle('collapsed');persist()};
$('summarybox').onclick=()=>{$('summarybox').classList.toggle('collapsed');persist()};

$('bookmark').onclick=()=>{
  const k=state.bookmarks.indexOf(current);
  if(k>=0)state.bookmarks.splice(k,1);else state.bookmarks.push(current);
  applyBookmarks();persist();
};
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied')}catch{toast('Copy failed')}}
$('copy').onclick=()=>copyText(pairs[current].en+'\n\n'+pairs[current].ja);
$('copyEn').onclick=()=>copyText(pairs[current].en);
$('copyJa').onclick=()=>copyText(pairs[current].ja);
$('copyBoth').onclick=()=>copyText(pairs[current].en+'\n\n'+pairs[current].ja);

function openNote(){
  $('drawerTitle').textContent=`Card ${current+1} · (${pairs[current].range})`;
  $('drawerMeta').textContent=pairs[current].label;
  $('noteText').value=state.notes[current]||'';
  $('drawer').classList.add('open');setTimeout(()=>$('noteText').focus(),30);
}
$('note').onclick=openNote;
$('closeDrawer').onclick=()=>{$('drawer').classList.remove('open')};
$('noteText').addEventListener('input',e=>{state.notes[current]=e.target.value;persist()});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')){
    if(e.key==='Escape'){e.target.blur();$('drawer').classList.remove('open')};return;
  }
  if(['ArrowDown','ArrowRight','j','J'].includes(e.key)){e.preventDefault();mark(current+1,true,true)}
  if(['ArrowUp','ArrowLeft','k','K'].includes(e.key)){e.preventDefault();mark(current-1,true,true)}
  if(e.key==='Escape'){locked=-1;$('drawer').classList.remove('open');mark(current)}
  if(e.key==='/'){e.preventDefault();search.focus()}
  if(e.key==='t'||e.key==='T')$('hideJa').click();
  if(e.key==='b'||e.key==='B')$('bookmark').click();
  if(e.key==='n'||e.key==='N')openNote();
  if(e.key==='f'||e.key==='F')$('focus').click();
  if(e.key==='d'||e.key==='D')$('dark').click();
});

setFont(fs);setView(state.view||'split');
document.body.classList.toggle('translation-hidden',!!state.hideJa);$('hideJa').classList.toggle('on',!!state.hideJa);
document.body.classList.toggle('focus-mode',!!state.focus);$('focus').classList.toggle('on',!!state.focus);
document.documentElement.classList.toggle('dark',!!state.dark);$('dark').classList.toggle('on',!!state.dark);
$('summarybox').classList.toggle('collapsed',!!state.summaryCollapsed);
applyBookmarks();mark(current,false,false);
setTimeout(()=>mark(current,false,true),80);
</script>
</body>
</html>
