<header><div class="session">SESSION 10</div><div class="title"><h1>William Hodges: Artist of Empire, Part II</h1><p>Geoff Quilley — 英文に触れると対応する訳を表示／クリックで固定</p></div><div class="controls"><button id="smaller">A−</button><button id="larger">A＋</button><button id="prev">↑</button><span class="counter" id="counter">1 / 12</span><button id="next">↓</button></div></header><div class="progress" id="progress"></div>

<script>
const pairs=[
{en:`History itself, as a discursive field of study, was undergoing profound changes at this period, in the face of the material evidence about the composition, extent and history of the world that was being produced by travel, particularly that undertaken by Cook. This entailed radical revisions to the accepted, theologically dominated accounts of the world and human development.`,ja:`研究上の言説領域としての歴史そのものが、この時期に大きく変化しつつあった。とりわけクックの航海をはじめとする旅行が、世界の構成、広がり、歴史について物的証拠を生み出したためである。その結果、神学に支配され、従来受け入れられてきた世界と人類発展の説明は根本的な修正を迫られた。`},
{en:`Hodges’s body of work, in its sheer range and extent, could be taken as a visual counterpart to Edmund Burke’s celebrated comment to William Robertson: “We possess at this time very great advantages towards the knowledge of human Nature. … But now the Great map of mankind is unrolled at once; and there is no state or Gradation of barbarism, and no mode of refinement which we have not at the same instant under our View.”`,ja:`ホッジズの全作品は、その圧倒的な範囲と広がりにおいて、エドマンド・バークの有名な言葉の視覚版とみなせる。「現在の私たちは人間性を知るうえで非常に大きな利点をもつ。……今や人類の大地図が一度に広げられている。野蛮のどの状態・段階も、洗練のどの様式も、今この同じ瞬間に私たちの視野に入らないものはない。」`},
{en:`The importance of painting to this change in the perception of history should not be underestimated, and it is relatively easy to see how Hodges’s drawings of Pacific Islanders or views of Pacific landscapes accord with such an image of the world as consisting of a living history that was being progressively brought to light by geographical exploration.`,ja:`この歴史認識の変化に絵画が果たした重要性を過小評価してはならない。ホッジズが描いた太平洋諸島民の素描や太平洋の風景が、地理的探検によって次第に明るみに出される「生きた歴史」から世界ができている、という像に対応することは理解しやすい。`},
{en:`On the other hand, Hodges’s observations, particularly in Travels in India, on the dreadful effects of war were closely aligned with a moral discourse on despotism. This in turn pertained to a larger debate in Europe on the morality, benefits and dangers of empire, that was especially acute for Britain in the wake of the loss of the American colonies.`,ja:`他方、ホッジズが『インド旅行記』で示した戦争の恐るべき影響についての観察は、専制政治を批判する道徳的言説と密接に結びついた。それはさらに、帝国の道徳性・利益・危険をめぐるヨーロッパの大きな論争に関わる。アメリカ植民地を失った直後のイギリスには特に切実だった。`},
{en:`It becomes most pronounced in his description of Agra and Emperor Akbar’s tomb nearby at Sikandra. Agra he terms “the once splendid and imperial city,” but now the “whole of this spot, as far as the eye can reach, is one general scene of ruined buildings.” The panoramic view from a minaret of Akbar’s tomb enables an expanded historical overview, in which the clear view of the landscape is metonymic with a broad view of history.`,ja:`この点は、アグラと、その近くのシカンドラにあるアクバル帝廟の描写で最もはっきりする。ホッジズはアグラを「かつて壮麗だった帝都」と呼ぶが、今では「目の届く限り、この一帯すべてが廃墟となった建物の光景」だと記す。帝廟の光塔からの大展望は歴史の展望をも広げ、明瞭な風景の眺めが広い歴史観の換喩となる。`},
{en:`“From the summit of the minarets … a spectator’s eye may range over a prodigious circuit of country … filled with ruins of ancient grandeur. … This fine country exhibits, in its present state, a melancholy proof of the consequences of a bad government, of wild ambition, and the horrors attending civil dissentions. … It must have been a perfect garden; but now all is desolation and silence.”`,ja:`「光塔の頂からは……見る者の目は広大な地域を見渡せる。そこは古代の壮麗さを示す廃墟に満ちている。……この美しい国の現在の姿は、悪政、無謀な野心、内紛に伴う恐怖がもたらす結果の悲しい証拠である。……ここは完全な庭園だったはずだ。しかし今は荒廃と沈黙しかない。」`},
{en:`The ravages of war are linked to imperial decline, parallel to the manner in which the extent of Hodges’s vision of landscape is linked to his facility for historical judgment. It is not insignificant that the site from which this sight is made available is the tomb of Akbar, for Hodges the great founder of the Mughal empire. Mughal decline is associated more widely with the corrupting effects of luxury.`,ja:`戦争の荒廃は帝国の衰退と結びつく。それは、ホッジズの風景を見る視野の広さが歴史的判断の能力と結びつくのと並行する。その光景を見られる場所が、彼にとってムガル帝国の偉大な建国者だったアクバルの墓であることは偶然ではない。ムガル帝国の衰退は奢侈の腐敗作用とも関連づけられる。`},
{en:`“The private luxury and vices of Musselman princes too frequently reduce them to a state of real poverty, even with large revenues; and too often they delegate to artful, designing, and avaricious characters, the management and concerns of the state, and become virtually the plunderers instead of the parents of their subjects. … The princes are frequently left, in the hour of distress, quite destitute of support, and an easy prey to any invader.”`,ja:`「イスラム君主たちの私的な奢侈と悪徳は、莫大な収入があっても、しばしば彼らを真の貧困へ追い込む。国政を狡猾で貪欲な人物に任せ、臣民の親であるべき者が実質的には略奪者となる。……危機の時、君主は支援を完全に失い、どんな侵略者にも容易な獲物となる。」`},
{en:`This is a local, colonial adaptation of a longstanding metropolitan argument, deriving from classical sources, about the deplorable effects of luxury upon the political state. Climate or luxury commodities might enervate the individual and lead to indolence and dissipation. At a public level, the body politic could be corrupted by a “false” sense of taste caused by imported luxury goods, or by the growing influence of commerce and the political empowerment of the merchant class.`,ja:`これは、奢侈が政治国家に及ぼす有害な作用をめぐる古典古代由来の本国の議論を、植民地へ適用したものである。気候や奢侈品は個人を衰弱させ、怠惰と放逸をもたらすとされた。国家全体では、輸入奢侈品による「誤った」趣味や、商業の影響力と商人階級の政治力増大が、政治体を腐敗させると考えられた。`},
{en:`The result would be a decline in public virtue, a greater propensity to internecine conflict, and exposure to invasion. Such notions sounded ominous for Britain, a self-styled commercial maritime empire. Adam Ferguson explicitly linked imperialism to despotism: “What may not the fleets and armies of Europe … effect, if that ruinous maxim should prevail, That the grandeur of a nation is to be estimated from the extent of its territory …?”`,ja:`その結果、公共的徳が衰え、内紛が起こりやすくなり、国家は侵入にさらされる。自らを商業的海洋帝国と称するイギリスには特に不吉な考えだった。ファーガソンは帝国主義と専制政治を結びつけた。「もし国の偉大さは領土の広さで測られるという破滅的原則が勝つなら、ヨーロッパの艦隊と軍隊はいったい何をしでかさないだろうか。」`},
{en:`Hodges displaces any overt concern with British imperial activity onto an account of the imperial history of India. Yet in his account of the past Mughal empire there is clearly an Ozymandian admonition for eighteenth-century imperial Britain, pitched dialectically against his accounts of the present benefits brought to India by the British presence. This dialectic emerges as the split between war and peace, expressed through landscape as the repository of history.`,ja:`ホッジズはイギリスの帝国活動への露骨な懸念を、インド帝国史の記述へ移し替える。だが過去のムガル帝国の説明には、18世紀の帝国イギリスへ向けた「オジマンディアス的」警告がある。それはイギリス支配が現在のインドにもたらす利益という説明と弁証法的に対置される。この弁証法は戦争と平和の分裂として現れ、歴史の貯蔵庫としての風景に表現される。`},
{en:`The idea that all regions of the world were “at the same instant under our View” also referred to the growing visual culture in London representing the non-European world. The world was becoming visible “at the same instant” through visual representation. Most arresting about Burke’s “map of mankind” is not just its elision of history and mapping, but the visual register it ascribes to the making of history: history is present in the world, available to be seen and visually recorded, in the manner of a map or a painting.`,ja:`世界のすべての地域が「同じ瞬間に私たちの視野に入る」という考えは、ロンドンで増大する非ヨーロッパ世界の視覚文化も指す。世界は視覚表象を通じて「同じ瞬間」に見えるものとなった。バークの「人類の地図」で最も印象的なのは、歴史と地図を重ねる点だけでなく、歴史形成に視覚的領域を与える点である。歴史は世界に現存し、地図や絵画のように見て記録できるのだ。`}
];
const en=document.getElementById('en'),ja=document.getElementById('ja'),counter=document.getElementById('counter'),progress=document.getElementById('progress');let locked=-1,current=0,syncing=false,fs=17;pairs.forEach((p,i)=>{for(const [pane,key] of [[en,'en'],[ja,'ja']]){const s=document.createElement('section');s.className='card';s.dataset.n=String(i+1).padStart(2,'0');s.textContent=p[key];pane.appendChild(s)}});const E=[...en.querySelectorAll('.card')],J=[...ja.querySelectorAll('.card')];function mark(i,lock=false,scroll=false){current=Math.max(0,Math.min(pairs.length-1,i));[...E,...J].forEach(x=>x.classList.remove('active'));E[current].classList.add('active');J[current].classList.add('active');counter.textContent=`${current+1} / ${pairs.length}`;if(lock)locked=current;if(scroll){E[current].scrollIntoView({block:'center',behavior:'smooth'});J[current].scrollIntoView({block:'center',behavior:'smooth'})}}[E,J].forEach((list,side)=>list.forEach((c,i)=>{c.addEventListener('mouseenter',()=>{if(locked<0){mark(i);(side?E:J)[i].scrollIntoView({block:'center',behavior:'smooth'})}});c.addEventListener('click',()=>mark(i,true,true))}));function sync(a,b){if(syncing)return;syncing=true;const ma=a.scrollHeight-a.clientHeight,mb=b.scrollHeight-b.clientHeight;b.scrollTop=ma?a.scrollTop/ma*mb:0;progress.style.width=`${Math.min(100,a.scrollTop/Math.max(1,ma)*100)}%`;requestAnimationFrame(()=>syncing=false)}en.addEventListener('scroll',()=>sync(en,ja));ja.addEventListener('scroll',()=>sync(ja,en));prev.onclick=()=>mark(current-1,true,true);next.onclick=()=>mark(current+1,true,true);smaller.onclick=()=>{fs=Math.max(13,fs-1);document.documentElement.style.setProperty('--fs',fs+'px')};larger.onclick=()=>{fs=Math.min(24,fs+1);document.documentElement.style.setProperty('--fs',fs+'px')};document.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();mark(current+1,true,true)}if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();mark(current-1,true,true)}if(e.key==='Escape'){locked=-1;mark(current)}});mark(0);
</script></body></html>
