<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スペイン語 演習2-4 (総合・ひっかけ特化)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.8; color: #111; }
        h1, h2, h3 { text-align: center; margin: 0.4em 0; }
        .meta { margin: 24px 0 30px; font-size: 18px; }
        .meta div { margin: 4px 0; }
        .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 20px; background: #f9f9f9; padding: 10px 15px; border-radius: 8px; }
        button { padding: 10px 18px; font-size: 15px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
        button:hover { background: #eee; }
        select { padding: 8px; font-size: 15px; }
        #timer-area { font-size: 18px; font-weight: bold; color: #b00020; margin-left: auto; }
        .audio-btn { background: none; border: none; cursor: pointer; font-size: 1.2em; padding: 0 5px; vertical-align: middle; }
        .audio-btn:hover { opacity: 0.6; }
        input { margin-top: 6px; padding: 8px 10px; font-size: 16px; width: 100%; max-width: 600px; box-sizing: border-box; }
        .question { margin: 18px 0 22px; }
        .section { margin-top: 30px; padding-top: 10px; border-top: 2px solid #ddd; }
        .section h3 { text-align: left; margin-bottom: 5px; font-size: 1.1em; color: #333; }
        .correct { color: #0a7a0a; font-weight: bold; }
        .incorrect { color: #b00020; font-weight: bold; }
        #result { margin-top: 18px; font-size: 16px; }
        .translation { display: none; color: #0056b3; margin-left: 10px; font-weight: bold; }
        .note { color: #d03000; font-size: 0.9em; margin-bottom: 10px; font-weight: bold; }
        canvas { max-width: 520px; margin-top: 20px; }
        .footer { margin-top: 24px; }
    </style>
</head>
<body>
    <h1>スペイン語 演習2-4 (第4回小テスト範囲)</h1>
    <div class="meta">
        <div>1.　次の日本語に合うように、ser, estar, hay のいずれかの適切な活用形を書いてください。</div>
        <div>2.　日本語に合う所有形容詞（前置形または後置形）を書いてください。</div>
        <div>3.　次の日本語をスペイン語に訳してください。（ヒントなし・ひっかけあり）</div>
        <div>4.　疑問詞の意味（日本語）を答えてください。</div>
        <div class="note" style="margin-left: 1.2em; margin-top: 10px;">
            ※ 注意：名詞の性別（例外含む）、君(tú)とあなた(usted)の区別、イベントの場所を表す動詞などに気を付けてください。
        </div>
    </div>

    <div class="controls">
        <button type="button" onclick="generateQuiz()">問題生成</button>
        <button type="button" onclick="toggleAnswers()" id="toggleBtn">答え表示</button>
        <label for="timeLimit" style="margin-left:10px;">制限時間:</label>
        <select id="timeLimit">
            <option value="0">制限なし</option>
            <option value="180">3分</option>
            <option value="300">5分</option>
            <option value="600">10分</option>
        </select>
        <div id="timer-area" style="display:none;">残り時間: <span id="timeDisplay">--:--</span></div>
    </div>

    <form id="quizForm"></form>
    <div id="result"></div>
    <div style="margin-top:14px;">
        <button type="button" onclick="gradeQuiz()">採点</button>
        <button type="button" onclick="resetHistory()">履歴リセット</button>
    </div>
    <canvas id="chart" height="200"></canvas>
    <p class="footer"><a href="../spanish.html">← 目次に戻る</a></p>

    <script>
        let showAnswers = false;
        let currentAnswers = [];
        let history = JSON.parse(localStorage.getItem('scoreHistory_spanish2_4_adv') || '[]');
        let chart = null;
        let timerInterval = null;
        let timeLeft = 0;

        // ------------- 1. ser / estar / hay -------------
        const serEstarHayStock = [
            { html: '明日、ジャズのコンサートがあります。<br>Mañana (　　) un concierto de jazz.', expected: 'hay' },
            { html: '君の両親はどんな人ですか。<br>¿Cómo (　　) tus padres?', expected: 'son' },
            { html: 'スープはまだ温かいです。<br>La sopa todavía (　　) caliente.', expected: 'está' },
            { html: '私の恋人はスペイン人です。<br>Mi novio (　　) español.', expected: 'es' },
            { html: '私の恋人は今は東京にいます。<br>Mi novio ahora (　　) en Tokio.', expected: 'está' },
            { html: 'この辺りにレストランはありますか。<br>¿(　　) un restaurante por aquí?', expected: 'hay' },
            { html: 'わたし達(女性)は少し疲れています。<br>Nosotras (　　) un poco cansadas.', expected: 'estamos' },
            { html: '私は大学にいます。<br>(　　) en la universidad.', expected: 'estoy' },
            { html: 'マドリードはスペインの中心にあります。<br>Madrid (　　) en el centro de España.', expected: 'está' },
            { html: '公園には子供たちがたくさんいます。<br>En el parque (　　) muchos niños.', expected: 'hay' },
            { html: 'カルメンと私はカフェテリアにいます。<br>Carmen y yo (　　) en la cafetería.', expected: 'estamos' },
            { html: 'この近くに駅はありますか？<br>¿(　　) una estación cerca de aquí?', expected: 'hay' },
            { html: 'トイレはどこですか？<br>¿Dónde (　　) los servicios?', expected: 'están' },
            { html: '私の両親は今、家にいません。<br>Mis padres no (　　) en casa ahora.', expected: 'están' },
            { html: 'コンサートはどこ(で開催)ですか？<br>¿Dónde (　　) el concierto?', expected: 'es' } // イベント開催場所はser
        ];

        // ------------- 2. 所有形容詞 (前置・後置 / ひっかけ網羅) -------------
        const posesivosStock = [
            { html: '(私の) coche', expected: 'mi' },
            { html: '(君の) día', expected: 'tu' }, // díaは男性名詞だが前置形はtu
            { html: '(あなたの) opiniones', expected: 'sus' }, // ustedの複数対象
            { html: '(彼らの) problema', expected: 'su' }, // problemaは単数
            { html: '(彼女の) hermanos', expected: 'sus' },
            { html: '(私たちの) ciudad', expected: 'nuestra' }, // ciudadは女性名詞
            { html: '(君たちの) padres', expected: 'vuestros' },
            { html: '(あなた方の) ideas', expected: 'sus' }, // ustedes
            { html: 'el coche (私の)', expected: 'mío' },
            { html: 'los trabajos (私の)', expected: 'míos' },
            { html: 'la camiseta (私の)', expected: 'mía' },
            { html: 'el día (君の)', expected: 'tuyo' }, // díaは男性名詞
            { html: 'la culpa (君の)', expected: 'tuya' },
            { html: 'el país (私たちの)', expected: 'nuestro' }, // paísは男性名詞
            { html: 'la universidad (私たちの)', expected: 'nuestra' },
            { html: 'los abuelos (君たちの)', expected: 'vuestros' },
            { html: 'las ideas (君たちの)', expected: 'vuestras' },
            { html: 'la opinión (あなたの)', expected: 'suya' }, // opiniónは女性名詞、usted
            { html: 'las opiniones (あなたの)', expected: 'suyas' },
            { html: 'el problema (彼の)', expected: 'suyo' } // problemaは男性名詞
        ];

        // ------------- 3. 西訳 (全単語網羅・ヒントなし) -------------
        const translationStock = [
            { html: '私の家は大学から遠いけれど、君の家は駅から近い。', expected: ['Mi casa está lejos de la universidad, pero tu casa está cerca de la estación.', 'Mi casa está lejos de la universidad pero tu casa está cerca de la estación.'] },
            { html: 'そのビルの中には、喫茶店が2軒あります。', expected: ['Hay dos cafeterías en el edificio.', 'En el edificio hay dos cafeterías.'] },
            { html: 'あなた方はどこのご出身ですか。', expected: ['¿De dónde son ustedes?', '¿De dónde son?'] },
            { html: '私達の大学は町の中心部にあります。', expected: ['Nuestra universidad está en el centro de la ciudad.', 'Nuestra universidad está en el centro de la ciudad'] },
            { html: '私の母の車はその公園の側にあります。', expected: ['El coche de mi madre está al lado del parque.'] }, // del parque
            { html: 'トイレは北にありますか？ いいえ、南にあります。', expected: ['¿Están los servicios en el norte? No, están en el sur.', '¿Están los servicios en el norte? no, están en el sur.'] },
            { html: '君の祖父母は日曜日に家にいますか？', expected: ['¿Están tus abuelos en casa el domingo?', '¿Están tus abuelos en casa el domingo?'] },
            { html: '今日は母の日です。', expected: ['Hoy es el día de la madre.'] }, // el día
            { html: '私の女友達(複数)は今、とても怒っています。', expected: ['Mis amigas están muy enfadadas ahora.', 'Ahora mis amigas están muy enfadadas.'] }, // enfadadas
            { html: 'コンサートはどこ(で開催)ですか？', expected: ['¿Dónde es el concierto?'] }, // es
            { html: 'その綿のTシャツは私の(もの)です。', expected: ['La camiseta de algodón es mía.'] },
            { html: '彼女の甥っ子たちは悲しんでいます。', expected: ['Sus sobrinos están tristes.'] },
            { html: 'トルティーヤはまだ冷たいです。', expected: ['La tortilla todavía está fría.'] },
            { html: 'それは先生の責任(culpa)です。', expected: ['Es la culpa del profesor.'] }, // del profesor
            { html: '私の仕事(複数)はこの国にあります。', expected: ['Mis trabajos están en este país.', 'Mis trabajos están en el país.'] },
            { html: '君は学生ですよね？', expected: ['Eres estudiante, ¿verdad?', 'Eres estudiante, ¿no?'] },
            { html: '教室は西にあります、東ではありません。', expected: ['La clase está en el oeste, no en el este.'] },
            { html: 'その子供たちはとても喜んでいます。', expected: ['Los niños están muy contentos.', 'Los niños están contentos.'] },
            { html: '私の消しゴムは君の兄弟たちの側にあります。', expected: ['Mi goma está al lado de tus hermanos.'] },
            { html: '私のいとこ(女)の夫は大人です。', expected: ['El esposo de mi prima es adulto.'] },
            { html: 'その少女の具合は悪いです。', expected: ['La muchacha está mal.'] }, // mal = 具合が悪い(estar)
            { html: '君の意見や考えは良いです。', expected: ['Tus opiniones e ideas son buenas.'] } // opiniones, ideas (女性複数)
        ];

        // ------------- 4. 疑問詞 -------------
        const questionWordsStock = [
            { html: 'qué', expected: ['何'] },
            { html: 'cuándo', expected: ['いつ'] },
            { html: 'cómo', expected: ['どのように', 'どんな', 'どう'] },
            { html: 'qué tal', expected: ['どう', 'どのように', '調子はどう'] },
            { html: 'quién', expected: ['誰'] },
            { html: 'dónde', expected: ['どこ'] },
            { html: 'cuál', expected: ['どれ', 'どの'] },
            { html: 'cuánto', expected: ['どれだけ', 'いくつ', 'どのくらい'] }
        ];

        // ------------- 共通関数 -------------
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function norm(s) {
            return String(s)
                .toLowerCase()
                .replace(/　/g, ' ')
                .trim()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '') // アクセント記号を無視
                .replace(/[.,¿?¡!。、]/g, '')    // 句読点などを無視
                .replace(/\s+/g, ' ');           // 連続する空白を1つに
        }

        function toggleAnswers() {
            showAnswers = !showAnswers;
            document.querySelectorAll('.translation').forEach(e => e.style.display = showAnswers ? 'inline' : 'none');
            document.getElementById('toggleBtn').textContent = showAnswers ? '答え非表示' : '答え表示';
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const esText = text.replace(/（.*?）/g, '').trim();
            const u = new SpeechSynthesisUtterance(esText);
            u.lang = 'es-ES';
            u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        function startTimer() {
            clearInterval(timerInterval);
            const limit = parseInt(document.getElementById('timeLimit').value, 10);
            const area = document.getElementById('timer-area');
            if (limit === 0) { area.style.display = 'none'; return; }
            timeLeft = limit;
            area.style.display = 'block';
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) { clearInterval(timerInterval); alert("時間切れです！自動採点します。"); gradeQuiz(); }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timeDisplay').textContent = `${m}:${s.toString().padStart(2, '0')}`;
        }

        function drawChart() {
            const ctx = document.getElementById('chart');
            if (!ctx || typeof Chart === 'undefined') return;
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: history.map((_, i) => `回${i + 1}`),
                    datasets: [{ label: '得点(%)', data: history, fill: false, tension: 0.25, borderColor: '#d03000', backgroundColor: '#d03000' }]
                },
                options: { responsive: true, scales: { y: { min: 0, max: 100, ticks: { stepSize: 20 } } } }
            });
        }

        function addInputQuestion(form, html, expected, index, showAudio = true) {
            currentAnswers.push(expected);
            let displayExpected = Array.isArray(expected) ? expected[0] : expected;
            let audioBtn = showAudio ? `<button type="button" class="audio-btn" data-text="${displayExpected}" onclick="speak(this.dataset.text)" title="発音">🔊</button>` : '';
            form.innerHTML += `
                <div class="question">
                    (${index + 1}) ${html}
                    ${audioBtn}
                    <span class="translation">（${displayExpected}）</span>
                    <br>
                    <input id="q${index}" autocomplete="off" placeholder="解答を入力">
                </div>`;
        }

        function generateQuiz() {
            const form = document.getElementById('quizForm');
            const result = document.getElementById('result');
            form.innerHTML = '';
            result.innerHTML = '';
            currentAnswers = [];
            let qIndex = 0;

            form.innerHTML += `<div class="section"><h3>1. 次の日本語に合うように、ser, estar, hay のいずれかの適切な活用形を書きなさい。</h3></div>`;
            shuffle(serEstarHayStock).slice(0, 5).forEach(q => addInputQuestion(form, q.html, q.expected, qIndex++, true));

            form.innerHTML += `<div class="section"><h3>2. 日本語に合う所有形容詞（前置形または後置形）を書きなさい。</h3></div>`;
            shuffle(posesivosStock).slice(0, 5).forEach(q => addInputQuestion(form, q.html, q.expected, qIndex++, true));

            form.innerHTML += `<div class="section"><h3>3. 次の日本語をスペイン語にしなさい。</h3></div>`;
            shuffle(translationStock).slice(0, 3).forEach(q => addInputQuestion(form, q.html, q.expected, qIndex++, true));

            form.innerHTML += `<div class="section"><h3>4. 次の疑問詞の意味（日本語）を書きなさい。</h3></div>`;
            shuffle(questionWordsStock).slice(0, 3).forEach(q => addInputQuestion(form, q.html, q.expected, qIndex++, false));

            if (showAnswers) {
                document.querySelectorAll('.translation').forEach(e => e.style.display = 'inline');
            }
            startTimer();
        }

        function gradeQuiz() {
            clearInterval(timerInterval);
            let score = 0;
            let out = '';
            currentAnswers.forEach((expected, i) => {
                const input = document.getElementById('q' + i);
                const userAns = input ? norm(input.value) : '';
                let ok = false;
                let expectedStr = '';

                if (Array.isArray(expected)) {
                    ok = expected.some(e => userAns === norm(e));
                    expectedStr = expected.join(' / ');
                } else {
                    ok = userAns === norm(expected);
                    expectedStr = expected;
                }

                if (ok) score++;
                out += `<p class="${ok ? 'correct' : 'incorrect'}">${i + 1}: ${ok ? '〇' : '× → ' + expectedStr}</p>`;
            });

            const total = currentAnswers.length;
            const percent = total ? Math.round((score / total) * 100) : 0;
            history.push(percent);
            if (history.length > 10) history.shift();
            localStorage.setItem('scoreHistory_spanish2_4_adv', JSON.stringify(history));
            
            const avg = Math.round(history.reduce((a, b) => a + b, 0) / history.length);
            out += `<h3>結果: ${score}/${total} (${percent}%)</h3>`;
            out += `<p>直近${history.length}回の平均: ${avg}%</p>`;
            document.getElementById('result').innerHTML = out;
            drawChart();
        }

        function resetHistory() {
            history = [];
            localStorage.removeItem('scoreHistory_spanish2_4_adv');
            document.getElementById('result').innerHTML = '<p>履歴をリセットしました。</p>';
            drawChart();
        }

        const chartScript = document.createElement('script');
        chartScript.src = 'https://cdn.jsdelivr.net/npm/chart.js';
        chartScript.onload = drawChart;
        document.head.appendChild(chartScript);

        generateQuiz();
    </script>
</body>
</html>
