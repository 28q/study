"text", "content": "invierno."}, {"type": "blank", "content": "Quiero"}, {"type": "blank", "content": "conocer"}, {"type": "text", "content": "Cusco y Machu Picchu,"}, {"type": "blank", "content": "que"}, {"type": "blank", "content": "son"}, {"type": "text", "content": "Patrimonio de la Humanidad."}]}, {"full": "Akari: ¿Son sitios muy antiguos?", "ja": "とても古い場所なの？", "blank": "Son", "segments": [{"type": "text", "content": "Akari:"}, {"type": "blank", "content": "¿Son"}, {"type": "text", "content": "sitios muy antiguos?"}]}, {"full": "Elvira: Sí. En ambos hay construcciones incaicas y tienen una historia muy interesante.", "ja": "そう。両方ともインカの建造物があって、とても興味深い歴史があるの。", "blank": "hay interesante", "segments": [{"type": "text", "content": "Elvira: Sí. En ambos"}, {"type": "blank", "content": "hay"}, {"type": "text", "content": "construcciones incaicas y tienen una historia muy"}, {"type": "blank", "content": "interesante."}]}, {"full": "Akari: Ya lo creo. Para ser Patrimonio de la Humanidad los lugares deben tener valor histórico o natural.", "ja": "そうだね。世界遺産になるには、歴史的または自然的価値がなければならないよね。", "blank": "lo creo Para ser los lugares deben tener", "segments": [{"type": "text", "content": "Akari: Ya"}, {"type": "blank", "content": "lo"}, {"type": "blank", "content": "creo."}, {"type": "blank", "content": "Para"}, {"type": "blank", "content": "ser"}, {"type": "text", "content": "Patrimonio de la Humanidad"}, {"type": "blank", "content": "los"}, {"type": "blank", "content": "lugares"}, {"type": "blank", "content": "deben"}, {"type": "blank", "content": "tener"}, {"type": "text", "content": "valor histórico o natural."}]}, {"full": "Elvira: Machu Picchu es una ciudadela que está en lo alto de una montaña.", "ja": "マチュピチュは山の上にある城塞都市よ。", "blank": "que está en lo alto de", "segments": [{"type": "text", "content": "Elvira: Machu Picchu es una ciudadela"}, {"type": "blank", "content": "que"}, {"type": "blank", "content": "está"}, {"type": "blank", "content": "en"}, {"type": "blank", "content": "lo"}, {"type": "blank", "content": "alto"}, {"type": "blank", "content": "de"}, {"type": "text", "content": "una montaña."}]}, {"full": "Akari: ¿Es más alta o menos alta que el Monte Fuji?", "ja": "富士山より高い？それとも低い？", "blank": "Es más alta o menos alta que", "segments": [{"type": "text", "content": "Akari:"}, {"type": "blank", "content": "¿Es"}, {"type": "blank", "content": "más"}, {"type": "blank", "content": "alta"}, {"type": "blank", "content": "o"}, {"type": "blank", "content": "menos"}, {"type": "blank", "content": "alta"}, {"type": "blank", "content": "que"}, {"type": "text", "content": "el Monte Fuji?"}]}, {"full": "Elvira: Es menos alta. Para llegar hay que salir desde Cusco en tren, que es la ciudad más turística de Perú.", "ja": "低いわ。行くにはペルーで一番観光客が多い都市、クスコから列車で出発しなければならないの。", "blank": "Es menos alta Para llegar hay que salir en tren que es", "segments": [{"type": "text", "content": "Elvira:"}, {"type": "blank", "content": "Es"}, {"type": "blank", "content": "menos"}, {"type": "blank", "content": "alta."}, {"type": "blank", "content": "Para"}, {"type": "blank", "content": "llegar"}, {"type": "blank", "content": "hay"}, {"type": "blank", "content": "que"}, {"type": "blank", "content": "salir"}, {"type": "text", "content": "desde Cusco"}, {"type": "blank", "content": "en"}, {"type": "blank", "content": "tren,"}, {"type": "blank", "content": "que"}, {"type": "blank", "content": "es"}, {"type": "text", "content": "la ciudad más turística de Perú."}]}, {"full": "Akari: ¿Cuántos días vas a estar allí?", "ja": "何日間そこにいるの？", "blank": "Cuántos días vas a estar allí", "segments": [{"type": "text", "content": "Akari:"}, {"type": "blank", "content": "¿Cuántos"}, {"type": "blank", "content": "días"}, {"type": "blank", "content": "vas"}, {"type": "blank", "content": "a"}, {"type": "blank", "content": "estar"}, {"type": "blank", "content": "allí?"}]}, {"full": "Elvira: Solo dos semanas. Voy a aprovechar la estancia para conocer otros lugares cercanos.", "ja": "たった2週  gusta cuando está jugando mi equipo preferido, aunque a veces me pongo muy nervioso.", "ja": "あまり好きではありません。野球の方が好きです。私の国で一番人気のあるスポーツです。特に好きなチームが試合をしている時が好きですが、時々とても緊張します。", "blank": "prefiero Es el deporte más popular de mi país me gusta cuando está jugando preferido me pongo nervioso", "segments": [{"type": "text", "content": "Rolando: No mucho."}, {"type": "blank", "content": "Prefiero"}, {"type": "text", "content": "el béisbol."}, {"type": "blank", "content": "Es"}, {"type": "blank", "content": "el"}, {"type": "blank", "content": "deporte"}, {"type": "blank", "content": "más"}, {"type": "blank", "content": "popular"}, {"type": "blank", "content": "de"}, {"type": "blank", "content": "mi"}, {"type": "blank", "content": "país."}, {"type": "text", "content": "Sobre todo"}, {"type": "blank", "content": "me"}, {"type": "blank", "content": "gusta"}, {"type": "blank", "content": "cuando"}, {"type": "blank", "content": "está"}, {"type": "blank", "content": "jugando"}, {"type": "text", "content": "mi equipo"}, {"type": "blank", "content": "preferido,"}, {"type": "text", "content": "aunque a veces"}, {"type": "blank", "content": "me"}, {"type": "blank", "content": "pongo"}, {"type": "text", "content": "muy"}, {"type": "blank", "content": "nervioso."}]}, {"full": "Marco: ¿Has ido a ver algún juego de béisbol en el estadio?", "ja": "スタジアムに野球の試合を見に行ったことがありますか？", "blank": "Has ido a ver algún juego", "segments": [{"type": "text", "content": "Marco:"}, {"type": "blank", "content": "¿Has"}, {"type": "blank", "content": "ido"}, {"type": "blank", "content": "a"}, {"type": "blank", "content": "ver"}, {"type": "blank", "content": "algún"}, {"type": "blank", "content": "juego"}, {"type": "text", "content": "de béisbol en el estadio?"}]}, {"full": "Rolando: Sí, he visto algunos partidos. Pero últimamente solo los he seguido por la televisión. Me gusta escuchar los comentarios que hacen los narradores.", "ja": "はい、いくつか試合を見たことがあります。でも最近はテレビでしか観ていません。実況解説者のコメントを聞くのが好きです。", "blank": "he visto algunos Pero los he seguido por Me gusta escuchar que hacen", "segments": [{"type": "text", "content": "Rolando: Sí,"}, {"type": "blank", "content": "he"}, {"type": "blank", "content": "visto"}, {"type": "blank", "content": "algunos"}, {"type": "text", "content": "partidos."}, {"type": "blank", "content": "Pero"}, {"type": "text", "content": "últimamente solo"}, {"type": "blank", "content": "los"}, {"type": "blank", "content": "he"}, {"type": "blank", "content": "seguido"}, {"type": "blank", "content": "por"}, {"type": "text", "content": "la televisión."}, {"type": "blank", "content": "Me"}, {"type": "blank", "content": "gusta"}, {"type": "blank", "content": "escuchar"}, {"type": "text", "content": "los comentarios"}, {"type": "blank", "content": "que"}, {"type": "blank", "content": "hacen"}, {"type": "text", "content": "los narradores."}]}, {"full": "Marco: El fútbol y el béisbol se han convertido en deportes muy populares, ¿verdad?", "ja": "サッカーと野球はとても人気のあるスポーツになりましたよね？", "blank": "se han verdad", "segments": [{"type": "text", "content": "Marco: El fútbol y el béisbol"}, {"type": "blank", "content": "se"}, {"type": "blank", "content": "han"}, {"type": "text", "content": "convertido en deportes muy populares,"}, {"type": "blank", "content": "¿verdad?"}]}, {"full": "Rolando: Así es; cada día hay más aficionados en todo el mundo.", "ja": "その通りです。世界中で毎日ファンが増えています。", "blank": "Así es hay el mundo", "segments": [{"type": "text", "content": "Rolando:"}, {"type": "blank", "content": "Así"}, {"type": "blank", "content": "es;"}, {"type": "text", "content": "cada día"}, {"type": "blank", "content": "hay"}, {"type": "text", "content": "más aficionados en todo"}, {"type": "blank", "content": "el"}, {"type": "blank", "content": "mundo."}]}, {"full": "Marco: ¿Quieres ver un partido de fútbol en el Santiago Bernabéu? Estoy pensando en ir. Es como un sueño.", "ja": "サンティアゴ・ベルナベウでサッカーの試合を見たいですか？行こうと思っています。まるで夢のようです。", "blank": "Quieres ver Estoy pensado en ir Es como un sueño", "segments": [{"type": "text", "content": "Marco:"}, {"type": "blank", "content": "¿Quieres"}, {"type": "blank", "content": "ver"}, {"type": "text", "content": "un partido de fútbol en el Santiago Bernabéu?"}, {"type": "blank", "content": "Estoy"}, {"type": "blank", "content": "pensando"}, {"type": "blank", "content": "en"}, {"type": "blank", "content": "ir."}, {"type": "blank", "content": "Es"}, {"type": "blank", "content": "como"}, {"type": "blank", "content": "un"}, {"type": "blank", "content": "sueño."}]}, {"full": "Rolando: Hablando de sueños, yo desde hace tiempo sueño con jugar en la Serie del Caribe.", "ja": "夢と言えば、私はずっとカリビアンシリーズでプレーすることを夢見ています。", "blank": "Hablando de sueños hace tiempo sueño con", "segments": [{"type": "text", "content": "Rolando:"}, {"type": "blank", "content": "Hablando"}, {"type": "blank", "content": "de"}, {"type": "blank", "content": "sueños,"}, {"type": "text", "content": "yo desde"}, {"type": "blank", "content": "hace"}, {"type": "blank", "content": "tiempo"}, {"type": "blank", "content": "sueño"}, {"type": "blank", "content": "con"}, {"type": "text", "content": "jugar en la Serie del Caribe."}]}, {"full": "Marco: Soñar es vivir. Nos vemos pronto. Adiós.", "ja": "夢を見ることは生きることです。また近いうちに。さようなら。", "blank": "Soñar es vivir Nos vemos", "segments": [{"type": "text", "content": "Marco:"}, {"type": "blank", "content": "Soñar"}, {"type": "blank", "content": "es"}, {"type": "blank", "content": "vivir."}, {"type": "blank", "content": "Nos"}, {"type": "blank", "content": "vemos"}, {"type": "text", "content": "pronto. Adiós."}]}]}];

        let allSentences = [];
        let g = 0;
        conversationData.forEach((conv, ci) => {
            conv.sentences.forEach((s) => {
                allSentences.push({
                    id: g,
                    mod: g % 2,
                    segments: s.segments,
                    japanese: s.ja,
                    convIndex: ci,
                    convTitle: conv.title,
                    hasBlank: s.segments.some(seg => seg.type === 'blank')
                });
                g++;
            });
        });

        const container = document.getElementById('conversationsContainer');
        const modSelect = document.getElementById('modSelect');
        const blankToggle = document.getElementById('blankModeToggle');
        const totalCount = document.getElementById('totalCount');
        let currentFilter = 'all';
        let blankMode = true;
        const sentenceElements = new Map();

        function render() {
            container.innerHTML = '';
            sentenceElements.clear();
            const grouped = {};
            allSentences.forEach(s => { (grouped[s.convIndex] ||= []).push(s); });

            Object.keys(grouped).forEach((convIdx) => {
                const conv = grouped[convIdx];
                const block = document.createElement('div');
                block.className = 'conv-block';
                const titleEl = document.createElement('div');
                titleEl.className = 'conv-title';
                titleEl.textContent = conv[0].convTitle;
                block.appendChild(titleEl);

                conv.forEach((s) => {
                    const card = document.createElement('div');
                    card.className = 'sentence-card fade-in';
                    card.dataset.mod = s.mod;
                    card.dataset.id = s.id;

                    const colEs = document.createElement('div');
                    colEs.className = 'spanish-col';
                    const fc = document.createElement('span');
                    fc.style.display = 'inline';
                    fc.style.width = '100%';
                    const blankInputs = [];

                    s.segments.forEach((seg) => {
                        if (seg.type === 'text') {
                            const sp = document.createElement('span');
                            sp.className = 'text-fragment';
                            sp.textContent = (seg.content ? seg.content + ' ' : '');
                            fc.appendChild(sp);
                        } else {
                            const wrapper = document.createElement('span');
                            wrapper.className = 'blank-wrapper';
                            wrapper.style.display = 'inline-flex';
                            wrapper.style.alignItems = 'center';
                            wrapper.style.gap = '2px';
                            wrapper.style.margin = '0 3px 0 1px';
                            wrapper.style.verticalAlign = 'middle';

                            const input = document.createElement('input');
                            input.type = 'text';
                            input.className = 'blank-input';
                            input.placeholder = '…';
                            input.dataset.correct = seg.content;
                            input.autocomplete = 'off';
                            input.spellcheck = false;
                            input.size = Math.max(6, Math.min(40, seg.content.length + 1));

                            const btn = document.createElement('button');
                            btn.className = 'blank-fill-btn';
                            btn.textContent = '✓';
                            btn.title = '正答を入力';

                            wrapper.appendChild(input);
                            wrapper.appendChild(btn);
                            fc.appendChild(wrapper);
                            blankInputs.push({ input, btn, correct: seg.content });
                        }
                    });
                    colEs.appendChild(fc);

                    const modTag = document.createElement('span');
                    modTag.className = 'mod-tag';
                    modTag.textContent = 'mod ' + s.mod;
                    colEs.appendChild(modTag);

                    if (!s.hasBlank) {
                        const msg = document.createElement('span');
                        msg.className = 'no-blank-msg';
                        msg.textContent = '（空欄なし）';
                        colEs.appendChild(msg);
                    }
                    card.appendChild(colEs);

                    const colJa = document.createElement('div');
                    colJa.className = 'japanese-col';
                    const tja = document.createElement('span');
                    tja.textContent = s.japanese;
                    colJa.appendChild(tja);
                    card.appendChild(colJa);

                    const normalize = v => v.trim().replace(/\s+/g, ' ');
                    blankInputs.forEach(({ input, btn, correct }) => {
                        input.addEventListener('input', function () {
                            const u = normalize(this.value);
                            const c = normalize(correct);
                            if (u === c) { this.classList.remove('wrong'); this.classList.add('correct'); }
                            else if (u.length > 0) { this.classList.remove('correct'); this.classList.add('wrong'); }
                            else { this.classList.remove('correct', 'wrong'); }
                        });
                        btn.addEventListener('click', function () {
                            input.value = correct;
                            input.classList.remove('wrong');
                            input.classList.add('correct');
                            this.classList.add('filled');
                            setTimeout(() => this.classList.remove('filled'), 1200);
                        });
                        input.addEventListener('keydown', function (e) {
                            if (e.key === 'Enter') { e.preventDefault(); btn.click(); }
                        });
                    });

                    block.appendChild(card);
                    sentenceElements.set(s.id, { card, colEs, data: s });
                });
                container.appendChild(block);
            });

            totalCount.textContent = allSentences.length;
            applyFiltersAndBlank();
        }

        function applyFiltersAndBlank() {
            sentenceElements.forEach((el) => {
                const s = el.data;
                let show = true;
                if (currentFilter === '0' && s.mod !== 0) show = false;
                if (currentFilter === '1' && s.mod !== 1) show = false;
                el.card.style.display = show ? 'flex' : 'none';

                const blanks = el.colEs.querySelectorAll('.blank-wrapper');
                const noBlankMsg = el.colEs.querySelector('.no-blank-msg');
                if (blankMode && s.hasBlank) {
                    blanks.forEach(w => w.style.display = 'inline-flex');
                    if (noBlankMsg) noBlankMsg.style.display = 'none';
                } else {
                    blanks.forEach(w => w.style.display = 'none');
                    if (noBlankMsg) noBlankMsg.style.display = 'inline';
                }
            });
            const filterLabel = currentFilter === 'all' ? 'すべて表示' : ('mod ' + currentFilter + ' のみ');
            const blankLabel = blankMode ? '✏️ 穴あきON' : '✏️ 穴あきOFF';
            document.getElementById('statusBadge').innerHTML =
                filterLabel + ' ｜ ' + blankLabel + ' ｜ 全 <strong>' + allSentences.length + '</strong> 文';
        }

        modSelect.addEventListener('change', function () { currentFilter = this.value; applyFiltersAndBlank(); });
        blankToggle.addEventListener('change', function () { blankMode = this.checked; applyFiltersAndBlank(); });

        render();
        console.log('✅ 起動 全 ' + allSentences.length + ' 文');
    </script>
