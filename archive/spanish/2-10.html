<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>演習2-10：過去分詞（不規則形）・直接法現在完了（経験）</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            max-width: 1100px;
            margin: 28px auto;
            padding: 18px;
            background: #fbf8f0;
            color: #21313c;
            line-height: 1.6;
        }
        h1, h2, h3 {
            margin: 0.35em 0;
        }
        h1 {
            text-align: center;
            font-size: 1.9rem;
            border-bottom: 3px solid #b22234;
            display: inline-block;
            padding-bottom: 4px;
        }
        .title-block {
            text-align: center;
            margin-bottom: 18px;
        }
        .meta-box {
            background: #eef5ea;
            border-left: 8px solid #2c5f2d;
            padding: 12px 16px;
            border-radius: 18px;
            margin: 18px 0 24px;
            font-size: 0.96rem;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            background: #fff4de;
            padding: 12px 16px;
            border-radius: 20px;
            margin-bottom: 22px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }
        button {
            background: #2c5f2d;
            color: #fff;
            border: none;
            padding: 9px 16px;
            border-radius: 28px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .15s ease, background .15s ease;
            font-size: 0.92rem;
        }
        button:hover {
            transform: scale(.98);
            background: #214521;
        }
        .secondary { background: #6c757d; }
        .danger { background: #b23c1c; }
        select {
            padding: 8px 12px;
            border-radius: 24px;
            border: 1px solid #cdbb91;
            background: #fff;
        }
        #timer-area {
            font-weight: 700;
            background: #ffe1b8;
            padding: 6px 12px;
            border-radius: 24px;
            color: #b23c1c;
            display: none;
        }
        .section {
            background: #fff;
            border: 1px solid #eadfc7;
            border-radius: 24px;
            padding: 18px 20px;
            margin-bottom: 28px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.04);
        }
        .section h3 {
            border-left: 6px solid #b22234;
            padding-left: 12px;
            margin-bottom: 14px;
            text-align: left;
        }
        .note {
            font-size: 0.88rem;
            background: #f7f1df;
            padding: 8px 12px;
            border-radius: 18px;
            margin: 8px 0 14px;
            display: inline-block;
        }
        .question {
            margin-bottom: 22px;
            padding: 12px;
            border-radius: 18px;
            background: #fffdf7;
            border: 1px solid #f1e7cf;
        }
        .question-text {
            font-size: 1.02rem;
            font-weight: 600;
            margin-bottom: 8px;
            background: #f6f1e6;
            padding: 9px 12px;
            border-radius: 18px;
            display: inline-block;
        }
        .jp-hint {
            display: inline-block;
            margin-left: 10px;
            font-size: 0.84rem;
            color: #005f6b;
            background: #e4f3f5;
            padding: 3px 10px;
            border-radius: 18px;
        }
        .answer-hint {
            display: none;
            margin-left: 10px;
            font-size: 0.86rem;
            color: #3d6b3d;
            background: #eef6ea;
            padding: 3px 9px;
            border-radius: 18px;
        }
        .audio-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            vertical-align: middle;
            color: #2c5f2d;
            padding: 0 4px;
            margin-left: 6px;
        }
        input.blank-input {
            width: clamp(80px, 15vw, 180px);
            min-width: 90px;
            padding: 8px 10px;
            font-size: 1rem;
            border: 1px solid #cfb87c;
            border-radius: 14px;
            background: #fffef9;
            text-align: center;
            vertical-align: middle;
            margin: 2px 4px;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        input.blank-input:focus {
            outline: none;
            border-color: #2c5f2d;
            box-shadow: 0 0 0 2px rgba(44, 95, 45, 0.18);
        }
        input.blank-input.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            box-shadow: 0 0 0 2px rgba(40, 167, 69, 0.25);
        }
        textarea.full-input {
            width: 100%;
            max-width: 700px;
            padding: 10px 14px;
            font-size: 1rem;
            border: 1px solid #cfb87c;
            border-radius: 14px;
            background: #fffef9;
            resize: vertical;
            transition: background-color 0.25s ease, border-color 0.25s ease;
            line-height: 1.5;
            font-family: inherit;
        }
        textarea.full-input:focus {
            outline: none;
            border-color: #2c5f2d;
            box-shadow: 0 0 0 2px rgba(44, 95, 45, 0.18);
        }
        textarea.full-input.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            box-shadow: 0 0 0 2px rgba(40, 167, 69, 0.25);
        }
        table.conj-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            table-layout: fixed;
        }
        .conj-table th, .conj-table td {
            border: 1px solid #d9ccb0;
            padding: 10px 8px;
            text-align: center;
            vertical-align: middle;
        }
        .conj-table th {
            background: #f6f1e6;
            font-weight: 700;
        }
        .conj-table td.person {
            background: #fff7ea;
            font-weight: 600;
            width: 18%;
        }
        .conj-table td.form {
            width: 32%;
        }
        .conj-table input {
            width: 100%;
            max-width: none;
            margin: 0;
            border-radius: 12px;
            text-align: center;
        }
        /* 過去分詞のグリッドレイアウト */
        .participle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
        }
        .participle-item {
            background: #fffdf7;
            border: 1px solid #f1e7cf;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .participle-item .label {
            font-weight: 600;
            font-size: 1rem;
            flex: 1 1 50%;
        }
        .participle-item .input-wrap {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex: 1 1 40%;
        }
        #result {
            background: #f4f1e1;
            border-radius: 20px;
            padding: 14px 18px;
            margin-top: 18px;
        }
        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 0.82rem;
            color: #5e5e52;
        }
        @media (max-width: 760px) {
            .conj-table td.person { width: auto; }
            input.blank-input { width: 88px; }
            .participle-item { flex-direction: column; align-items: flex-start; }
            .participle-item .input-wrap { width: 100%; justify-content: flex-start; margin-top: 8px; }
        }
    </style>
</head>
<body>
    <div class="title-block">
        <h1>📘 演習 2-10</h1>
        <p>過去分詞（不規則形）・直接法現在完了（経験）</p>
    </div>

    <div class="meta-box">
        🔹 <strong>第1問</strong>：助動詞 haber の現在形活用（3×2表）<br>
        🔹 <strong>第2問</strong>：過去分詞の不規則形（全14動詞をシャッフル出題）<br>
        🔹 <strong>第3問</strong>：直接法現在完了（経験）の例文記述（日本語からスペイン語全文へ）<br><br>
        🔹 正しい答えを入力すると、その場で空欄が<span style="color:#28a745;font-weight:700;">緑色</span>に変わります。<br>
        🔹 アクセント記号・¿? などの記号も厳密一致です。
    </div>

    <div class="controls">
        <button onclick="generateQuiz()">✨ 問題生成 (シャッフル)</button>
        <button onclick="gradeQuiz()" class="secondary">📝 総合採点</button>
        <button onclick="toggleAnswers()" id="toggleBtn">🔎 答え表示</button>
        <button onclick="resetHistory()" class="danger">🗑 履歴リセット</button>
        <label for="timeLimit">⏱️ 制限時間:</label>
        <select id="timeLimit">
            <option value="0">制限なし</option>
            <option value="180">3分</option>
            <option value="300">5分</option>
            <option value="480">8分</option>
            <option value="600">10分</option>
        </select>
        <div id="timer-area">⏳ 残り <span id="timeDisplay">--:--</span></div>
    </div>

    <form id="quizForm"></form>
    <div id="result"></div>
    <div class="footer">📗 アクセント記号・¿?などの記号も厳密一致です。正答で空欄が緑色に変わります。</div>

    <script>
        function strictCompare(userStr, answerStr) {
            if (!userStr || !answerStr) return false;
            return userStr.trim() === answerStr.trim();
        }

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function speakText(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 0.88;
            window.speechSynthesis.speak(utterance);
        }

        let currentQuestions = [];
        let showAnswersFlag = false;
        let timerInterval = null;
        let timeLeft = 0;
        let scoreHistory = JSON.parse(localStorage.getItem('spanish_exam_2_10_history') || '[]');

        // ========== データ定義 ==========

        // 第1問：haber の現在形活用
        const haberVerb = {
            jp: '現在完了を作る助動詞 haber',
            forms: ['he', 'has', 'ha', 'hemos', 'habéis', 'han']
        };

        // 第2問：過去分詞（不規則形）
        const participles = [
            { infinitive: 'abrir', jp: '開ける', es: 'abierto' },
            { infinitive: 'romper', jp: '壊す', es: 'roto' },
            { infinitive: 'volver', jp: '戻る', es: 'vuelto' },
            { infinitive: 'escribir', jp: '書く', es: 'escrito' },
            { infinitive: 'ver', jp: '見る', es: 'visto' },
            { infinitive: 'poner', jp: '置く', es: 'puesto' },
            { infinitive: 'resolver', jp: '解決する', es: 'resuelto' },
            { infinitive: 'morir', jp: '死ぬ', es: 'muerto' },
            { infinitive: 'decir', jp: '言う', es: 'dicho' },
            { infinitive: 'hacer', jp: 'する、作る', es: 'hecho' },
            { infinitive: 'caer', jp: '落ちる', es: 'caído' },
            { infinitive: 'creer', jp: '信じる', es: 'creído' },
            { infinitive: 'oír', jp: '聞く', es: 'oído' },
            { infinitive: 'traer', jp: '持ってくる', es: 'traído' }
        ];

        // 第3問：経験の例文
        const experienceSentences = [
            { jp: 'かつて海外に行ったことがありますか？', es: '¿Has estado alguna vez en un país extranjero?' },
            { jp: 'はい、アメリカ、韓国、オーストラリアに行ったことがあります。', es: 'Sí, he estado en Estados Unidos, Corea y Australia.' },
            { jp: 'いいえ、どの外国にも行ったことがありません。', es: 'No, no he estado en ningún país extranjero.' },
            { jp: 'かつてメキシコ料理店で食事したことがありますか？', es: '¿Has comido alguna vez en un restaurante mexicano?' },
            { jp: 'かつてパエリアを試した（食べた）ことがありますか？', es: '¿Has probado alguna vez la paella?' },
            { jp: 'かつて富士山に登ったことがありますか？', es: '¿Has subido alguna vez al monte Fuji?' },
            { jp: 'かつて車を運転したことがありますか？（conducirを使って）', es: '¿Has conducido alguna vez en coche?' },
            { jp: 'かつてタコスを試した（食べた）ことがありますか？', es: '¿Has probado alguna vez los tacos?' }
        ];

        // ========== タイマー ==========
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            const limitSec = parseInt(document.getElementById('timeLimit').value, 10);
            const timerDiv = document.getElementById('timer-area');
            if (limitSec === 0) {
                timerDiv.style.display = 'none';
                return;
            }
            timeLeft = limitSec;
            timerDiv.style.display = 'block';
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (timeLeft <= 1) {
                    clearInterval(timerInterval);
                    timerDiv.style.display = 'none';
                    alert('⏰ 制限時間終了！自動採点します。');
                    gradeQuiz();
                } else {
                    timeLeft--;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timeDisplay').innerText = `${m}:${s.toString().padStart(2, '0')}`;
        }

        function toggleAnswers() {
            showAnswersFlag = !showAnswersFlag;
            document.querySelectorAll('.answer-hint').forEach(el => {
                el.style.display = showAnswersFlag ? 'inline' : 'none';
            });
            document.getElementById('toggleBtn').innerText = showAnswersFlag ? '🔒 答え非表示' : '🔎 答え表示';
        }

        function resetHistory() {
            scoreHistory = [];
            localStorage.setItem('spanish_exam_2_10_history', JSON.stringify(scoreHistory));
            document.getElementById('result').innerHTML = '<p>📊 スコア履歴をリセットしました。</p>';
        }

        // ========== リアルタイム正誤判定 ==========
        function checkSingleInput(inputEl, answerStr) {
            if (!inputEl || !answerStr) return;
            if (strictCompare(inputEl.value, answerStr)) {
                inputEl.classList.add('correct');
            } else {
                inputEl.classList.remove('correct');
            }
        }

        function checkTextarea(textareaEl, answerStr) {
            if (!textareaEl || !answerStr) return;
            if (strictCompare(textareaEl.value, answerStr)) {
                textareaEl.classList.add('correct');
            } else {
                textareaEl.classList.remove('correct');
            }
        }

        // ========== 問題ビルダ ==========

        function buildHaberTable(verbData) {
            const forms = verbData.forms;
            const q = document.createElement('div');
            q.className = 'question';
            q.innerHTML = `<div class="question-text">第1問 <span class="jp-hint">📖 ${verbData.jp}</span></div>`;

            const table = document.createElement('table');
            table.className = 'conj-table';
            table.innerHTML = `
            <thead><tr><th>人称</th><th>活用</th><th>人称</th><th>活用</th></tr></thead>
            <tbody>
              <tr>
                <td class="person">yo</td>
                <td class="form"><input class="blank-input" id="q1_0" type="text" autocomplete="off"></td>
                <td class="person">nosotros</td>
                <td class="form"><input class="blank-input" id="q1_3" type="text" autocomplete="off"></td>
              </tr>
              <tr>
                <td class="person">tú</td>
                <td class="form"><input class="blank-input" id="q1_1" type="text" autocomplete="off"></td>
                <td class="person">vosotros</td>
                <td class="form"><input class="blank-input" id="q1_4" type="text" autocomplete="off"></td>
              </tr>
              <tr>
                <td class="person">él / ella / usted</td>
                <td class="form"><input class="blank-input" id="q1_2" type="text" autocomplete="off"></td>
                <td class="person">ellos / ellas / ustedes</td>
                <td class="form"><input class="blank-input" id="q1_5" type="text" autocomplete="off"></td>
              </tr>
            </tbody>
            `;
            q.appendChild(table);

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'audio-btn';
            btn.textContent = '🔊';
            btn.onclick = () => speakText(forms.join(' '));
            q.appendChild(btn);

            const hint = document.createElement('span');
            hint.className = 'answer-hint';
            hint.textContent = `→ ${forms.join(' / ')}`;
            q.appendChild(hint);

            const ids = ['q1_0','q1_1','q1_2','q1_3','q1_4','q1_5'];
            setTimeout(() => {
                ids.forEach((id, idx) => {
                    const inputEl = document.getElementById(id);
                    if (inputEl) inputEl.addEventListener('input', () => checkSingleInput(inputEl, forms[idx]));
                });
            }, 0);

            return { node: q, ids: ids, answers: forms, type: 'q1' };
        }

        function buildParticipleQuestion(p, idx) {
            const item = document.createElement('div');
            item.className = 'participle-item';
            
            const label = document.createElement('div');
            label.className = 'label';
            label.innerHTML = `<span style="color:#888; font-size:0.85em; margin-right:4px;">${idx + 1}.</span>${p.infinitive} <span class="jp-hint">${p.jp}</span>`;
            
            const inputWrap = document.createElement('div');
            inputWrap.className = 'input-wrap';
            
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'blank-input';
            input.id = `q2_${idx}`;
            input.placeholder = "過去分詞";
            input.autocomplete = 'off';
            
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'audio-btn';
            btn.textContent = '🔊';
            btn.onclick = () => speakText(p.es);
            
            const hint = document.createElement('span');
            hint.className = 'answer-hint';
            hint.textContent = `→ ${p.es}`;
            hint.style.display = showAnswersFlag ? 'inline' : 'none';
            
            inputWrap.appendChild(input);
            inputWrap.appendChild(btn);
            inputWrap.appendChild(hint);
            
            item.appendChild(label);
            item.appendChild(inputWrap);
            
            setTimeout(() => {
                const el = document.getElementById(`q2_${idx}`);
                if(el) el.addEventListener('input', () => checkSingleInput(el, p.es));
            }, 0);
            
            return { node: item, id: `q2_${idx}`, answer: p.es, type: 'q2_single', jp: p.infinitive };
        }

        function buildFullSentenceQuestion(sentenceData, qIndex) {
            const q = document.createElement('div');
            q.className = 'question';
            q.innerHTML = `
            <div class="question-text">第3問 ${qIndex + 1}. <span class="jp-hint">📖 ${sentenceData.jp}</span></div>
            <textarea class="full-input" id="q3_${qIndex}" rows="2" placeholder="スペイン語で全文を入力してください" autocomplete="off"></textarea>
            `;

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'audio-btn';
            btn.textContent = '🔊';
            btn.style.marginTop = '6px';
            btn.onclick = () => speakText(sentenceData.es);
            q.appendChild(btn);

            const hint = document.createElement('span');
            hint.className = 'answer-hint';
            hint.textContent = `→ ${sentenceData.es}`;
            hint.style.display = showAnswersFlag ? 'inline' : 'none';
            q.appendChild(hint);

            setTimeout(() => {
                const textarea = document.getElementById(`q3_${qIndex}`);
                if (textarea) {
                    textarea.addEventListener('blur', () => checkTextarea(textarea, sentenceData.es));
                    textarea.addEventListener('input', () => {
                        if (strictCompare(textarea.value, sentenceData.es)) {
                            textarea.classList.add('correct');
                        } else {
                            textarea.classList.remove('correct');
                        }
                    });
                }
            }, 0);

            return { node: q, id: `q3_${qIndex}`, answer: sentenceData.es, type: 'q3_single', jp: sentenceData.jp };
        }

        // ========== メイン問題生成 ==========
        function generateQuiz() {
            if (timerInterval) clearInterval(timerInterval);
            currentQuestions = [];
            const form = document.getElementById('quizForm');
            form.innerHTML = '';
            document.getElementById('result').innerHTML = '';

            // ---- 第1問：Haberの現在形（3x2） ----
            const sec1 = document.createElement('div');
            sec1.className = 'section';
            sec1.innerHTML = `
                <h3>第1問：助動詞 haber の現在形（3×2 表）</h3>
                <div class="note">現在完了の要となる助動詞 haber の6人称を埋めてください。正答で枠が緑色になります。</div>
            `;
            const haberBuilt = buildHaberTable(haberVerb);
            sec1.appendChild(haberBuilt.node);
            currentQuestions.push({
                type: 'q1',
                ids: haberBuilt.ids,
                answers: haberBuilt.answers,
                jp: haberVerb.jp
            });
            form.appendChild(sec1);

            // ---- 第2問：不規則過去分詞 ----
            const sec2 = document.createElement('div');
            sec2.className = 'section';
            sec2.innerHTML = `
                <h3>第2問：過去分詞の不規則形（穴埋め）</h3>
                <div class="note">提示された動詞の<strong>過去分詞形</strong>を入力してください。アクセント記号も厳密判定です。</div>
            `;
            const grid = document.createElement('div');
            grid.className = 'participle-grid';
            const shuffledParticiples = shuffleArray(participles);
            shuffledParticiples.forEach((p, idx) => {
                const built = buildParticipleQuestion(p, idx);
                grid.appendChild(built.node);
                currentQuestions.push(built);
            });
            sec2.appendChild(grid);
            form.appendChild(sec2);

            // ---- 第3問：経験の例文 ----
            const sec3 = document.createElement('div');
            sec3.className = 'section';
            sec3.innerHTML = `
                <h3>第3問：直接法現在完了（経験）</h3>
                <div class="note">日本語を見て、スペイン語の全文を入力してください。アクセント記号・大文字小文字・¿? も厳密一致です。</div>
            `;
            const shuffledSentences = shuffleArray(experienceSentences);
            shuffledSentences.forEach((sent, idx) => {
                const built = buildFullSentenceQuestion(sent, idx);
                sec3.appendChild(built.node);
                currentQuestions.push(built);
            });
            form.appendChild(sec3);

            if (showAnswersFlag) {
                document.querySelectorAll('.answer-hint').forEach(el => el.style.display = 'inline');
            }

            startTimer();
        }

        // ========== 総合採点 ==========
        function gradeQuiz() {
            if (timerInterval) clearInterval(timerInterval);
            let correctCount = 0;
            let totalCount = 0;
            let html = '<h3>📋 採点結果</h3><ul style="list-style:none; padding-left:0;">';

            currentQuestions.forEach((q, idx) => {
                totalCount++;
                let ok = true;
                let userAnswers = [];
                let correctAnswers = [];

                if (q.type === 'q1') {
                    // Haberの表 (6マスで1問扱い)
                    for (let i = 0; i < q.ids.length; i++) {
                        const el = document.getElementById(q.ids[i]);
                        const userVal = el ? el.value : '';
                        userAnswers.push(userVal || '(空白)');
                        correctAnswers.push(q.answers[i]);
                        if (!strictCompare(userVal, q.answers[i])) ok = false;
                        if (el) {
                            if (strictCompare(userVal, q.answers[i])) el.classList.add('correct');
                            else el.classList.remove('correct');
                        }
                    }
                } else if (q.type === 'q2_single' || q.type === 'q3_single') {
                    // 単一入力
                    const el = document.getElementById(q.id);
                    const userVal = el ? el.value : '';
                    userAnswers.push(userVal || '(空白)');
                    correctAnswers.push(q.answer);
                    if (!strictCompare(userVal, q.answer)) ok = false;
                    if (el) {
                        if (strictCompare(userVal, q.answer)) el.classList.add('correct');
                        else el.classList.remove('correct');
                    }
                }

                if (ok) correctCount++;
                
                let displayUserAns = Array.isArray(userAnswers) ? userAnswers.join(' / ') : userAnswers;
                let displayCorrectAns = Array.isArray(correctAnswers) ? correctAnswers.join(' / ') : correctAnswers;
                
                html += `<li>${ok ? '✅' : '❌'} <strong>Q${idx + 1}</strong> (${q.jp})<br>
                <span style="font-size:0.92rem;">入力: ${displayUserAns}<br>
                正解: <span style="color:#2c5f2d; font-weight:bold;">${displayCorrectAns}</span></span></li><br>`;
            });

            const percent = totalCount ? Math.round(correctCount / totalCount * 100) : 0;
            html += `</ul><p style="font-size:1.2rem;">🎯 ${correctCount} / ${totalCount} 正解 (${percent}%)</p>`;
            
            scoreHistory.push(percent);
            if (scoreHistory.length > 8) scoreHistory.shift();
            localStorage.setItem('spanish_exam_2_10_history', JSON.stringify(scoreHistory));
            const avg = scoreHistory.length ? Math.round(scoreHistory.reduce((a, b) => a + b, 0) / scoreHistory.length) : 0;
            html += `<p>📈 直近${scoreHistory.length}回の平均点: ${avg}%</p>`;
            
            document.getElementById('result').innerHTML = html;
        }

        window.generateQuiz = generateQuiz;
        window.gradeQuiz = gradeQuiz;
        window.toggleAnswers = toggleAnswers;
        window.resetHistory = resetHistory;
        window.speakText = speakText;

        window.onload = () => {
            generateQuiz();
        };
    </script>
</body>
</html>
