<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎧 スペイン語リスニングラジオ（全会話統合版）</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fb;
            padding: 30px 20px;
            color: #1e293b;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            padding: 30px 28px 40px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 15px;
            font-weight: 400;
            color: #64748b;
            margin-left: 8px;
        }

        .header-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #e9edf4;
            padding-bottom: 18px;
            margin-bottom: 28px;
            gap: 12px;
        }

        .radio-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            background: #f1f4f9;
            padding: 8px 18px 8px 14px;
            border-radius: 60px;
        }
        .radio-controls button {
            background: #0f172a;
            border: none;
            color: #fff;
            font-size: 20px;
            padding: 6px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            line-height: 1.4;
            border: 1.5px solid transparent;
        }
        .radio-controls button:hover {
            background: #1e293b;
        }
        .radio-controls button:active {
            transform: scale(0.96);
        }
        .radio-controls button.secondary {
            background: #e2e8f0;
            color: #1e293b;
        }
        .radio-controls button.secondary:hover {
            background: #cbd5e1;
        }
        .radio-controls label {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .radio-controls input[type="range"] {
            width: 90px;
            accent-color: #0f172a;
        }
        .radio-controls .speed-val {
            font-weight: 700;
            min-width: 36px;
            text-align: center;
        }

        .badge-status {
            font-size: 13px;
            background: #eef2f6;
            padding: 4px 16px;
            border-radius: 30px;
            color: #475569;
            white-space: nowrap;
        }
        .badge-status strong {
            color: #0f172a;
        }

        /* ===== 会話ブロック ===== */
        .conv-block {
            margin-bottom: 32px;
        }
        .conv-title {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            background: #f1f4f9;
            padding: 8px 18px;
            border-radius: 40px;
            display: inline-block;
            margin-bottom: 16px;
            letter-spacing: 0.3px;
        }

        /* ===== 各センテンスカード ===== */
        .sentence-card {
            display: flex;
            align-items: stretch;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            margin-bottom: 10px;
            background: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            overflow: hidden;
            min-height: 58px;
        }
        .sentence-card:hover {
            border-color: #cbd5e1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }
        .sentence-card.playing {
            background: #f0f7ff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .sentence-card .spanish-col {
            flex: 0 0 48%;
            padding: 14px 18px;
            background: #fafcff;
            border-right: 1.5px solid #e2e8f0;
            font-size: 15px;
            line-height: 1.6;
            color: #0f172a;
            word-break: break-word;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 58px;
        }

        .sentence-card .japanese-col {
            flex: 1;
            padding: 14px 18px;
            background: #ffffff;
            font-size: 15px;
            line-height: 1.6;
            color: #0f172a;
            display: flex;
            align-items: center;
            font-weight: 500;
            min-height: 58px;
        }

        .sentence-card .play-btn {
            flex-shrink: 0;
            background: #0f172a;
            border: none;
            color: #fff;
            font-size: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid transparent;
        }
        .sentence-card .play-btn:hover {
            background: #1e293b;
            transform: scale(1.05);
        }
        .sentence-card .play-btn:active {
            transform: scale(0.92);
        }
        .sentence-card .play-btn.playing-btn {
            background: #3b82f6;
        }

        .sentence-card .mod-tag {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            background: #f1f4f9;
            padding: 1px 10px;
            border-radius: 40px;
            letter-spacing: 0.3px;
            flex-shrink: 0;
            margin-left: auto;
        }

        /* ===== レスポンシブ ===== */
        @media (max-width: 768px) {
            .container {
                padding: 18px 14px;
            }
            .sentence-card {
                flex-direction: column;
                border-radius: 14px;
            }
            .sentence-card .spanish-col {
                flex: none;
                border-right: none;
                border-bottom: 1.5px solid #e2e8f0;
                padding: 12px 16px;
                font-size: 14px;
                background: #f8faff;
                flex-wrap: wrap;
            }
            .sentence-card .japanese-col {
                padding: 12px 16px;
                font-size: 14px;
            }
            .header-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .radio-controls {
                flex-wrap: wrap;
                justify-content: center;
                border-radius: 30px;
                padding: 8px 14px;
            }
            .badge-status {
                text-align: center;
            }
            h1 {
                font-size: 21px;
            }
        }

        @media (max-width: 480px) {
            .sentence-card .spanish-col {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .sentence-card .play-btn {
                align-self: flex-start;
            }
        }

        .hidden {
            display: none !important;
        }
        .fade-in {
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0.4;
                transform: translateY(2px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer-note {
            margin-top: 28px;
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            border-top: 1px solid #e9edf4;
            padding-top: 20px;
        }
        .footer-note span {
            background: #f1f4f9;
            padding: 2px 10px;
            border-radius: 30px;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <div class="header-bar">
            <h1>
                🎧 スペイン語リスニングラジオ
                <small>— 全会話を音声で聴く</small>
            </h1>
            <div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px;">
                <div class="radio-controls">
                    <button id="playAllBtn" title="すべて連続再生">▶ ラジオ再生</button>
                    <button id="stopBtn" class="secondary" title="停止">⏹ 停止</button>
                    <label>
                        <span style="font-size:13px;">速度</span>
                        <input type="range" id="rateSlider" min="0.5" max="2.0" step="0.1" value="1.0" />
                        <span class="speed-val" id="rateDisplay">1.0</span>
                    </label>
                </div>
                <span class="badge-status" id="statusBadge">全 <strong id="totalCount">0</strong> 文</span>
            </div>
        </div>

        <div id="conversationsContainer"></div>

        <div class="footer-note">
            <span>🔊 各文の ▶ ボタンで単独再生・停止 | ラジオ再生で連続リスニング</span>
        </div>
    </div>

        }, {

                'Laura: Sí. ¿Estás libre? A nosotros nos gusta recibir a los amigos en casa.|はい。お暇ですか？私たちは家で友達を迎えるのが好きです。',

        let allSentences = [];
        let globalId = 0;

        conversationData.forEach((conv, ci) => {
            conv.sentences.forEach((raw) => {
                const parts = raw.split('|');
                const spanishFull = parts[0].trim();
                const japanese = parts[1].trim();

                // 内容のみ（話者名除去）— 音声用
                let spanishContent = spanishFull;
                const colonIndex = spanishFull.indexOf(': ');
                if (colonIndex !== -1) {
                    spanishContent = spanishFull.substring(colonIndex + 2).trim();
                } else {
                    const idx = spanishFull.indexOf(':');
                    if (idx !== -1) {
                        spanishContent = spanishFull.substring(idx + 1).trim();
                    }
                }

                allSentences.push({
                    id: globalId,
                    mod: globalId % 2,
                    spanishFull: spanishFull,
                    spanishContent: spanishContent,
                    japanese: japanese,
                    convIndex: ci,
                    convTitle: conv.title,
                });
                globalId++;
            });
        });

        // ================================================================
        //  DOM 構築
        // ================================================================
        const container = document.getElementById('conversationsContainer');
        const totalCount = document.getElementById('totalCount');
        const playAllBtn = document.getElementById('playAllBtn');
        const stopBtn = document.getElementById('stopBtn');
        const rateSlider = document.getElementById('rateSlider');
        const rateDisplay = document.getElementById('rateDisplay');

        const sentenceElements = new Map(); // id -> { card, playBtn, ... }

        // ---- レンダリング ----
        function render() {
            container.innerHTML = '';
            sentenceElements.clear();

            const grouped = {};
            allSentences.forEach(s => {
                if (!grouped[s.convIndex]) grouped[s.convIndex] = [];
                grouped[s.convIndex].push(s);
            });

            Object.keys(grouped).forEach((convIdx) => {
                const conv = grouped[convIdx];
                const title = conv[0].convTitle;

                const block = document.createElement('div');
                block.className = 'conv-block';

                const titleEl = document.createElement('div');
                titleEl.className = 'conv-title';
                titleEl.textContent = title;
                block.appendChild(titleEl);

                conv.forEach((s) => {
                    const card = document.createElement('div');
                    card.className = 'sentence-card fade-in';
                    card.dataset.id = s.id;

                    // --- 左：スペイン語 + 再生ボタン ---
                    const colEs = document.createElement('div');
                    colEs.className = 'spanish-col';

                    const playBtn = document.createElement('button');
                    playBtn.className = 'play-btn';
                    playBtn.textContent = '▶';
                    playBtn.dataset.id = s.id;
                    playBtn.setAttribute('aria-label', '再生');
                    colEs.appendChild(playBtn);

                    const textEs = document.createElement('span');
                    textEs.className = 'text';
                    textEs.textContent = s.spanishFull;
                    colEs.appendChild(textEs);

                    const modTag = document.createElement('span');
                    modTag.className = 'mod-tag';
                    modTag.textContent = `mod ${s.mod}`;
                    colEs.appendChild(modTag);

                    card.appendChild(colEs);

                    // --- 右：日本語 ---
                    const colJa = document.createElement('div');
                    colJa.className = 'japanese-col';
                    const textJa = document.createElement('span');
                    textJa.className = 'text';
                    textJa.textContent = s.japanese;
                    colJa.appendChild(textJa);
                    card.appendChild(colJa);

                    block.appendChild(card);

                    sentenceElements.set(s.id, {
                        card,
                        playBtn,
                        data: s,
                        colEs,
                        colJa,
                    });
                });

                container.appendChild(block);
            });

            totalCount.textContent = allSentences.length;
            updateAllPlayButtons(false);
        }

        // ---- ボタン状態更新 ----
        function updateAllPlayButtons(isPlayingAny) {
            sentenceElements.forEach((el) => {
                const btn = el.playBtn;
                if (isPlayingAny) {
                    btn.textContent = '⏹';
                    btn.classList.add('playing-btn');
                } else {
                    btn.textContent = '▶';
                    btn.classList.remove('playing-btn');
                }
            });
        }

        // ---- 現在再生中のハイライト ----
        let currentPlayingId = null;

        function highlightCard(id) {
            sentenceElements.forEach((el) => {
                el.card.classList.toggle('playing', el.data.id === id);
            });
        }

        // ================================================================
        //  音声再生エンジン
        // ================================================================
        let isPlaying = false;
        let queue = [];
        let currentIndex = -1;
        let currentUtterance = null;
        let isStopped = false;

        // 速度
        let speechRate = 1.0;
        rateSlider.addEventListener('input', () => {
            speechRate = parseFloat(rateSlider.value);
            rateDisplay.textContent = speechRate.toFixed(1);
        });

        // 指定されたテキストを読み上げる（単発）
        function speakText(text, callback) {
            return new Promise((resolve) => {
                if (isStopped) {
                    resolve();
                    return;
                }
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = speechRate;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;

                utterance.onend = () => {
                    currentUtterance = null;
                    resolve();
                };
                utterance.onerror = (e) => {
                    console.warn('音声エラー:', e);
                    currentUtterance = null;
                    resolve();
                };

                currentUtterance = utterance;
                speechSynthesis.speak(utterance);
            });
        }

        // キューを再生（連続）
        async function playQueue() {
            if (isStopped) return;
            if (queue.length === 0) {
                finishPlayback();
                return;
            }

            isPlaying = true;
            playAllBtn.textContent = '⏸ 一時停止';
            updateAllPlayButtons(true);

            const item = queue.shift();
            currentIndex = item.index;
            currentPlayingId = item.id;
            highlightCard(item.id);

            // 単独再生ボタンも更新（現在再生中は停止ボタンに）
            sentenceElements.forEach((el) => {
                if (el.data.id === item.id) {
                    el.playBtn.textContent = '⏹';
                    el.playBtn.classList.add('playing-btn');
                } else {
                    el.playBtn.textContent = '▶';
                    el.playBtn.classList.remove('playing-btn');
                }
            });

            await speakText(item.text);

            if (isStopped) {
                finishPlayback();
                return;
            }

            // 次のキューへ
            playQueue();
        }

        function finishPlayback() {
            isPlaying = false;
            currentPlayingId = null;
            highlightCard(null);
            playAllBtn.textContent = '▶ ラジオ再生';
            updateAllPlayButtons(false);
            sentenceElements.forEach((el) => {
                el.playBtn.textContent = '▶';
                el.playBtn.classList.remove('playing-btn');
            });
            currentUtterance = null;
        }

        // ---- 全体再生開始 ----
        function startAllPlay() {
            if (isPlaying) {
                // 一時停止
                if (currentUtterance) {
                    speechSynthesis.pause();
                }
                playAllBtn.textContent = '▶ 再開';
                return;
            }

            // 再開（一時停止中）
            if (speechSynthesis.paused) {
                speechSynthesis.resume();
                playAllBtn.textContent = '⏸ 一時停止';
                return;
            }

            // 新規再生
            if (queue.length === 0) {
                // キュー作成（全ての文）
                queue = allSentences.map((s, idx) => ({
                    id: s.id,
                    index: idx,
                    text: s.spanishContent,
                }));
                currentIndex = -1;
                isStopped = false;
                playQueue();
            } else {
                // キューが残っている場合（中断後再開など）
                isStopped = false;
                playQueue();
            }
        }

        // ---- 停止 ----
        function stopAll() {
            isStopped = true;
            if (currentUtterance) {
                speechSynthesis.cancel();
                currentUtterance = null;
            }
            queue = [];
            isPlaying = false;
            currentPlayingId = null;
            highlightCard(null);
            playAllBtn.textContent = '▶ ラジオ再生';
            updateAllPlayButtons(false);
            sentenceElements.forEach((el) => {
                el.playBtn.textContent = '▶';
                el.playBtn.classList.remove('playing-btn');
            });
        }

        // ---- 単独再生（トグル） ----
        function toggleSingle(id) {
            if (isPlaying) {
                // 全体再生中に単独ボタンを押した場合 → 全体を停止して単独再生
                stopAll();
            }

            const el = sentenceElements.get(id);
            if (!el) return;

            // 現在同じ文が再生中なら停止
            if (currentPlayingId === id && isPlaying) {
                if (currentUtterance) {
                    speechSynthesis.cancel();
                    currentUtterance = null;
                }
                isPlaying = false;
                currentPlayingId = null;
                highlightCard(null);
                el.playBtn.textContent = '▶';
                el.playBtn.classList.remove('playing-btn');
                return;
            }

            // 単独再生
            isStopped = false;
            isPlaying = true;
            currentPlayingId = id;
            highlightCard(id);
            sentenceElements.forEach((e) => {
                if (e.data.id === id) {
                    e.playBtn.textContent = '⏹';
                    e.playBtn.classList.add('playing-btn');
                } else {
                    e.playBtn.textContent = '▶';
                    e.playBtn.classList.remove('playing-btn');
                }
            });

            const text = el.data.spanishContent;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = speechRate;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;

            utterance.onend = () => {
                isPlaying = false;
                currentPlayingId = null;
                highlightCard(null);
                el.playBtn.textContent = '▶';
                el.playBtn.classList.remove('playing-btn');
                currentUtterance = null;
                // ラジオボタンの状態も戻す
                if (!isStopped) {
                    playAllBtn.textContent = '▶ ラジオ再生';
                }
            };
            utterance.onerror = () => {
                isPlaying = false;
                currentPlayingId = null;
                highlightCard(null);
                el.playBtn.textContent = '▶';
                el.playBtn.classList.remove('playing-btn');
                currentUtterance = null;
            };

            currentUtterance = utterance;
            speechSynthesis.speak(utterance);
        }

        // ================================================================
        //  イベント登録
        // ================================================================
        playAllBtn.addEventListener('click', startAllPlay);

        stopBtn.addEventListener('click', () => {
            stopAll();
        });

        // 各再生ボタンのイベントはレンダリング後にデリゲートで処理
        container.addEventListener('click', (e) => {
            const btn = e.target.closest('.play-btn');
            if (!btn) return;
            const id = parseInt(btn.dataset.id, 10);
            if (isNaN(id)) return;
            toggleSingle(id);
        });

        // ================================================================
        //  初期化
        // ================================================================
        render();
        console.log(`🎧 全 ${allSentences.length} 文を読み込みました。`);
    </script>

</body>
</html>
