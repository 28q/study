<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>演習1-6：現在形活用・穴埋め・比較級（空欄増量版）</title>
  <style>
    * { box-sizing: border-box; }
    body{
      font-family: 'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
      max-width: 1100px;
      margin: 28px auto;
      padding: 18px;
      background:#fbf8f0;
      color:#21313c;
      line-height:1.6;
    }
    h1,h2,h3{ margin:0.35em 0; }
    h1{
      text-align:center;
      font-size:1.9rem;
      border-bottom:3px solid #b22234;
      display:inline-block;
      padding-bottom:4px;
    }
    .title-block{ text-align:center; margin-bottom:18px; }
    .meta-box{
      background:#eef5ea;
      border-left:8px solid #2c5f2d;
      padding:12px 16px;
      border-radius:18px;
      margin:18px 0 24px;
      font-size:0.96rem;
    }
    .controls{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
      background:#fff4de;
      padding:12px 16px;
      border-radius:20px;
      margin-bottom:22px;
      box-shadow:0 2px 6px rgba(0,0,0,0.05);
    }
    button{
      background:#2c5f2d;
      color:#fff;
      border:none;
      padding:9px 16px;
      border-radius:28px;
      font-weight:700;
      cursor:pointer;
      transition:transform .15s ease, background .15s ease;
      font-size:0.92rem;
    }
    button:hover{ transform:scale(.98); background:#214521; }
    .secondary{ background:#6c757d; }
    .danger{ background:#b23c1c; }
    select{
      padding:8px 12px;
      border-radius:24px;
      border:1px solid #cdbb91;
      background:#fff;
    }
    #timer-area{
      font-weight:700;
      background:#ffe1b8;
      padding:6px 12px;
      border-radius:24px;
      color:#b23c1c;
      display:none;
    }
    .section{
      background:#fff;
      border:1px solid #eadfc7;
      border-radius:24px;
      padding:18px 20px;
      margin-bottom:28px;
      box-shadow:0 5px 15px rgba(0,0,0,0.04);
    }
    .section h3{
      border-left:6px solid #b22234;
      padding-left:12px;
      margin-bottom:14px;
      text-align:left;
    }
    .note{
      font-size:0.88rem;
      background:#f7f1df;
      padding:8px 12px;
      border-radius:18px;
      margin:8px 0 14px;
      display:inline-block;
    }
    .question{
      margin-bottom:22px;
      padding:12px;
      border-radius:18px;
      background:#fffdf7;
      border:1px solid #f1e7cf;
    }
    .question-text{
      font-size:1.02rem;
      font-weight:600;
      margin-bottom:8px;
      background:#f6f1e6;
      padding:9px 12px;
      border-radius:18px;
      display:inline-block;
    }
    .jp-hint{
      display:inline-block;
      margin-left:10px;
      font-size:0.84rem;
      color:#005f6b;
      background:#e4f3f5;
      padding:3px 10px;
      border-radius:18px;
    }
    .answer-hint{
      display:none;
      margin-left:10px;
      font-size:0.86rem;
      color:#3d6b3d;
      background:#eef6ea;
      padding:3px 9px;
      border-radius:18px;
    }
    .audio-btn{
      background:none;
      border:none;
      font-size:1.2rem;
      cursor:pointer;
      vertical-align:middle;
      color:#2c5f2d;
      padding:0 4px;
      margin-left:6px;
    }
    input.blank-input{
      width: clamp(80px, 15vw, 180px);
      min-width: 75px;
      padding: 8px 10px;
      font-size: 1rem;
      border: 1px solid #cfb87c;
      border-radius: 14px;
      background:#fffef9;
      text-align:center;
      vertical-align:middle;
      margin: 2px 4px;
    }
    input.blank-input:focus{
      outline:none;
      border-color:#2c5f2d;
      box-shadow:0 0 0 2px rgba(44,95,45,0.18);
    }
    .sentence-line{
      line-height:2.1;
      font-size:1.02rem;
      margin-top:6px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }
    .word{
      display:inline-block;
      margin:0 2px;
      white-space:nowrap;
    }
    table.conj-table{
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
      table-layout:fixed;
    }
    .conj-table th,.conj-table td{
      border:1px solid #d9ccb0;
      padding:10px 8px;
      text-align:center;
      vertical-align:middle;
    }
    .conj-table th{
      background:#f6f1e6;
      font-weight:700;
    }
    .conj-table td.person{
      background:#fff7ea;
      font-weight:600;
      width:18%;
    }
    .conj-table td.form{
      width:32%;
    }
    .conj-table input{
      width:100%;
      max-width:none;
      margin:0;
      border-radius:12px;
      text-align:center;
    }
    #result{
      background:#f4f1e1;
      border-radius:20px;
      padding:14px 18px;
      margin-top:18px;
    }
    .footer{
      text-align:center;
      margin-top:28px;
      font-size:0.82rem;
      color:#5e5e52;
    }
    @media (max-width: 760px){
      .conj-table td.person{ width:auto; }
      input.blank-input{ width: 88px; }
    }
  </style>
</head>
<body>
  <div class="title-block">
    <h1>📘 演習 1-6</h1>
    <p>現在形活用・穴埋め・比較級（空欄増量版）</p>
  </div>

  <div class="meta-box">
    🔹 <strong>第1問</strong>：<strong>jugar</strong>を必ず含め、残り4つをランダムに出題。<br>
    それぞれ <strong>3×2 の表</strong>で、<strong>1マスにつき1つの入力ボックス</strong>にしてください。<br><br>
    🔹 <strong>第2問〜第4問</strong>：一般名詞以外の単語（動詞・代名詞・前置詞・接続詞・疑問詞・比較級キーワードなど）を積極的に空欄にしました。<br>
    空欄数は大幅に増え、より実践的な穴埋め練習になります。
  </div>

  <div class="controls">
    <button onclick="generateQuiz()">✨ 問題生成 (ランダム)</button>
    <button onclick="gradeQuiz()" class="secondary">📝 採点</button>
    <button onclick="toggleAnswers()" id="toggleBtn">🔎 答え表示</button>
    <button onclick="resetHistory()" class="danger">🗑 履歴リセット</button>
    <label for="timeLimit">⏱️ 制限時間:</label>
    <select id="timeLimit">
      <option value="0">制限なし</option>
      <option value="180">3分</option>
      <option value="300">5分</option>
      <option value="480">8分</option>
    </select>
    <div id="timer-area">⏳ 残り <span id="timeDisplay">--:--</span></div>
  </div>

  <form id="quizForm"></form>
  <div id="result"></div>
  <div class="footer">📗 アクセント記号なしでも正答扱いです。空欄は1つずつ個別の入力ボックスで答えてください。</div>

  <script>
    // 正規化（アクセント除去・小文字化・句読点除去）
    function normalize(str){
      if(!str) return '';
      return str.toLowerCase().trim()
        .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .replace(/\s+/g,' ')
        .replace(/[¿?¡!.,;:]/g,'');
    }

    function shuffleArray(arr){
      const a = [...arr];
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
      }
      return a;
    }

    function speakText(text){
      if(!text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.rate = 0.88;
      window.speechSynthesis.speak(utterance);
    }

    let currentQuestions = [];
    let showAnswersFlag = false;
    let timerInterval = null;
    let timeLeft = 0;
    let scoreHistory = JSON.parse(localStorage.getItem('spanish_exam_history_v7') || '[]');

    // 活用データ
    const conjugationData = {
      jugar: ['juego','juegas','juega','jugamos','jugáis','juegan'],
      pensar: ['pienso','piensas','piensa','pensamos','pensáis','piensan'],
      recomendar: ['recomiendo','recomiendas','recomienda','recomendamos','recomendáis','recomiendan'],
      querer: ['quiero','quieres','quiere','queremos','queréis','quieren'],
      sentir: ['siento','sientes','siente','sentimos','sentís','sienten'],
      poder: ['puedo','puedes','puede','podemos','podéis','pueden'],
      contar: ['cuento','cuentas','cuenta','contamos','contáis','cuentan'],
      encontrar: ['encuentro','encuentras','encuentra','encontramos','encontráis','encuentran'],
      dormir: ['duermo','duermes','duerme','dormimos','dormís','duermen'],
      pedir: ['pido','pides','pide','pedimos','pedís','piden'],
      repetir: ['repito','repites','repite','repetimos','repetís','repiten'],
      servir: ['sirvo','sirves','sirve','servimos','servís','sirven'],
      seguir: ['sigo','sigues','sigue','seguimos','seguís','siguen']
    };

    const q1VerbPool = ['pensar','recomendar','querer','sentir','poder','contar','encontrar','dormir','pedir','repetir','servir','seguir'];

    // ------------------------------
    // 第2問〜第4問用データ（単語レベルに分割し、一般名詞以外を空欄化）
    // 各部の answer には空欄にする単語を順に列挙
    // ------------------------------
    const q2Stock = [
      { parts: ['Quiero','saber','de','dónde','son','los','cantantes.'], jp: '私は歌手がどこの出身か知りたい。', answer: ['Quiero','saber','dónde','son'] },
      { parts: ['Dicen','que','el','chorizo','de','España','es','muy','rico.'], jp: 'スペインのチョリソーはとてもおいしいと言われている。', answer: ['Dicen','que','es'] },
      { parts: ['Los','domingos','juego','al','fútbol','sala','con','mis','compañeros.'], jp: '私は日曜日に仲間たちとフットサルをする。', answer: ['juego','con'] },
      { parts: ['Le','pido','un','favor:','¿puede','bajar','un','poco','el','volumen','de','sus','audífonos?'], jp: 'お願いがあります。ヘッドホンの音量を少し下げてもらえますか。', answer: ['Le','pido','puede','bajar'] },
      { parts: ['Tengo','que','decirte','una','cosa...','pero','no','es','para','ofenderte.'], jp: '君に一つ言わなければならないことがある……でも、君を傷つけるためではない。', answer: ['Tengo','que','decirte','pero','no','es'] },
      { parts: ['¿Qué','piensas','hacer','este','fin','de','semana?','—','El','sábado','vamos','a','organizar','una','fiesta.'], jp: '今週末は何をするつもりですか。— 土曜日に私たちはパーティーを開く予定です。', answer: ['Qué','piensas','hacer','vamos','organizar'] }
    ];

    const q3Stock = [
      { parts: ['Lo','que','más','me','gusta','es','viajar','en','tren.'], jp: '私が最も好きなのは電車で旅することだ。', answer: ['Lo','que','más','me','gusta','es'] },
      { parts: ['Te','lo','digo','mañana.'], jp: 'それは明日君に言うよ。', answer: ['Te','lo','digo'] },
      { parts: ['No','la','conozco','todavía.'], jp: '私はまだ彼女を知らない。', answer: ['No','la','conozco'] },
      { parts: ['Nos','lo','explican','con','calma.'], jp: '彼らはそれを私たちに落ち着いて説明する。', answer: ['Nos','lo','explican'] },
      { parts: ['Lo','que','dices','no','tiene','sentido.'], jp: '君が言うことは意味がない。', answer: ['Lo','que','dices','no','tiene'] },
      { parts: ['Lo','que','quiero','ahora','es','descansar.'], jp: '今私がしたいのは休むことだ。', answer: ['Lo','que','quiero','es'] }
    ];

    const q4Stock = [
      { parts: ['Mi','casa','es','más','cara','que','la','tuya.'], jp: '私の家は君の家より高い。', answer: ['es','más','cara','que'] },
      { parts: ['Hoy','llegamos','menos','tarde','que','ayer.'], jp: '今日は昨日より遅く着かなかった。', answer: ['llegamos','menos','tarde','que'] },
      { parts: ['Este','problema','es','tan','importante','como','el','anterior.'], jp: 'この問題は前のものと同じくらい重要だ。', answer: ['es','tan','importante','como'] },
      { parts: ['La','tarea','es','más','compleja','de','lo','que','pensaba.'], jp: 'その課題は思っていたより複雑だ。', answer: ['es','más','compleja','de','que','pensaba'] },
      { parts: ['Este','libro','es','mejor','que','el','otro.'], jp: 'この本はあの本より良い。', answer: ['es','mejor','que'] },
      { parts: ['Mi','hermano','es','mayor','que','yo.'], jp: '私の兄は私より年上だ。', answer: ['es','mayor','que'] },
      { parts: ['Hoy','estoy','peor','que','ayer.'], jp: '今日は昨日より体調が悪い。', answer: ['estoy','peor','que'] },
      { parts: ['Mi','hermana','es','menor','que','yo.'], jp: '私の妹は私より年下だ。', answer: ['es','menor','que'] }
    ];

    // タイマー関連
    function startTimer(){
      if(timerInterval) clearInterval(timerInterval);
      const limitSec = parseInt(document.getElementById('timeLimit').value, 10);
      const timerDiv = document.getElementById('timer-area');
      if(limitSec === 0){
        timerDiv.style.display = 'none';
        return;
      }
      timeLeft = limitSec;
      timerDiv.style.display = 'block';
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        if(timeLeft <= 1){
          clearInterval(timerInterval);
          timerDiv.style.display = 'none';
          alert('⏰ 制限時間終了！自動採点します。');
          gradeQuiz();
        }else{
          timeLeft--;
          updateTimerDisplay();
        }
      }, 1000);
    }

    function updateTimerDisplay(){
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      document.getElementById('timeDisplay').innerText = `${m}:${s.toString().padStart(2,'0')}`;
    }

    function toggleAnswers(){
      showAnswersFlag = !showAnswersFlag;
      document.querySelectorAll('.answer-hint').forEach(el => {
        el.style.display = showAnswersFlag ? 'inline' : 'none';
      });
      document.getElementById('toggleBtn').innerText = showAnswersFlag ? '🔒 答え非表示' : '🔎 答え表示';
    }

    function resetHistory(){
      scoreHistory = [];
      localStorage.setItem('spanish_exam_history_v7', JSON.stringify(scoreHistory));
      document.getElementById('result').innerHTML = '<p>📊 スコア履歴をリセットしました。</p>';
    }

    // 穴埋め文レンダリング（parts と answer を照合して入力ボックスを配置）
    function renderSentence(parts, answerWords, qId){
      const container = document.createElement('div');
      container.className = 'sentence-line';
      const blankAnswers = [];
      let answerIdx = 0;
      const ansNorm = answerWords.map(w => normalize(w));

      parts.forEach((part, idx) => {
        const partNorm = normalize(part);
        if(answerIdx < ansNorm.length && partNorm === ansNorm[answerIdx]){
          // この部分が空欄対象
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'blank-input';
          input.id = `${qId}_b${blankAnswers.length}`;
          input.placeholder = '□';
          input.autocomplete = 'off';
          container.appendChild(input);
          blankAnswers.push(answerWords[answerIdx]);
          answerIdx++;
        } else {
          // そのまま表示
          const span = document.createElement('span');
          span.className = 'word';
          span.textContent = part + ' ';
          container.appendChild(span);
        }
      });
      // 万が一 answers が余っていても無視（データミス防止）
      return { container, blanks: blankAnswers.length, answers: blankAnswers };
    }

    // 第1問：活用表生成
    function buildQ1Section(selectedVerbs){
      const section = document.createElement('div');
      section.className = 'section';
      section.innerHTML = `
        <h3>第1問：現在形活用（3×2 の表）</h3>
        <div class="note">各動詞について 6人称を埋めてください。<strong>1マス＝1入力ボックス</strong>です。</div>
      `;

      selectedVerbs.forEach((verb, idx) => {
        const forms = conjugationData[verb];
        const q = document.createElement('div');
        q.className = 'question';
        q.innerHTML = `<div class="question-text">${idx + 1}. ${verb}</div>`;

        const table = document.createElement('table');
        table.className = 'conj-table';
        table.innerHTML = `
          <thead><tr><th>人称</th><th>活用</th><th>人称</th><th>活用</th></tr></thead>
          <tbody>
            <tr><td class="person">yo</td><td class="form"><input class="blank-input" id="q1_${idx}_0" type="text"></td>
                <td class="person">nosotros</td><td class="form"><input class="blank-input" id="q1_${idx}_3" type="text"></td></tr>
            <tr><td class="person">tú</td><td class="form"><input class="blank-input" id="q1_${idx}_1" type="text"></td>
                <td class="person">vosotros</td><td class="form"><input class="blank-input" id="q1_${idx}_4" type="text"></td></tr>
            <tr><td class="person">él / ella / usted</td><td class="form"><input class="blank-input" id="q1_${idx}_2" type="text"></td>
                <td class="person">ellos / ellas / ustedes</td><td class="form"><input class="blank-input" id="q1_${idx}_5" type="text"></td></tr>
          </tbody>
        `;
        q.appendChild(table);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'audio-btn';
        btn.textContent = '🔊';
        btn.onclick = () => speakText(forms.join(' '));
        q.appendChild(btn);

        const hint = document.createElement('span');
        hint.className = 'answer-hint';
        hint.textContent = `→ ${forms.join(' / ')}`;
        q.appendChild(hint);

        section.appendChild(q);
        currentQuestions.push({
          type: 'q1',
          verb,
          ids: [`q1_${idx}_0`,`q1_${idx}_1`,`q1_${idx}_2`,`q1_${idx}_3`,`q1_${idx}_4`,`q1_${idx}_5`],
          answers: forms
        });
      });
      return section;
    }

    // インライン穴埋め問題（第2〜4問）を1問作成
    function buildInlineQuestion(item, qNum){
      const q = document.createElement('div');
      q.className = 'question';
      q.innerHTML = `<div class="question-text">${qNum}. <span class="jp-hint">📖 ${item.jp}</span></div>`;
      const qId = `q_${qNum}`;
      const rendered = renderSentence(item.parts, item.answer, qId);
      q.appendChild(rendered.container);

      // 音声ボタン（全文読み上げ）
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'audio-btn';
      btn.textContent = '🔊';
      btn.onclick = () => speakText(item.parts.join(' '));
      q.appendChild(btn);

      // 答え表示用ヒント
      const hint = document.createElement('span');
      hint.className = 'answer-hint';
      hint.textContent = `→ ${item.parts.join(' ')}`;
      q.appendChild(hint);

      return {
        node: q,
        ids: rendered.answers.map((_, i) => `${qId}_b${i}`),
        answers: rendered.answers
      };
    }

    // メイン問題生成
    function generateQuiz(){
      if(timerInterval) clearInterval(timerInterval);
      currentQuestions = [];
      const form = document.getElementById('quizForm');
      form.innerHTML = '';
      document.getElementById('result').innerHTML = '';

      // 第1問
      const selectedVerbs = ['jugar', ...shuffleArray(q1VerbPool).slice(0, 4)];
      form.appendChild(buildQ1Section(selectedVerbs));

      // 第2問（3問）
      const sec2 = document.createElement('div');
      sec2.className = 'section';
      sec2.innerHTML = `<h3>第2問：例文穴埋め（一般名詞以外を積極的に空欄）</h3><div class="note">動詞・代名詞・前置詞・接続詞・疑問詞などが空欄になっています。</div>`;
      shuffleArray(q2Stock).slice(0, 3).forEach((item) => {
        const qNum = currentQuestions.length + 1;
        const built = buildInlineQuestion(item, qNum);
        sec2.appendChild(built.node);
        currentQuestions.push({ type:'inline', ids: built.ids, answers: built.answers });
      });
      form.appendChild(sec2);

      // 第3問（2問）
      const sec3 = document.createElement('div');
      sec3.className = 'section';
      sec3.innerHTML = `<h3>第3問：lo que ／ 目的格人称代名詞</h3><div class="note">代名詞や lo que 関連を中心に空欄を増やしています。</div>`;
      shuffleArray(q3Stock).slice(0, 2).forEach((item) => {
        const qNum = currentQuestions.length + 1;
        const built = buildInlineQuestion(item, qNum);
        sec3.appendChild(built.node);
        currentQuestions.push({ type:'inline', ids: built.ids, answers: built.answers });
      });
      form.appendChild(sec3);

      // 第4問（4問：規則比較2・不規則比較2）
      const sec4 = document.createElement('div');
      sec4.className = 'section';
      sec4.innerHTML = `<h3>第4問：比較級</h3><div class="note">規則比較・不規則比較（mejor, peor, mayor, menor など）の重要語を空欄にしています。</div>`;
      const regular = shuffleArray(q4Stock.slice(0, 4)).slice(0, 2);
      const irregular = shuffleArray(q4Stock.slice(4)).slice(0, 2);
      shuffleArray([...regular, ...irregular]).forEach((item) => {
        const qNum = currentQuestions.length + 1;
        const built = buildInlineQuestion(item, qNum);
        sec4.appendChild(built.node);
        currentQuestions.push({ type:'inline', ids: built.ids, answers: built.answers });
      });
      form.appendChild(sec4);

      if(showAnswersFlag){
        document.querySelectorAll('.answer-hint').forEach(el => el.style.display = 'inline');
      }
      startTimer();
    }

    // 採点
    function gradeQuiz(){
      if(timerInterval) clearInterval(timerInterval);
      let correctCount = 0;
      let totalCount = 0;
      let html = '<h3>📋 採点結果</h3><ul style="list-style:none; padding-left:0;">';

      currentQuestions.forEach((q, idx) => {
        totalCount++;
        let ok = true;
        const userAnswers = [];
        for(let i=0;i<q.ids.length;i++){
          const el = document.getElementById(q.ids[i]);
          const user = el ? el.value : '';
          userAnswers.push(user);
          if(normalize(user) !== normalize(q.answers[i])) ok = false;
        }
        if(ok) correctCount++;
        html += `<li>${ok ? '✅' : '❌'} <strong>問${idx + 1}</strong><br>
          <span style="font-size:0.92rem;">入力: ${userAnswers.join(' / ') || '(空白)'}<br>
          正解: ${q.answers.join(' / ')}</span></li><br>`;
      });

      const percent = totalCount ? Math.round(correctCount / totalCount * 100) : 0;
      html += `</ul><p style="font-size:1.2rem;">🎯 ${correctCount} / ${totalCount} 正解 (${percent}%)</p>`;
      scoreHistory.push(percent);
      if(scoreHistory.length > 8) scoreHistory.shift();
      localStorage.setItem('spanish_exam_history_v7', JSON.stringify(scoreHistory));
      const avg = scoreHistory.length ? Math.round(scoreHistory.reduce((a,b) => a + b, 0) / scoreHistory.length) : 0;
      html += `<p>📈 直近${scoreHistory.length}回の平均点: ${avg}%</p>`;
      document.getElementById('result').innerHTML = html;
    }

    // グローバル公開
    window.generateQuiz = generateQuiz;
    window.gradeQuiz = gradeQuiz;
    window.toggleAnswers = toggleAnswers;
    window.resetHistory = resetHistory;
    window.speakText = speakText;

    window.onload = () => {
      generateQuiz();
    };
  </script>
</body>
</html>
