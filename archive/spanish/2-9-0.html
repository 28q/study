    <div class="wrap">
        <div class="title">
            <h1>スペイン語演習：会話テンプレート＋文法総復習 (2-9)</h1>
            <p>第1問：会話穴埋め ／ 第2～9問：文法項目別 日本語→スペイン語</p>
        </div>

        <div class="notice">
            <strong>■ 構成</strong><br>
            ・<b>第1問</b>：会話テンプレート（時刻・予定・義務・直後・開始・推量など）<br>
            ・<b>第2～9問</b>：各文法項目に絞った日本語→スペイン語演習（各項目4～8題）<br>
            ・⑨は「hay que / deber de + 不定詞」の混合演習です。<br>
            ・アクセント記号・大文字小文字の違いは無視して採点します。<br>
            ・「答えを表示」で全問の正解が入力欄に表示されます。
        </div>

        <div class="controls">
            <button type="button" onclick="generateQuiz()">問題を作り直す</button>
            <button type="button" class="secondary" onclick="gradeQuiz()">採点する</button>
            <button type="button" class="answer-toggle" id="toggleBtn" onclick="toggleAnswers()">答えを表示</button>
            <button type="button" class="danger" onclick="resetHistory()">履歴リセット</button>
            <label for="qCount" class="small">第1問の出題数：</label>
            <select id="qCount">
                <option value="12">12題</option>
                <option value="16" selected>16題</option>
                <option value="20">20題</option>
                <option value="24">24題</option>
            </select>
        </div>

        <form id="quizForm"></form>
        <div id="result"></div>
        <div class="footer">空欄は1つずつ入力してください。表示順は毎回シャッフルされます。</div>
    </div>

        // ------------------------------------------------------------
        // ユーティリティ
        // ------------------------------------------------------------
        function normalize(str) {
            return (str || '')
                .toLowerCase()
                .trim()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/\s+/g, ' ')
                .replace(/[¿?¡!.,;:]/g, '');
        }

        function shuffle(array) {
            const a = [...array];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function b(answer, w) {
            return { blank: true, answer, width: w || 10 };
        }

        // 状態
        // ------------------------------------------------------------

        let currentQuestions = [];

        // 問題バンク
        // ------------------------------------------------------------

                            ' practicar más.'] },
                    { jp: 'この仕事は静かにしなければならない。', parts: ['', b('Hay', 10), ' ', b('que', 8),
                            ' hacerlo en silencio.'] },
                    { jp: 'この部屋は毎日掃除しなければならない。', parts: ['', b('Hay', 10), ' ', b('que', 8),
                            ' limpiar esta habitación todos los días.'] },
                    { jp: 'スペイン語は毎日少しずつ勉強しなければならない。', parts: ['', b('Hay', 10), ' ', b('que', 8),
                            ' estudiar un poco de español cada día.'] }
                ]
            },
            'deber_de': {
                label: 'deber de + 不定詞',
                items: [
                    { jp: '彼は家にいるに違いない。', parts: ['Él ', b('debe', 10), ' ', b('de', 8), ' estar en casa.'] },
                    { jp: '今ごろ彼女は寝ているに違いない。', parts: ['Ella ', b('debe', 10), ' ', b('de', 8),
                            ' estar durmiendo ahora.'] },
                    { jp: 'あの人は先生に違いない。', parts: ['Esa persona ', b('debe', 10), ' ', b('de', 8),
                            ' ser profesora.'] },
                    { jp: 'この店はもう閉まっているに違いない。', parts: ['Esta tienda ', b('debe', 10), ' ', b('de', 8),
                            ' estar cerrada ya.'] }
                ]
            }
        };

        // Exercise 2～9 の定義（第9問は hay que と deber de を混合）
        const exerciseOrderFinal = [
            { id: 2, key: 'pensar', label: 'pensar + 不定詞' },
            { id: 3, key: 'pensar_en', label: 'pensar en + 不定詞' },
            { id: 4, key: 'sentir', label: 'sentir + 不定詞' },
            { id: 5, key: 'deber', label: 'deber + 不定詞' },
            { id: 6, key: 'acabar_de', label: 'acabar de + 不定詞' },
            { id: 7, key: 'empezar_a', label: 'empezar a + 不定詞' },
            { id: 8, key: 'tener_que', label: 'tener que + 不定詞' },
            { id: 9, key: 'hay_que_deber_de', label: 'hay que / deber de + 不定詞' }
        ];

        // 第9問用の混合アイテム
        const hayQueDeberDeItems = [
            ...grammarCategories['hay_que'].items,
            ...grammarCategories['deber_de'].items
        ];

        // ------------------------------------------------------------
        // レンダリング補助
        // ------------------------------------------------------------
        function renderParts(parts, qid, blankIndexStart) {
            const wrapper = document.createElement('div');
            wrapper.className = 'content';
            let blankIndex = blankIndexStart || 0;
            parts.forEach(part => {
                if (typeof part === 'string') {
                    const span = document.createElement('span');
                    span.className = 'word';
                    span.textContent = part;
                    wrapper.appendChild(span);
                } else if (part && part.blank) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'blank';
                    input.id = `${qid}_${blankIndex}`;
                    input.autocomplete = 'off';
                    input.dataset.answer = part.answer;
                    input.style.width = `clamp(72px, ${part.width}vw, 210px)`;
                    input.addEventListener('input', function() {
                        validateInput(this);
                    });
                    wrapper.appendChild(input);
                    blankIndex++;
                }
            });
            return { node: wrapper, nextIndex: blankIndex };
        }

        function validateInput(el) {
            if (!el || !el.dataset.answer) return;
            if (el.classList.contains('showing-answer')) return;
            if (normalize(el.value) === normalize(el.dataset.answer)) {
                el.style.background = '#d9efd4';
                el.style.borderColor = '#2c5f2d';
            } else {
                el.style.background = '#fffef9';
                el.style.borderColor = '#cdbb91';
            }
        }

        // ------------------------------------------------------------
        // カード生成
        // ------------------------------------------------------------
        function makeCard(index, item, mode, categoryLabel) {
            const card = document.createElement('div');
            card.className = 'card';

            const head = document.createElement('div');
            head.className = 'qhead';

            const left = document.createElement('div');
            left.innerHTML =
                `<span class="qnum">${index}.</span><span class="jp">${item.jp}</span>`;

            const right = document.createElement('div');
            const tagText = categoryLabel || item.cat || item.tag || '';
            right.innerHTML = `<span class="tag">${tagText}</span>`;

            head.appendChild(left);
            head.appendChild(right);
            card.appendChild(head);

            if (mode === 'dialogue') {
                const dialogue = document.createElement('div');
                dialogue.className = 'dialogue';
                item.lines.forEach((line, i) => {
                    const row = document.createElement('div');
                    row.className = 'line';
                    const spk = document.createElement('div');
                    spk.className = 'speaker';
                    spk.textContent = line.spk;
                    const content = renderParts(line.parts, `q${mode}_${index}`, i * 10);
                    row.appendChild(spk);
                    row.appendChild(content.node);
                    dialogue.appendChild(row);
                });
                card.appendChild(dialogue);
            } else {
                // translation mode
                const row = document.createElement('div');
                row.className = 'line';
                const spk = document.createElement('div');
                spk.className = 'speaker';
                spk.textContent = '答';
                const content = renderParts(item.parts, `q${mode}_${index}`);
                row.appendChild(spk);
                row.appendChild(content.node);
                card.appendChild(row);

                const note = document.createElement('div');
                note.className = 'inline-help';
                note.textContent = '日本語を見て、スペイン語を完成させてください。';
                card.appendChild(note);
            }

            // 現在の問題リストに登録（IDと正答を保存）
            const inputs = card.querySelectorAll('input.blank');
            const answers = [...inputs].map(inp => inp.dataset.answer);
            currentQuestions.push({
                ids: [...inputs].map(inp => inp.id),
                answers: answers
            });

            return card;
        }

        // ------------------------------------------------------------
        // 問題生成（メイン）
        // ------------------------------------------------------------
        function generateQuiz() {
            try {
                // 状態リセット
                currentQuestions = [];
                savedUserInputs = {};                // 保存データもクリア
                document.getElementById('result').innerHTML = '';
                const form = document.getElementById('quizForm');
                if (!form) {
                    alert('フォーム要素が見つかりません。');
                    return;
                }
                form.innerHTML = '';

                // ---- 第1問：会話テンプレート ----
                const qCountEl = document.getElementById('qCount');
                const qCount = parseInt(qCountEl ? qCountEl.value : '16', 10);
                const shuffledQ1 = shuffle(q1Bank).slice(0, qCount);

                const sec1 = document.createElement('div');
                sec1.className = 'section';
                sec1.innerHTML = `
                    <h2>第1問　会話テンプレート（穴埋め） <span class="ex-number">Exercise 1</span></h2>
                    <p class="sub">授業で使う会話の型を実戦的に練習。時刻・予定・義務・直後・開始・推量などをまとめて復習します。</p>
                `;
                shuffledQ1.forEach((item, i) => {
                    sec1.appendChild(makeCard(i + 1, item, 'dialogue', item.cat));
                });
                form.appendChild(sec1);

                // ---- 第2～9問：文法項目別 ----
                exerciseOrderFinal.forEach((ex) => {
                    const sec = document.createElement('div');
                    sec.className = 'section';

                    let items = [];
                    let label = ex.label;
                    if (ex.key === 'hay_que_deber_de') {
                        items = shuffle(hayQueDeberDeItems);
                        label = 'hay que / deber de + 不定詞';
                    } else {
                        const cat = grammarCategories[ex.key];
                        if (cat) {
                            items = shuffle(cat.items);
                            label = cat.label;
                        } else {
                            items = [];
                            label = ex.label + ' (データなし)';
                        }
                    }

                    sec.innerHTML = `
                        <h2>第${ex.id}問　${label} <span class="ex-number">Exercise ${ex.id}</span></h2>
                        <p class="sub">日本語の意味から、対応するスペイン語表現を作ってください（全${items.length}題）。</p>
                    `;

                    items.forEach((item, i) => {
                        sec.appendChild(makeCard(i + 1, item, 'translate', label));
                    });
                    form.appendChild(sec);
                });

                // 答え表示状態をリセット
                showAnswers = false;
                const toggleBtn = document.getElementById('toggleBtn');
                if (toggleBtn) toggleBtn.textContent = '答えを表示';
                document.querySelectorAll('.blank.showing-answer').forEach(el => {
                    el.classList.remove('showing-answer');
                    el.style.background = '#fffef9';
                    el.style.borderColor = '#cdbb91';
                    el.style.color = '';
                    el.style.fontWeight = '';
                    el.value = '';
                });

            } catch (e) {
                alert('問題の生成中にエラーが発生しました: ' + e.message);
                console.error(e);
            }
        }

        // ------------------------------------------------------------
        // 答えの表示／隠す（改善版）
        // ------------------------------------------------------------
        function toggleAnswers() {
            const allBlanks = document.querySelectorAll('input.blank');
            if (!showAnswers) {
                // 非表示 → 表示：現在の入力を保存し、正解を表示
                savedUserInputs = {};
                allBlanks.forEach(inp => {
                    if (!inp.classList.contains('showing-answer')) {
                        savedUserInputs[inp.id] = inp.value;
                    }
                    inp.value = inp.dataset.answer || '';
                    inp.classList.add('showing-answer');
                    inp.style.background = '#e3f0dc';
                    inp.style.borderColor = '#3a7a3b';
                    inp.style.color = '#1d4a1e';
                    inp.style.fontWeight = '700';
                    inp.readOnly = true;   // 表示中は編集不可に
                });
                showAnswers = true;
            } else {
                // 表示 → 非表示：保存していた入力を復元
                allBlanks.forEach(inp => {
                    inp.value = savedUserInputs[inp.id] || '';
                    inp.classList.remove('showing-answer');
                    inp.style.background = '#fffef9';
                    inp.style.borderColor = '#cdbb91';
                    inp.style.color = '';
                    inp.style.fontWeight = '';
                    inp.readOnly = false;
                });
                savedUserInputs = {};
                showAnswers = false;
            }
            document.getElementById('toggleBtn').textContent = showAnswers ? '答えを隠す' : '答えを表示';
        }

        // ------------------------------------------------------------
        // 採点（改善版）
        // ------------------------------------------------------------
        function gradeQuiz() {
            // もし答えが表示されている場合は、ユーザー入力を復元してから採点
            if (showAnswers) {
                toggleAnswers();  // 非表示にし、元の入力を復元
            }

            let correctQuestions = 0;
            const details = [];

            currentQuestions.forEach((q, idx) => {
                let allOk = true;
                const userTexts = [];
                for (let i = 0; i < q.ids.length; i++) {
                    const el = document.getElementById(q.ids[i]);
                    const user = el ? el.value : '';
                    userTexts.push(user);
                    const normUser = normalize(user);
                    const normAns = normalize(q.answers[i] || '');
                    if (normUser !== normAns) {
                        allOk = false;
                        if (el) {
                            el.classList.add('wrong');
                            el.classList.remove('correct');
                            el.style.background = '#ffe6e0';
                            el.style.borderColor = '#b23c1c';
                        }
                    } else {
                        if (el) {
                            el.classList.add('correct');
                            el.classList.remove('wrong');
                            el.style.background = '#d9efd4';
                            el.style.borderColor = '#2c5f2d';
                        }
                    }
                }
                if (allOk) correctQuestions++;
                const status = allOk ? '✅' : '❌';
                const displayAnswers = q.answers.join(' / ');
                const displayUsers = userTexts.join(' / ') || '(空白)';
                details.push(`<li>${status} 問${idx + 1}：${displayUsers}<br><span class="small">正解：${displayAnswers}</span></li>`);
            });

            const totalQuestions = currentQuestions.length;
            const score = totalQuestions ? Math.round(correctQuestions / totalQuestions * 100) : 0;
            history.push(score);
            if (history.length > 10) history.shift();
            localStorage.setItem('spa_exercise_history_v1', JSON.stringify(history));
            const avg = history.length ? Math.round(history.reduce((a, b) => a + b, 0) / history.length) : 0;

            document.getElementById('result').innerHTML = `
                <h3>採点結果</h3>
                <p>正答数：${correctQuestions} / ${totalQuestions} 問　|　得点：${score}%</p>
                <p>直近${history.length}回の平均：${avg}%</p>
                <ul>${details.join('')}</ul>
            `;
        }

        // ------------------------------------------------------------
        // 履歴リセット
        // ------------------------------------------------------------
        function resetHistory() {
            history = [];
            localStorage.setItem('spa_exercise_history_v1', JSON.stringify(history));
            document.getElementById('result').innerHTML = '<p>履歴をリセットしました。</p>';
        }

        // ------------------------------------------------------------
        // 初期表示
        // ------------------------------------------------------------
        window.addEventListener('load', generateQuiz);
    </script>
