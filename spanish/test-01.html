<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>直説法現在形 活用演習（不規則・規則動詞 全30種）</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            max-width: 1100px;
            margin: 28px auto;
            padding: 18px;
            background: #fbf8f0;
            color: #21313c;
            line-height: 1.6;
        }
        h1, h2, h3 {
            margin: 0.35em 0;
        }
        h1 {
            text-align: center;
            font-size: 1.9rem;
            border-bottom: 3px solid #b22234;
            display: inline-block;
            padding-bottom: 4px;
        }
        .title-block {
            text-align: center;
            margin-bottom: 18px;
        }
        .meta-box {
            background: #eef5ea;
            border-left: 8px solid #2c5f2d;
            padding: 12px 16px;
            border-radius: 18px;
            margin: 18px 0 24px;
            font-size: 0.96rem;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #fff4de;
            padding: 12px 16px;
            border-radius: 20px;
            margin-bottom: 22px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }
        button {
            background: #2c5f2d;
            color: #fff;
            border: none;
            padding: 9px 16px;
            border-radius: 28px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .15s ease, background .15s ease;
            font-size: 0.92rem;
        }
        button:hover {
            transform: scale(.98);
            background: #214521;
        }
        .secondary { background: #6c757d; }
        .danger { background: #b23c1c; }
        
        /* アクセントボタン用追加スタイル */
        .accent-bar {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #eadfc7;
            border-radius: 20px;
        }
        .accent-btn {
            background: #fff;
            color: #21313c;
            border: 1px solid #cdbb91;
            padding: 8px 16px;
            margin: 4px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }
        .accent-btn:hover {
            background: #f4f1e1;
            transform: none;
        }

        select {
            padding: 8px 12px;
            border-radius: 24px;
            border: 1px solid #cdbb91;
            background: #fff;
        }
        #timer-area {
            font-weight: 700;
            background: #ffe1b8;
            padding: 6px 12px;
            border-radius: 24px;
            color: #b23c1c;
            display: none;
        }
        .section {
            background: #fff;
            border: 1px solid #eadfc7;
            border-radius: 24px;
            padding: 18px 20px;
            margin-bottom: 28px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.04);
        }
        .section h3 {
            border-left: 6px solid #b22234;
            padding-left: 12px;
            margin-bottom: 14px;
            text-align: left;
            font-size: 1.3rem;
        }
        .jp-hint {
            display: inline-block;
            margin-left: 10px;
            font-size: 0.9rem;
            color: #005f6b;
            background: #e4f3f5;
            padding: 3px 10px;
            border-radius: 18px;
            font-weight: normal;
        }
        .answer-hint {
            display: none;
            margin-top: 10px;
            font-size: 0.95rem;
            color: #3d6b3d;
            background: #eef6ea;
            padding: 6px 12px;
            border-radius: 12px;
            text-align: center;
        }
        .audio-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            vertical-align: middle;
            color: #2c5f2d;
            padding: 0 4px;
            margin: 10px auto 0;
            display: block;
        }
        input.blank-input {
            width: 100%;
            padding: 8px 10px;
            font-size: 1.1rem;
            border: 1px solid #cfb87c;
            border-radius: 14px;
            background: #fffef9;
            text-align: center;
            vertical-align: middle;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        input.blank-input:focus {
            outline: none;
            border-color: #2c5f2d;
            box-shadow: 0 0 0 2px rgba(44, 95, 45, 0.18);
        }
        input.blank-input.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            box-shadow: 0 0 0 2px rgba(40, 167, 69, 0.25);
        }
        table.conj-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            table-layout: fixed;
        }
        .conj-table th, .conj-table td {
            border: 1px solid #d9ccb0;
            padding: 10px 8px;
            text-align: center;
            vertical-align: middle;
        }
        .conj-table th {
            background: #f6f1e6;
            font-weight: 700;
        }
        .conj-table td.person {
            background: #fff7ea;
            font-weight: 600;
            width: 18%;
        }
        .conj-table td.form {
            width: 32%;
        }
        #result {
            background: #f4f1e1;
            border-radius: 20px;
            padding: 14px 18px;
            margin-top: 18px;
        }
        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 0.82rem;
            color: #5e5e52;
        }
        @media (max-width: 760px) {
            .conj-table th { font-size: 0.85rem; }
            .conj-table td.person { width: auto; font-size: 0.85rem; }
            input.blank-input { font-size: 1rem; padding: 6px; }
        }
    </style>
</head>
<body>
    <div class="title-block">
        <h1>📘 直説法現在形 活用演習</h1>
        <p>不規則動詞・規則動詞（全30種）</p>
    </div>

    <div class="meta-box">
        🔹 全30個の動詞の現在形活用表を埋める問題です（3×2表形式）。<br>
        🔹 <strong>「問題生成」</strong>ボタンを押すと、30問がシャッフルされて出題されます。<br>
        🔹 正しい答えを入力すると、その場で空欄が<span style="color:#28a745;font-weight:700;">緑色</span>に変わります。<br>
        🔹 アクセント記号も厳密一致です。下の補助ボタンを使うと便利です。
    </div>

    <div class="accent-bar">
        <span style="font-size: 0.9rem; margin-right: 10px; color:#555;">アクセント補助:</span>
        <button type="button" tabindex="-1" onclick="insertChar('á')" class="accent-btn">á</button>
        <button type="button" tabindex="-1" onclick="insertChar('é')" class="accent-btn">é</button>
        <button type="button" tabindex="-1" onclick="insertChar('í')" class="accent-btn">í</button>
        <button type="button" tabindex="-1" onclick="insertChar('ó')" class="accent-btn">ó</button>
        <button type="button" tabindex="-1" onclick="insertChar('ú')" class="accent-btn">ú</button>
        <button type="button" tabindex="-1" onclick="insertChar('ñ')" class="accent-btn">ñ</button>
    </div>

    <div class="controls">
        <button onclick="generateQuiz()">✨ 問題生成 (シャッフル)</button>
        <button onclick="gradeQuiz()" class="secondary">📝 総合採点</button>
        <button onclick="toggleAnswers()" id="toggleBtn">🔎 答え表示</button>
        <button onclick="resetHistory()" class="danger">🗑 履歴リセット</button>
        <label for="timeLimit">⏱️ 制限時間:</label>
        <select id="timeLimit">
            <option value="0">制限なし</option>
            <option value="300">5分</option>
            <option value="600">10分</option>
            <option value="900">15分</option>
            <option value="1200">20分</option>
        </select>
        <div id="timer-area">⏳ 残り <span id="timeDisplay">--:--</span></div>
    </div>

    <form id="quizForm"></form>
    <div id="result"></div>
    <div class="footer">📗 アクセント記号も厳密一致です。正答で空欄が緑色に変わります。</div>

    <script>
        function strictCompare(userStr, answerStr) {
            if (!userStr || !answerStr) return false;
            return userStr.trim() === answerStr.trim();
        }

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function speakText(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 0.88;
            window.speechSynthesis.speak(utterance);
        }

        // アクセント入力補助のロジック
        let lastFocusedInput = null;
        document.addEventListener('focusin', (e) => {
            if (e.target.tagName === 'INPUT' && e.target.type === 'text') {
                lastFocusedInput = e.target;
            }
        });

        function insertChar(char) {
            if (lastFocusedInput) {
                const start = lastFocusedInput.selectionStart;
                const end = lastFocusedInput.selectionEnd;
                const val = lastFocusedInput.value;
                lastFocusedInput.value = val.substring(0, start) + char + val.substring(end);
                lastFocusedInput.selectionStart = lastFocusedInput.selectionEnd = start + 1;
                lastFocusedInput.focus();
                lastFocusedInput.dispatchEvent(new Event('input')); // 正誤判定トリガー
            }
        }

        let currentQuestions = [];
        let showAnswersFlag = false;
        let timerInterval = null;
        let timeLeft = 0;
        let scoreHistory = JSON.parse(localStorage.getItem('spanish_verbs_30_history') || '[]');

        // ========== 全30動詞データ ==========
        const verbsData = [
            // 語根母音変化動詞
            { infinitive: "pensar", jp: "考える (e→ie)", forms: ["pienso", "piensas", "piensa", "pensamos", "pensáis", "piensan"] },
            { infinitive: "querer", jp: "欲しい (e→ie)", forms: ["quiero", "quieres", "quiere", "queremos", "queréis", "quieren"] },
            { infinitive: "sentir", jp: "感じる (e→ie)", forms: ["siento", "sientes", "siente", "sentimos", "sentís", "sienten"] },
            { infinitive: "poder", jp: "できる (o→ue)", forms: ["puedo", "puedes", "puede", "podemos", "podéis", "pueden"] },
            { infinitive: "contar", jp: "語る (o→ue)", forms: ["cuento", "cuentas", "cuenta", "contamos", "contáis", "cuentan"] },
            { infinitive: "dormir", jp: "眠る (o→ue)", forms: ["duermo", "duermes", "duerme", "dormimos", "dormís", "duermen"] },
            { infinitive: "pedir", jp: "頼む (e→i)", forms: ["pido", "pides", "pide", "pedimos", "pedís", "piden"] },
            { infinitive: "repetir", jp: "くり返す (e→i)", forms: ["repito", "repites", "repite", "repetimos", "repetís", "repiten"] },
            { infinitive: "seguir", jp: "続ける (e→i)", forms: ["sigo", "sigues", "sigue", "seguimos", "seguís", "siguen"] },
            { infinitive: "jugar", jp: "遊ぶ (u→ue)", forms: ["juego", "juegas", "juega", "jugamos", "jugáis", "juegan"] },
            
            // 一人称単数形のみ不規則動詞
            { infinitive: "conocer", jp: "知る (-zc)", forms: ["conozco", "conoces", "conoce", "conocemos", "conocéis", "conocen"] },
            { infinitive: "producir", jp: "生産する (-zc)", forms: ["produzco", "produces", "produce", "producimos", "producís", "producen"] },
            { infinitive: "agradecer", jp: "感謝する (-zc)", forms: ["agradezco", "agradeces", "agradece", "agradecemos", "agradecéis", "agradecen"] },
            { infinitive: "salir", jp: "出る (-g)", forms: ["salgo", "sales", "sale", "salimos", "salís", "salen"] },
            { infinitive: "poner", jp: "置く (-g)", forms: ["pongo", "pones", "pone", "ponemos", "ponéis", "ponen"] },
            { infinitive: "hacer", jp: "する (-g)", forms: ["hago", "haces", "hace", "hacemos", "hacéis", "hacen"] },
            { infinitive: "caer", jp: "落ちる (-ig)", forms: ["caigo", "caes", "cae", "caemos", "caéis", "caen"] },
            { infinitive: "traer", jp: "持ってくる (-ig)", forms: ["traigo", "traes", "trae", "traemos", "traéis", "traen"] },
            { infinitive: "saber", jp: "知る (その他)", forms: ["sé", "sabes", "sabe", "sabemos", "sabéis", "saben"] },
            { infinitive: "ver", jp: "見る (その他)", forms: ["veo", "ves", "ve", "vemos", "veis", "ven"] },
            { infinitive: "dar", jp: "与える (その他)", forms: ["doy", "das", "da", "damos", "dais", "dan"] },
            
            // 複合型・その他の不規則動詞
            { infinitive: "tener", jp: "持つ", forms: ["tengo", "tienes", "tiene", "tenemos", "tenéis", "tienen"] },
            { infinitive: "venir", jp: "来る", forms: ["vengo", "vienes", "viene", "venimos", "venís", "vienen"] },
            { infinitive: "decir", jp: "言う", forms: ["digo", "dices", "dice", "decimos", "decís", "dicen"] },
            { infinitive: "ir", jp: "行く", forms: ["voy", "vas", "va", "vamos", "vais", "van"] },
            { infinitive: "oír", jp: "聞く", forms: ["oigo", "oyes", "oye", "oímos", "oís", "oyen"] },
            { infinitive: "construir", jp: "建設する", forms: ["construyo", "construyes", "construye", "construimos", "construís", "construyen"] },
            
            // 規則動詞 (追加)
            { infinitive: "hablar", jp: "話す (規則 -ar)", forms: ["hablo", "hablas", "habla", "hablamos", "habláis", "hablan"] },
            { infinitive: "vivir", jp: "住む / 生きる (規則 -ir)", forms: ["vivo", "vives", "vive", "vivimos", "vivís", "viven"] },
            { infinitive: "comer", jp: "食べる (規則 -er)", forms: ["como", "comes", "come", "comemos", "coméis", "comen"] }
        ];

        // ========== タイマー ==========
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            const limitSec = parseInt(document.getElementById('timeLimit').value, 10);
            const timerDiv = document.getElementById('timer-area');
            if (limitSec === 0) {
                timerDiv.style.display = 'none';
                return;
            }
            timeLeft = limitSec;
            timerDiv.style.display = 'block';
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (timeLeft <= 1) {
                    clearInterval(timerInterval);
                    timerDiv.style.display = 'none';
                    alert('⏰ 制限時間終了！自動採点します。');
                    gradeQuiz();
                } else {
                    timeLeft--;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timeDisplay').innerText = `${m}:${s.toString().padStart(2, '0')}`;
        }

        function toggleAnswers() {
            showAnswersFlag = !showAnswersFlag;
            document.querySelectorAll('.answer-hint').forEach(el => {
                el.style.display = showAnswersFlag ? 'block' : 'none';
            });
            document.getElementById('toggleBtn').innerText = showAnswersFlag ? '🔒 答え非表示' : '🔎 答え表示';
        }

        function resetHistory() {
            scoreHistory = [];
            localStorage.setItem('spanish_verbs_30_history', JSON.stringify(scoreHistory));
            document.getElementById('result').innerHTML = '<p>📊 スコア履歴をリセットしました。</p>';
        }

        // ========== リアルタイム正誤判定 ==========
        function checkSingleInput(inputEl, answerStr) {
            if (!inputEl || !answerStr) return;
            if (strictCompare(inputEl.value, answerStr)) {
                inputEl.classList.add('correct');
            } else {
                inputEl.classList.remove('correct');
            }
        }

        // ========== 問題ビルダ ==========
        function buildVerbTable(verbData, qIndex) {
            const forms = verbData.forms;
            const q = document.createElement('div');
            q.className = 'section';
            
            q.innerHTML = `<h3>第${qIndex + 1}問：${verbData.infinitive} <span class="jp-hint">📖 ${verbData.jp}</span></h3>`;

            const table = document.createElement('table');
            table.className = 'conj-table';
            table.innerHTML = `
            <thead><tr><th>人称</th><th>活用</th><th>人称</th><th>活用</th></tr></thead>
            <tbody>
              <tr>
                <td class="person">yo</td>
                <td class="form"><input class="blank-input" id="q${qIndex}_0" type="text" autocomplete="off"></td>
                <td class="person">nosotros /as</td>
                <td class="form"><input class="blank-input" id="q${qIndex}_3" type="text" autocomplete="off"></td>
              </tr>
              <tr>
                <td class="person">tú</td>
                <td class="form"><input class="blank-input" id="q${qIndex}_1" type="text" autocomplete="off"></td>
                <td class="person">vosotros /as</td>
                <td class="form"><input class="blank-input" id="q${qIndex}_4" type="text" autocomplete="off"></td>
              </tr>
              <tr>
                <td class="person">él / ella / usted</td>
                <td class="form"><input class="blank-input" id="q${qIndex}_2" type="text" autocomplete="off"></td>
                <td class="person">ellos / as / ustedes</td>
                <td class="form"><input class="blank-input" id="q${qIndex}_5" type="text" autocomplete="off"></td>
              </tr>
            </tbody>
            `;
            q.appendChild(table);

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'audio-btn';
            btn.textContent = '🔊';
            btn.title = "発音を聞く";
            btn.onclick = () => speakText(forms.join(' '));
            q.appendChild(btn);

            const hint = document.createElement('div');
            hint.className = 'answer-hint';
            hint.textContent = `正解: ${forms.join(' / ')}`;
            hint.style.display = showAnswersFlag ? 'block' : 'none';
            q.appendChild(hint);

            const ids = [`q${qIndex}_0`,`q${qIndex}_1`,`q${qIndex}_2`,`q${qIndex}_3`,`q${qIndex}_4`,`q${qIndex}_5`];
            
            // 遅延バインディングでイベント登録
            setTimeout(() => {
                ids.forEach((id, idx) => {
                    const inputEl = document.getElementById(id);
                    if (inputEl) inputEl.addEventListener('input', () => checkSingleInput(inputEl, forms[idx]));
                });
            }, 0);

            return { node: q, ids: ids, answers: forms, type: 'table', infinitive: verbData.infinitive, jp: verbData.jp };
        }

        // ========== メイン問題生成 ==========
        function generateQuiz() {
            if (timerInterval) clearInterval(timerInterval);
            currentQuestions = [];
            const form = document.getElementById('quizForm');
            form.innerHTML = '';
            document.getElementById('result').innerHTML = '';

            // 全30問をシャッフル
            const shuffledVerbs = shuffleArray(verbsData);

            shuffledVerbs.forEach((verb, idx) => {
                const built = buildVerbTable(verb, idx);
                form.appendChild(built.node);
                currentQuestions.push(built);
            });

            if (showAnswersFlag) {
                document.querySelectorAll('.answer-hint').forEach(el => el.style.display = 'block');
            }

            startTimer();
        }

        // ========== 総合採点 ==========
        function gradeQuiz() {
            if (timerInterval) clearInterval(timerInterval);
            let correctCount = 0;
            let totalCount = 0; // 全問題数 (30問)
            let html = '<h3>📋 採点結果</h3><ul style="list-style:none; padding-left:0;">';

            currentQuestions.forEach((q, idx) => {
                totalCount++;
                let ok = true;
                let userAnswers = [];
                let correctAnswers = [];

                for (let i = 0; i < q.ids.length; i++) {
                    const el = document.getElementById(q.ids[i]);
                    const userVal = el ? el.value : '';
                    userAnswers.push(userVal || '(空白)');
                    correctAnswers.push(q.answers[i]);
                    
                    if (!strictCompare(userVal, q.answers[i])) ok = false;
                    
                    if (el) {
                        if (strictCompare(userVal, q.answers[i])) el.classList.add('correct');
                        else el.classList.remove('correct');
                    }
                }

                if (ok) correctCount++;
                
                html += `<li style="margin-bottom:12px;">${ok ? '✅' : '❌'} <strong>Q${idx + 1}: ${q.infinitive}</strong><br>
                <span style="font-size:0.92rem;">
                入力: ${userAnswers.join(' / ')}<br>
                正解: <span style="color:#2c5f2d; font-weight:bold;">${correctAnswers.join(' / ')}</span>
                </span></li>`;
            });

            const percent = totalCount ? Math.round(correctCount / totalCount * 100) : 0;
            html += `</ul><p style="font-size:1.2rem; border-top:2px solid #d9ccb0; padding-top:10px;">🎯 ${correctCount} / ${totalCount} 問 正解 (${percent}%)</p>`;
            
            scoreHistory.push(percent);
            if (scoreHistory.length > 8) scoreHistory.shift();
            localStorage.setItem('spanish_verbs_30_history', JSON.stringify(scoreHistory));
            const avg = scoreHistory.length ? Math.round(scoreHistory.reduce((a, b) => a + b, 0) / scoreHistory.length) : 0;
            html += `<p>📈 直近${scoreHistory.length}回の平均点: ${avg}%</p>`;
            
            document.getElementById('result').innerHTML = html;
            window.scrollTo({ top: document.getElementById('result').offsetTop - 50, behavior: 'smooth' });
        }

        window.generateQuiz = generateQuiz;
        window.gradeQuiz = gradeQuiz;
        window.toggleAnswers = toggleAnswers;
        window.resetHistory = resetHistory;
        window.speakText = speakText;
        window.insertChar = insertChar;

        // 初回ロード時に自動生成
        window.onload = () => {
            generateQuiz();
        };
    </script>
</body>
</html>
