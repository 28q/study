<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>演習1-7 完全版：月・季節／時刻／天気／最上級／現在分詞（全動詞網羅）</title>
  <style>
    * { box-sizing: border-box; }
    body{
      font-family: 'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
      max-width: 1300px;
      margin: 28px auto;
      padding: 18px;
      background:#fbf8f0;
      color:#21313c;
      line-height:1.6;
    }
    h1,h2,h3{ margin:0.35em 0; }
    h1{
      text-align:center;
      font-size:1.9rem;
      border-bottom:3px solid #b22234;
      display:inline-block;
      padding-bottom:4px;
    }
    .title-block{ text-align:center; margin-bottom:18px; }
    .meta-box{
      background:#eef5ea;
      border-left:8px solid #2c5f2d;
      padding:12px 16px;
      border-radius:18px;
      margin:18px 0 24px;
      font-size:0.96rem;
    }
    .controls{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
      background:#fff4de;
      padding:12px 16px;
      border-radius:20px;
      margin-bottom:22px;
      box-shadow:0 2px 6px rgba(0,0,0,0.05);
    }
    button{
      background:#2c5f2d;
      color:#fff;
      border:none;
      padding:9px 16px;
      border-radius:28px;
      font-weight:700;
      cursor:pointer;
      transition:transform .15s ease, background .15s ease;
      font-size:0.92rem;
    }
    button:hover{ transform:scale(.98); background:#214521; }
    .secondary{ background:#6c757d; }
    .danger{ background:#b23c1c; }
    select{
      padding:8px 12px;
      border-radius:24px;
      border:1px solid #cdbb91;
      background:#fff;
    }
    #timer-area{
      font-weight:700;
      background:#ffe1b8;
      padding:6px 12px;
      border-radius:24px;
      color:#b23c1c;
      display:none;
    }
    .section{
      background:#fff;
      border:1px solid #eadfc7;
      border-radius:24px;
      padding:18px 20px;
      margin-bottom:28px;
      box-shadow:0 5px 15px rgba(0,0,0,0.04);
    }
    .section h3{
      border-left:6px solid #b22234;
      padding-left:12px;
      margin-bottom:14px;
      text-align:left;
    }
    .note{
      font-size:0.88rem;
      background:#f7f1df;
      padding:8px 12px;
      border-radius:18px;
      margin:8px 0 14px;
      display:inline-block;
    }
    .question{
      margin-bottom:22px;
      padding:12px;
      border-radius:18px;
      background:#fffdf7;
      border:1px solid #f1e7cf;
    }
    .question-text{
      font-size:1.02rem;
      font-weight:600;
      margin-bottom:8px;
      background:#f6f1e6;
      padding:9px 12px;
      border-radius:18px;
      display:inline-block;
    }
    .answer-hint{
      display:none;
      margin-left:10px;
      font-size:0.86rem;
      color:#3d6b3d;
      background:#eef6ea;
      padding:3px 9px;
      border-radius:18px;
    }
    .audio-btn{
      background:none;
      border:none;
      font-size:1.2rem;
      cursor:pointer;
      vertical-align:middle;
      color:#2c5f2d;
      padding:0 4px;
      margin-left:6px;
    }
    input.blank-input{
      width: clamp(80px, 15vw, 180px);
      min-width: 75px;
      padding: 8px 10px;
      font-size: 1rem;
      border: 1px solid #cfb87c;
      border-radius: 14px;
      background:#fffef9;
      text-align:center;
      margin: 2px 4px;
    }
    input.blank-input:focus{
      outline:none;
      border-color:#2c5f2d;
      box-shadow:0 0 0 2px rgba(44,95,45,0.18);
    }
    .sentence-line{
      line-height:2.1;
      font-size:1.02rem;
      margin-top:6px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }
    .word{
      display:inline-block;
      margin:0 2px;
      white-space:nowrap;
    }
    .grid-4x4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 16px;
    }
    .grid-item {
      background: #fef9ef;
      border: 1px solid #e2d5b6;
      border-radius: 20px;
      padding: 12px 8px;
      text-align: center;
    }
    .grid-item .jp-word {
      font-weight: bold;
      margin-bottom: 8px;
      color: #8b5a2b;
    }
    .grid-item input {
      width: 100%;
      max-width: 140px;
      margin: 0 auto;
    }
    #result{
      background:#f4f1e1;
      border-radius:20px;
      padding:14px 18px;
      margin-top:18px;
    }
    .footer{
      text-align:center;
      margin-top:28px;
      font-size:0.82rem;
      color:#5e5e52;
    }
    @media (max-width: 760px){
      .grid-4x4 { grid-template-columns: repeat(2, 1fr); }
      input.blank-input{ width: 88px; }
    }
  </style>
</head>
<body>
<div class="title-block">
  <h1>📘 演習 1-7 完全版</h1>
  <p>月・季節／時刻／天気（全語空欄）／最上級（de/del徹底）／現在分詞（全動詞・原形なし）</p>
</div>

<div class="meta-box">
  🔹 <strong>月と季節</strong>：全16語を4×4グリッドでランダム出題<br>
  🔹 <strong>時刻の表現</strong>：<br>
  🔹 <strong>天気・天候</strong>：<br>
  🔹 <strong>最上級</strong>：<br>
  🔹 <strong>現在分詞</strong>：<br>
  &nbsp;&nbsp;
</div>

<div class="controls">
  <button onclick="generateQuiz()">✨ 問題生成 (ランダム順)</button>
  <button onclick="gradeQuiz()" class="secondary">📝 採点</button>
  <button onclick="toggleAnswers()" id="toggleBtn">🔎 答え表示</button>
  <button onclick="resetHistory()" class="danger">🗑 履歴リセット</button>
  <label for="timeLimit">⏱️ 制限時間:</label>
  <select id="timeLimit">
    <option value="0">制限なし</option>
    <option value="180">3分</option>
    <option value="300">5分</option>
    <option value="480">8分</option>
  </select>
  <div id="timer-area">⏳ 残り <span id="timeDisplay">--:--</span></div>
</div>

<form id="quizForm"></form>
<div id="result"></div>
<div class="footer">📗 アクセント記号なしでも正答扱い（正規化対応）。現在分詞+代名詞はまとめて入力（例: leyéndolo, duchándose）。</div>

<script>
  // ---------- 正規化 ----------
  function normalize(str){
    if(!str) return '';
    return str.toLowerCase().trim()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/\s+/g,' ')
      .replace(/[¿?¡!.,;:]/g,'');
  }

  function shuffleArray(arr){
    const a = [...arr];
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function speakText(text){
    if(!text) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'es-ES';
    utterance.rate = 0.88;
    window.speechSynthesis.speak(utterance);
  }

  let currentQuestions = [];
  let showAnswersFlag = false;
  let timerInterval = null;
  let timeLeft = 0;
  let scoreHistory = JSON.parse(localStorage.getItem('spanish_exam_final') || '[]');

  // ---------- 1. 月と季節 (全16, 4x4グリッド) ----------
  const monthsSeasonsAll = [
    { jp: "1月", es: "enero" }, { jp: "2月", es: "febrero" }, { jp: "3月", es: "marzo" }, { jp: "4月", es: "abril" },
    { jp: "5月", es: "mayo" }, { jp: "6月", es: "junio" }, { jp: "7月", es: "julio" }, { jp: "8月", es: "agosto" },
    { jp: "9月", es: "septiembre" }, { jp: "10月", es: "octubre" }, { jp: "11月", es: "noviembre" }, { jp: "12月", es: "diciembre" },
    { jp: "春", es: "primavera" }, { jp: "夏", es: "verano" }, { jp: "秋", es: "otoño" }, { jp: "冬", es: "invierno" }
  ];

  function buildMonthsGrid() {
    const shuffled = shuffleArray([...monthsSeasonsAll]);
    const gridDiv = document.createElement('div');
    gridDiv.className = 'grid-4x4';
    const ids = [];
    const answers = [];
    shuffled.forEach((item, idx) => {
      const gridItem = document.createElement('div');
      gridItem.className = 'grid-item';
      const jpSpan = document.createElement('div');
      jpSpan.className = 'jp-word';
      jpSpan.textContent = item.jp;
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'blank-input';
      const inpId = `month_${idx}`;
      input.id = inpId;
      input.placeholder = "スペイン語";
      gridItem.appendChild(jpSpan);
      gridItem.appendChild(input);
      gridDiv.appendChild(gridItem);
      ids.push(inpId);
      answers.push(item.es);
    });
    const wrapper = document.createElement('div');
    wrapper.appendChild(gridDiv);
    return { html: wrapper.innerHTML, ids, answers };
  }

  // ---------- 2. 時刻表現 (変更なし) ----------
  const timeQuestionParts = { parts: ["¿", "Qué", "hora", "es", "?"], jp: "何時ですか？", answer: ["¿", "Qué", "hora", "es"] };
  const aQueHoraParts = { parts: ["¿", "A", "qué", "hora", "llegas", "a", "casa", "normalmente", "?"], jp: "君はふだん何時に家に着くの？", answer: ["A", "qué", "hora"] };
  const timeExpressions = [
    { jp: "3時10分です。", es: "Son las tres y diez." },
    { jp: "3時10分前です。", es: "Son las tres menos diez." },
    { jp: "1時30分です。", es: "Es la una y media." },
    { jp: "4時15分です。", es: "Son las cuatro y cuarto." },
    { jp: "6時15分前です (朝)。", es: "Son las seis menos cuarto de la mañana." },
    { jp: "5時ちょうどです。", es: "Son las cinco en punto." }
  ];

  function inlineToQuestion(item, baseId) {
    const parts = item.parts;
    const answerWords = item.answer;
    const ids = [];
    const container = document.createElement('div');
    container.className = 'sentence-line';
    let answerIdx = 0;
    const ansNorm = answerWords.map(w => normalize(w));
    const finalAnswers = [];
    parts.forEach((part) => {
      const partNorm = normalize(part);
      if(answerIdx < ansNorm.length && partNorm === ansNorm[answerIdx]){
        const inpId = `${baseId}_b${ids.length}`;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'blank-input';
        input.id = inpId;
        input.placeholder = '□';
        container.appendChild(input);
        ids.push(inpId);
        finalAnswers.push(answerWords[answerIdx]);
        answerIdx++;
      } else {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = part + ' ';
        container.appendChild(span);
      }
    });
    const tempDiv = document.createElement('div');
    tempDiv.appendChild(container);
    return { html: tempDiv.innerHTML, ids, answers: finalAnswers };
  }

  function buildTimeQuestions() {
    const questions = [];
    const q1 = inlineToQuestion(timeQuestionParts, 'time_q1');
    const q2 = inlineToQuestion(aQueHoraParts, 'time_q2');
    const timeEx = shuffleArray(timeExpressions).slice(0, 2);
    questions.push({ type: 'inline', html: `<div class="question-text">⏰ ${timeQuestionParts.jp}</div>${q1.html}`, ids: q1.ids, answers: q1.answers });
    questions.push({ type: 'inline', html: `<div class="question-text">⏰ ${aQueHoraParts.jp}</div>${q2.html}`, ids: q2.ids, answers: q2.answers });
    timeEx.forEach((te, idx) => {
      const qId = `time_ex_${idx}`;
      questions.push({
        type: 'simple',
        html: `<div class="question-text">⏲️ ${te.jp}</div><div class="sentence-line"><input class="blank-input" id="${qId}" type="text" placeholder="スペイン語文"></div>`,
        ids: [qId],
        answers: [te.es]
      });
    });
    return questions;
  }

  // ---------- 3. 天気・天候 (名詞・形容詞も全て空欄) ----------
  const weatherAllBlank = [
    { jp: "暑いです。", template: "__ __.", blanks: ["Hace", "calor"] },
    { jp: "寒いです。", template: "__ __.", blanks: ["Hace", "frío"] },
    { jp: "とても暑いです。", template: "__ __ __.", blanks: ["Hace", "mucho", "calor"] },
    { jp: "とても寒いです。", template: "__ __ __.", blanks: ["Hace", "mucho", "frío"] },
    { jp: "風が吹いています。", template: "__ __.", blanks: ["Hace", "viento"] },
    { jp: "晴れています (hacer)。", template: "__ __.", blanks: ["Hace", "sol"] },
    { jp: "良い天気です。", template: "__ __ __.", blanks: ["Hace", "buen", "tiempo"] },
    { jp: "悪い天気です。", template: "__ __ __.", blanks: ["Hace", "mal", "tiempo"] },
    { jp: "晴れています (estar)。", template: "__ __.", blanks: ["Está", "despejado"] },
    { jp: "曇っています。", template: "__ __.", blanks: ["Está", "nublado"] },
    { jp: "雨が降っています。", template: "______.", blanks: ["Llueve"] },
    { jp: "雪が降っています。", template: "______.", blanks: ["Nieva"] }
  ];

  function buildWeatherQuestions() {
    // 全問出題 (ランダム順)
    const shuffled = shuffleArray([...weatherAllBlank]);
    return shuffled.map((item, idx) => {
      const template = item.template;
      const blanks = item.blanks;
      const ids = [];
      let finalHtml = `<div class="question-text">☀️ ${item.jp}</div><div class="sentence-line">`;
      let parts = template.split(/(__+)/);
      let blankIdx = 0;
      parts.forEach(part => {
        if(part.match(/__+/)){
          const inpId = `weather_${idx}_b${blankIdx}`;
          finalHtml += `<input class="blank-input" id="${inpId}" type="text" placeholder="□">`;
          ids.push(inpId);
          blankIdx++;
        } else {
          finalHtml += `<span class="word">${part}</span>`;
        }
      });
      finalHtml += `</div>`;
      return { html: finalHtml, ids, answers: blanks };
    });
  }

  // ---------- 4. 最上級 (全ての例文で de/del を空欄に) ----------
  const superlativeAllDe = [
    { jp: "世界でもっとも長い川はどれですか？", template: "¿Cuál es __ río __ __ __ mundo?", blanks: ["el", "más", "largo", "del"] },
    { jp: "富士山は日本でもっとも高い山だ。", template: "El monte Fuji es __ __ __ __ Japón.", blanks: ["el", "más", "alto", "de"] },
    { jp: "サラはクラスでもっともまじめな女性だ。", template: "Sara es __ __ __ __ __ clase.", blanks: ["la", "más", "seria", "de", "la"] },
    { jp: "フェルナンドはチームでもっともよい選手だ。", template: "Fernando es __ __ jugador __ __ equipo.", blanks: ["el", "mejor", "del"] },
    { jp: "この大学は国内でもっとも古い。", template: "Esta universidad es __ __ antigua __ país.", blanks: ["la", "más", "del"] },
    { jp: "こちらは大阪でもっとも高いビルです。", template: "Este es __ edificio __ alto __ Osaka.", blanks: ["el", "más", "de"] },
    { jp: "この町でもっともよいレストランがこの近くにある。", template: "__ __ restaurante __ este pueblo está cerca de aquí.", blanks: ["El", "mejor", "de"] }
  ];

  function buildSuperlativeQuestions() {
    const shuffled = shuffleArray([...superlativeAllDe]);
    return shuffled.map((item, idx) => {
      const template = item.template;
      const blanks = item.blanks;
      let finalHtml = `<div class="question-text">🏆 ${item.jp}</div><div class="sentence-line">`;
      let parts = template.split(/(__+)/);
      let blankIdx = 0;
      const ids = [];
      parts.forEach(part => {
        if(part.match(/__+/)){
          const inpId = `sup_${idx}_b${blankIdx}`;
          finalHtml += `<input class="blank-input" id="${inpId}" type="text" placeholder="□">`;
          ids.push(inpId);
          blankIdx++;
        } else {
          finalHtml += `<span class="word">${part}</span>`;
        }
      });
      finalHtml += `</div>`;
      return { html: finalHtml, ids, answers: blanks };
    });
  }

  // ---------- 5. 現在分詞 (プリント内の全動詞 + 進行形/代名詞接続の練習) ----------
  // 5-1: 全動詞の現在分詞（原形を表示せず、日本語の意味のみ）
  const allVerbsParticiple = [
    { jp: "話しながら", answer: "hablando" },
    { jp: "食べながら", answer: "comiendo" },
    { jp: "生きながら", answer: "viviendo" },
    { jp: "読んでいるところ", answer: "leyendo" },
    { jp: "頼みながら", answer: "pidiendo" },
    { jp: "眠りながら", answer: "durmiendo" },
    { jp: "聞いている", answer: "oyendo" },
    { jp: "言いながら", answer: "diciendo" },
    { jp: "行きながら", answer: "yendo" },
    { jp: "来ながら", answer: "viniendo" },
    { jp: "飲みながら", answer: "bebiendo" },
    { jp: "旅行しながら", answer: "viajando" },
    { jp: "戻りながら", answer: "volviendo" },
    { jp: "考えながら", answer: "pensando" },
    { jp: "勉強している", answer: "estudiando" },
    { jp: "聴きながら", answer: "escuchando" },
    { jp: "シャワーを浴びている", answer: "duchándose" }
  ];

  // 5-2: 進行形 (estar + 現在分詞, estarも空欄) および 代名詞付き (アクセント付き) の練習
  const additionalParticipleExercises = [
    { jp: "私の兄は部屋で勉強している。", template: "Mi hermano __ __ en su habitación.", blanks: ["está", "estudiando"] },
    { jp: "私は音楽を聴きながら勉強する。", template: "Estudio __ música.", blanks: ["escuchando"] },
    { jp: "彼女は今、昼食を食べている。", template: "Ella __ __ ahora.", blanks: ["está", "comiendo"] },
    { jp: "私はそれを読んでいるところだ。", template: "Estoy ______.", blanks: ["leyéndolo"] },
    { jp: "先生は彼らに本当のことを言っている。", template: "La maestra está ______ la verdad.", blanks: ["diciéndoles"] },
    { jp: "ピラールはシャワーを浴びている。", template: "Pilar está ______.", blanks: ["duchándose"] }
  ];

  function buildParticipleQuestions() {
    // 全動詞の現在分詞問題（ランダム順）
    const verbItems = shuffleArray([...allVerbsParticiple]).map((item, idx) => {
      const qId = `part_verb_${idx}`;
      return {
        html: `<div class="question-text">📝 ${item.jp}</div><div class="sentence-line"><input class="blank-input" id="${qId}" type="text" placeholder="現在分詞"></div>`,
        ids: [qId],
        answers: [item.answer]
      };
    });
    // 追加練習問題（ランダム順）
    const extraItems = shuffleArray([...additionalParticipleExercises]).map((item, idx) => {
      const template = item.template;
      const blanks = item.blanks;
      let finalHtml = `<div class="question-text">✍️ ${item.jp}</div><div class="sentence-line">`;
      let parts = template.split(/(__+)/);
      let blankIdx = 0;
      const ids = [];
      parts.forEach(part => {
        if(part.match(/__+/)){
          const inpId = `part_extra_${idx}_b${blankIdx}`;
          finalHtml += `<input class="blank-input" id="${inpId}" type="text" placeholder="□">`;
          ids.push(inpId);
          blankIdx++;
        } else {
          finalHtml += `<span class="word">${part}</span>`;
        }
      });
      finalHtml += `</div>`;
      return { html: finalHtml, ids, answers: blanks };
    });
    // 結合して全体をランダム順に
    const allItems = shuffleArray([...verbItems, ...extraItems]);
    return allItems;
  }

  // ------------------- メイン生成 -------------------
  function generateQuiz(){
    if(timerInterval) clearInterval(timerInterval);
    currentQuestions = [];
    const form = document.getElementById('quizForm');
    form.innerHTML = '';
    document.getElementById('result').innerHTML = '';

    // セクション1: 月と季節 (4x4)
    const sec1 = document.createElement('div');
    sec1.className = 'section';
    sec1.innerHTML = `<h3>1. 月と季節 🌙🌸 (4×4 グリッド)</h3><div class="note">各日本語に対応するスペイン語を入力してください。</div>`;
    const gridData = buildMonthsGrid();
    sec1.innerHTML += gridData.html;
    form.appendChild(sec1);
    currentQuestions.push({ ids: gridData.ids, answers: gridData.answers, type: 'grid' });
    const gridHint = document.createElement('div');
    gridHint.className = 'answer-hint';
    gridHint.textContent = `→ 正解: ${gridData.answers.join(', ')}`;
    sec1.appendChild(gridHint);

    // セクション2: 時刻
    const sec2 = document.createElement('div');
    sec2.className = 'section';
    sec2.innerHTML = `<h3>2. 時刻の表現 ⏰</h3><div class="note">¿Qué hora es? / A qué hora の空欄、および時刻文を完成させてください。</div>`;
    const timeQs = buildTimeQuestions();
    timeQs.forEach(q => {
      const qDiv = document.createElement('div');
      qDiv.className = 'question';
      qDiv.innerHTML = q.html;
      sec2.appendChild(qDiv);
      currentQuestions.push({ ids: q.ids, answers: q.answers });
      const hintSpan = document.createElement('span');
      hintSpan.className = 'answer-hint';
      hintSpan.textContent = `→ ${q.answers.join(' ')}`;
      qDiv.appendChild(hintSpan);
    });
    form.appendChild(sec2);

    // セクション3: 天気 (全語空欄)
    const sec3 = document.createElement('div');
    sec3.className = 'section';
    sec3.innerHTML = `<h3>3. 天気・天候 🌦️ (名詞・形容詞も全て空欄)</h3><div class="note">hacer/estar、名詞・形容詞、全ての単語を埋めてください。</div>`;
    const weatherQs = buildWeatherQuestions();
    weatherQs.forEach(q => {
      const qDiv = document.createElement('div');
      qDiv.className = 'question';
      qDiv.innerHTML = q.html;
      sec3.appendChild(qDiv);
      currentQuestions.push({ ids: q.ids, answers: q.answers });
      const hintSpan = document.createElement('span');
      hintSpan.className = 'answer-hint';
      hintSpan.textContent = `→ ${q.answers.join(' ')}`;
      qDiv.appendChild(hintSpan);
    });
    form.appendChild(sec3);

    // セクション4: 最上級 (de/del 徹底)
    const sec4 = document.createElement('div');
    sec4.className = 'section';
    sec4.innerHTML = `<h3>4. 最上級 (形容詞) 🥇 (de/del も全て空欄)</h3><div class="note">冠詞・más/mejor・de/del などを補ってください。</div>`;
    const supQs = buildSuperlativeQuestions();
    supQs.forEach(q => {
      const qDiv = document.createElement('div');
      qDiv.className = 'question';
      qDiv.innerHTML = q.html;
      sec4.appendChild(qDiv);
      currentQuestions.push({ ids: q.ids, answers: q.answers });
      const hintSpan = document.createElement('span');
      hintSpan.className = 'answer-hint';
      hintSpan.textContent = `→ ${q.answers.join(' ')}`;
      qDiv.appendChild(hintSpan);
    });
    form.appendChild(sec4);

    // セクション5: 現在分詞 (全動詞網羅 + 進行形/代名詞接続)
    const sec5 = document.createElement('div');
    sec5.className = 'section';
    sec5.innerHTML = `<h3>5. 現在分詞 (プリント内の全動詞・原形なし) ✍️</h3><div class="note">「話しながら」などの日本語から現在分詞を入力。さらにestar+分詞（estarも空欄）・代名詞付き（アクセント可）の練習も含む。</div>`;
    const partQs = buildParticipleQuestions();
    partQs.forEach(q => {
      const qDiv = document.createElement('div');
      qDiv.className = 'question';
      qDiv.innerHTML = q.html;
      sec5.appendChild(qDiv);
      currentQuestions.push({ ids: q.ids, answers: q.answers });
      const hintSpan = document.createElement('span');
      hintSpan.className = 'answer-hint';
      hintSpan.textContent = `→ ${q.answers.join(' ')}`;
      qDiv.appendChild(hintSpan);
    });
    form.appendChild(sec5);

    if(showAnswersFlag){
      document.querySelectorAll('.answer-hint').forEach(el => el.style.display = 'inline');
    }
    startTimer();
  }

  // タイマー・採点 (前回と同様)
  function startTimer(){
    if(timerInterval) clearInterval(timerInterval);
    const limitSec = parseInt(document.getElementById('timeLimit').value, 10);
    const timerDiv = document.getElementById('timer-area');
    if(limitSec === 0){
      timerDiv.style.display = 'none';
      return;
    }
    timeLeft = limitSec;
    timerDiv.style.display = 'block';
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      if(timeLeft <= 1){
        clearInterval(timerInterval);
        timerDiv.style.display = 'none';
        alert('⏰ 制限時間終了！自動採点します。');
        gradeQuiz();
      }else{
        timeLeft--;
        updateTimerDisplay();
      }
    }, 1000);
  }

  function updateTimerDisplay(){
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    document.getElementById('timeDisplay').innerText = `${m}:${s.toString().padStart(2,'0')}`;
  }

  function toggleAnswers(){
    showAnswersFlag = !showAnswersFlag;
    document.querySelectorAll('.answer-hint').forEach(el => {
      el.style.display = showAnswersFlag ? 'inline' : 'none';
    });
    document.getElementById('toggleBtn').innerText = showAnswersFlag ? '🔒 答え非表示' : '🔎 答え表示';
  }

  function resetHistory(){
    scoreHistory = [];
    localStorage.setItem('spanish_exam_final', JSON.stringify(scoreHistory));
    document.getElementById('result').innerHTML = '<p>📊 スコア履歴をリセットしました。</p>';
  }

  function gradeQuiz(){
    if(timerInterval) clearInterval(timerInterval);
    let correctCount = 0;
    let totalCount = 0;
    let html = '<h3>📋 採点結果</h3><ul style="list-style:none; padding-left:0;">';
    currentQuestions.forEach((q, idx) => {
      totalCount++;
      let ok = true;
      const userAnswers = [];
      for(let i=0;i<q.ids.length;i++){
        const el = document.getElementById(q.ids[i]);
        const user = el ? el.value : '';
        userAnswers.push(user);
        if(normalize(user) !== normalize(q.answers[i])) ok = false;
      }
      if(ok) correctCount++;
      html += `<li>${ok ? '✅' : '❌'} <strong>問${idx + 1}</strong><br>
        <span style="font-size:0.92rem;">入力: ${userAnswers.join(' / ') || '(空白)'}<br>
        正解: ${q.answers.join(' / ')}</span></li><br>`;
    });
    const percent = totalCount ? Math.round(correctCount / totalCount * 100) : 0;
    html += `</ul><p style="font-size:1.2rem;">🎯 ${correctCount} / ${totalCount} 正解 (${percent}%)</p>`;
    scoreHistory.push(percent);
    if(scoreHistory.length > 8) scoreHistory.shift();
    localStorage.setItem('spanish_exam_final', JSON.stringify(scoreHistory));
    const avg = scoreHistory.length ? Math.round(scoreHistory.reduce((a,b) => a + b, 0) / scoreHistory.length) : 0;
    html += `<p>📈 直近${scoreHistory.length}回の平均点: ${avg}%</p>`;
    document.getElementById('result').innerHTML = html;
  }

  window.generateQuiz = generateQuiz;
  window.gradeQuiz = gradeQuiz;
  window.toggleAnswers = toggleAnswers;
  window.resetHistory = resetHistory;
  window.speakText = speakText;
  window.onload = () => { generateQuiz(); };
</script>
</body>
</html>
