<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>語彙テスト：個人情報・心や身体の状態・授業に関する語彙 (スペイン語 → 日本語)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f7fa;
            line-height: 1.8;
        }
        h1 { text-align: center; color: #333; }
        .controls { text-align: center; margin-bottom: 20px; }

        button.main-btn {
            padding: 12px 24px;
            font-size: 16px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button.main-btn:hover {
            background-color: #45a049;
        }

        button.grade-btn {
            background-color: #1976D2;
        }

        button.grade-btn:hover {
            background-color: #1565C0;
        }

        .show-opt-btn {
            background-color: #00897B;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 5px;
            transition: background-color 0.2s;
        }

        .show-opt-btn:hover {
            background-color: #00695C;
        }

        .quiz-container {
            max-width: 800px;
            margin: auto;
        }

        .question {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-left: 5px solid #2196F3;
        }

        .question-word {
            font-size: 20px;
            font-weight: bold;
            color: #1976D2;
            margin-bottom: 5px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .radio-label {
            display: block;
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .radio-label:hover {
            background-color: #e3f2fd;
            border-color: #2196F3;
        }

        input[type="radio"] {
            margin-right: 10px;
            transform: scale(1.2);
            cursor: pointer;
        }

        .result-msg {
            font-weight: bold;
            margin-top: 10px;
            display: inline-block;
        }

        .correct {
            color: #2e7d32;
        }

        .incorrect {
            color: #c62828;
        }

        .note {
            text-align: center;
            font-size: 0.95em;
            color: #555;
            margin-bottom: 25px;
            background: #fff3e0;
            padding: 10px;
            border-radius: 8px;
        }

        #score-display {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #1976D2;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

<h1>
    語彙テスト：個人情報・心や身体の状態・授業に関する語彙<br>
    <span style="font-size:0.7em;">(スペイン語 → 日本語)</span>
</h1>

<div class="note">
    ※ スペイン語を見て、まずは意味を思い浮かべてから「選択肢を表示」を押しましょう。<br>
    ※ 該当範囲の全単語からランダムに出題されます。
</div>

<div class="controls">
    <button class="main-btn" onclick="generateQuiz()">シャッフルして再出題</button>
    <button class="main-btn grade-btn" onclick="checkAnswers()">採点する</button>
</div>

<div id="score-display"></div>
<div class="quiz-container" id="quiz"></div>

<div class="controls" style="margin-top:30px;">
    <button class="main-btn grade-btn" onclick="checkAnswers()">採点する</button>
</div>

<script>
/* 語彙データ */
const vocabList = [

    // 心や身体の状態
    { sp: "contento", jp: "うれしい" },
    { sp: "enfadado", jp: "怒っている" },
    { sp: "enojado", jp: "怒っている" },
    { sp: "nervioso", jp: "緊張している" },
    { sp: "triste", jp: "悲しんだ" },
    { sp: "bien", jp: "元気で" },
    { sp: "mal", jp: "体調が悪く" },
    { sp: "cansado", jp: "疲れた" },

    // 個人情報
    { sp: "nombre", jp: "名前" },
    { sp: "apellido", jp: "名字" },
    { sp: "dirección", jp: "住所" },
    { sp: "código postal", jp: "郵便番号" },
    { sp: "número de teléfono", jp: "電話番号" },
    { sp: "prefijo", jp: "市外局番、国番号" },
    { sp: "extensión", jp: "内線" },
    { sp: "lugar de nacimiento", jp: "出生地" },
    { sp: "fecha de nacimiento", jp: "生年月日" },

    // 授業中に使える表現
    { sp: "Más despacio, por favor", jp: "もっとゆっくり話してください" },
    { sp: "Otra vez, por favor", jp: "もう一回言ってください" },
    { sp: "¿Cómo se dice ... en español?", jp: "スペイン語では…をどう言いますか？" },
    { sp: "¿Cómo se escribe...?", jp: "…はどう綴りますか？" },
    { sp: "¿Cómo se pronuncia...?", jp: "…はどう発音しますか？" },

    // 授業に関する語彙
    { sp: "ejercicio", jp: "練習" },
    { sp: "lección", jp: "課" },
    { sp: "página", jp: "ページ" },
    { sp: "pregunta", jp: "質問" },
    { sp: "respuesta", jp: "答え" },
    { sp: "profesor", jp: "先生" },
    { sp: "profesora", jp: "先生" },
    { sp: "compañero", jp: "仲間" },
    { sp: "compañera", jp: "仲間" },
    { sp: "en parejas", jp: "ペアで" },
    { sp: "en grupos", jp: "グループで" },
    { sp: "deberes", jp: "宿題" },

    // 学習に使う用具
    { sp: "internet", jp: "インターネット" },
    { sp: "libro", jp: "本" },
    { sp: "papel", jp: "紙" },
    { sp: "bolígrafo", jp: "ボールペン" },
    { sp: "lápiz", jp: "鉛筆" },
    { sp: "goma", jp: "消しゴム" },
    { sp: "fotocopia", jp: "コピー" },
    { sp: "pizarra", jp: "黒板" },
    { sp: "tiza", jp: "チョーク" },
    { sp: "rotulador", jp: "マーカー" },
    { sp: "ordenador", jp: "コンピューター" },
    { sp: "computador", jp: "コンピューター" },
    { sp: "cuaderno", jp: "ノート" },
    { sp: "hoja", jp: "シート" },
    { sp: "regla", jp: "定規" },
    { sp: "impresora", jp: "プリンター" },
    { sp: "fotocopiadora", jp: "コピー機" },
    { sp: "diccionario", jp: "辞書" },
    { sp: "diccionario electrónico", jp: "電子辞書" }
];

const uniqueJpList = [...new Set(vocabList.map(item => item.jp))];
let currentQuizSet = [];

function shuffle(array) {
    const result = [...array];
    for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
}

function getOptions(correctJp) {
    let dummies = uniqueJpList.filter(jp => jp !== correctJp);
    dummies = shuffle(dummies).slice(0, 3);
    return shuffle([correctJp, ...dummies]);
}

function generateQuiz() {
    const quizContainer = document.getElementById("quiz");
    quizContainer.innerHTML = "";
    document.getElementById("score-display").style.display = "none";

    currentQuizSet = shuffle(vocabList);

    currentQuizSet.forEach((item, index) => {
        let options = getOptions(item.jp);

        let optionsHtml = options.map(opt => `
            <label class="radio-label">
                <input type="radio" name="q${index}" value="${opt}">
                ${opt}
            </label>
        `).join("");

        quizContainer.innerHTML += `
            <div class="question" id="questionBox-${index}">
                <div class="question-word">
                    問 ${index + 1}. &nbsp;&nbsp; ${item.sp}
                </div>

                <button type="button"
                        class="show-opt-btn"
                        onclick="document.getElementById('options-${index}').style.display='grid'; this.style.display='none';">
                    選択肢を表示
                </button>

                <div class="options-grid" id="options-${index}" style="display:none;">
                    ${optionsHtml}
                </div>

                <div class="result-msg" id="result-${index}"></div>
            </div>
        `;
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function checkAnswers() {

    let score = 0;

    currentQuizSet.forEach((item, index) => {

        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const resultMsg = document.getElementById(`result-${index}`);
        const questionBox = document.getElementById(`questionBox-${index}`);
        const optionsDiv = document.getElementById(`options-${index}`);
        const showBtn = questionBox.querySelector('.show-opt-btn');

        if (optionsDiv.style.display === 'none') {
            optionsDiv.style.display = 'grid';
            showBtn.style.display = 'none';
        }

        if (!selected) {
            resultMsg.innerHTML = `❌ 未解答（正答: ${item.jp}）`;
            resultMsg.className = "result-msg incorrect";
            questionBox.style.borderLeftColor = "#c62828";
            questionBox.style.backgroundColor = "#ffebee";
            return;
        }

        if (selected.value === item.jp) {

            score++;

            resultMsg.innerHTML = "⭕ 正解";
            resultMsg.className = "result-msg correct";

            questionBox.style.borderLeftColor = "#2e7d32";
            questionBox.style.backgroundColor = "#e8f5e9";

        } else {

            resultMsg.innerHTML = `❌ 不正解（正答: ${item.jp}）`;
            resultMsg.className = "result-msg incorrect";

            questionBox.style.borderLeftColor = "#c62828";
            questionBox.style.backgroundColor = "#ffebee";
        }
    });

    const scoreDisplay = document.getElementById("score-display");

    scoreDisplay.innerHTML =
        `採点結果: ${score} / ${currentQuizSet.length} 点`;

    scoreDisplay.style.display = "block";

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

generateQuiz();
</script>

</body>
</html>
