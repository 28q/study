<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>演習2-7：不規則動詞現在形活用テスト（全動詞シャッフル・正誤色分け改善版）</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            max-width: 1300px;
            margin: 20px auto;
            padding: 20px;
            background: #fefaf5;
            color: #1e2a2e;
        }

        h1 {
            text-align: center;
            font-size: 1.9rem;
            border-bottom: 3px solid #b22234;
            display: inline-block;
            padding-bottom: 6px;
            margin-bottom: 20px;
        }

        .title-block {
            text-align: center;
            margin-bottom: 20px;
        }

        .sub {
            text-align: center;
            color: #4a5b5e;
            margin-top: -10px;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .global-controls {
            background: #fff2e0;
            padding: 12px 20px;
            border-radius: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        button {
            background: #2c5f2d;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.1s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        button:hover {
            background: #1f4520;
            transform: scale(0.97);
        }

        .secondary-btn {
            background: #6c757d;
        }

        .secondary-btn:hover {
            background: #565e64;
        }

        .danger-btn {
            background: #b23c1c;
        }

        .danger-btn:hover {
            background: #8e2e12;
        }

        .verb-grid {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .verb-card {
            background: white;
            border-radius: 28px;
            border: 1px solid #eedfcb;
            padding: 20px 24px;
            transition: box-shadow 0.1s;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.03);
        }

        .verb-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 16px;
            border-left: 6px solid #b22234;
            padding-left: 16px;
        }

        .verb-name {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #2c3e2f;
        }

        .verb-type {
            font-size: 0.85rem;
            background: #e9ecef;
            padding: 4px 12px;
            border-radius: 40px;
            color: #4a5b5e;
        }

        .conj-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0 18px;
            background: #fffdf9;
        }

        .conj-table th, .conj-table td {
            border: 1px solid #e2d5c0;
            padding: 12px 8px;
            text-align: center;
            vertical-align: middle;
        }

        .conj-table th {
            background: #f6f0e4;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .person-cell {
            background: #fff7ef;
            font-weight: 600;
            width: 22%;
        }

        .input-cell {
            width: 28%;
        }

        .blank-input {
            width: 95%;
            padding: 10px 6px;
            font-size: 1rem;
            text-align: center;
            border: 1px solid #cfb87c;
            border-radius: 18px;
            background: white;
            transition: 0.1s;
            font-family: monospace;
        }

        .blank-input:focus {
            outline: none;
            border-color: #2c5f2d;
            box-shadow: 0 0 0 2px rgba(44,95,45,0.2);
        }

        /* 正誤の色 (明確に視認できるように) */
        .correct-input {
            background-color: #c8e6d9 !important;
            border-color: #2e7d32 !important;
            border-width: 2px;
        }

        .wrong-input {
            background-color: #ffe0db !important;
            border-color: #c62828 !important;
            border-width: 2px;
        }

        .verb-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
            align-items: center;
        }

        .grade-verb-btn {
            background-color: #2c5f2d;
            padding: 6px 18px;
            font-size: 0.85rem;
        }

        .show-answer-btn {
            background-color: #9e7e5e;
            padding: 6px 18px;
            font-size: 0.85rem;
        }

        .answer-hint {
            display: inline-block;
            margin-left: 12px;
            font-size: 0.85rem;
            background: #f4efdf;
            padding: 4px 12px;
            border-radius: 28px;
            color: #3b5c2a;
        }

        .local-feedback {
            font-size: 0.8rem;
            margin-left: 12px;
            font-weight: normal;
            color: #2d5a2c;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.8rem;
            color: #7c6e55;
            border-top: 1px solid #e9dbc9;
            padding-top: 20px;
        }

        @media (max-width: 700px) {
            .verb-card {
                padding: 14px;
            }
            .conj-table th, .conj-table td {
                padding: 8px 4px;
            }
            .blank-input {
                font-size: 0.85rem;
                padding: 6px 2px;
            }
            .verb-name {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
<div class="title-block">
    <h1>📖 演習 2-7</h1>
    <div class="sub">不規則動詞現在形活用テスト（全動詞シャッフル・正誤色分け）</div>
</div>
<div class="global-controls">
    <button id="reshuffleBtn">🔄 問題順序をシャッフル</button>
    <button id="globalGradeBtn" class="secondary-btn">⭐ 全問一括採点</button>
    <button id="globalShowAnswersBtn">🔎 すべての答えをフラッシュ表示</button>
    <button id="globalClearColorsBtn" class="danger-btn">🧹 色リセット</button>
</div>
<div id="verbContainer" class="verb-grid"></div>
<div class="footer">
    ✅ アクセント記号なし・大文字小文字・前後スペース無視で正答判定 (例: "juego" / "JUEGO" どちらも可)<br>
    📌 各動詞ごとに採点ボタンがあります。正解の入力欄は<span style="background:#c8e6d9; padding:2px 8px; border-radius:20px;">緑</span>、不正解は<span style="background:#ffe0db; padding:2px 8px; border-radius:20px;">赤</span>になります。
</div>

<script>
    // ---------- 完全な活用データ (全29動詞) ----------
    const ALL_VERBS_DATA = [
        // ① 語幹母音変化動詞 (e-ie / o-ue / e-i / u-ue)
        { name: "pensar", type: "e → ie", forms: ["pienso", "piensas", "piensa", "pensamos", "pensáis", "piensan"] },
        { name: "querer", type: "e → ie", forms: ["quiero", "quieres", "quiere", "queremos", "queréis", "quieren"] },
        { name: "sentir", type: "e → ie", forms: ["siento", "sientes", "siente", "sentimos", "sentís", "sienten"] },
        { name: "poder", type: "o → ue", forms: ["puedo", "puedes", "puede", "podemos", "podéis", "pueden"] },
        { name: "dormir", type: "o → ue", forms: ["duermo", "duermes", "duerme", "dormimos", "dormís", "duermen"] },
        { name: "contar", type: "o → ue", forms: ["cuento", "cuentas", "cuenta", "contamos", "contáis", "cuentan"] },
        { name: "pedir", type: "e → i", forms: ["pido", "pides", "pide", "pedimos", "pedís", "piden"] },
        { name: "repetir", type: "e → i", forms: ["repito", "repites", "repite", "repetimos", "repetís", "repiten"] },
        { name: "seguir", type: "e → i", forms: ["sigo", "sigues", "sigue", "seguimos", "seguís", "siguen"] },
        { name: "jugar", type: "u → ue", forms: ["juego", "juegas", "juega", "jugamos", "jugáis", "juegan"] },
        // ② 一人称のみ不規則動詞 (yo形のみ特殊)
        { name: "hacer", type: "yo: hago", forms: ["hago", "haces", "hace", "hacemos", "hacéis", "hacen"] },
        { name: "poner", type: "yo: pongo", forms: ["pongo", "pones", "pone", "ponemos", "ponéis", "ponen"] },
        { name: "conocer", type: "yo: conozco", forms: ["conozco", "conoces", "conoce", "conocemos", "conocéis", "conocen"] },
        { name: "saber", type: "yo: sé", forms: ["sé", "sabes", "sabe", "sabemos", "sabéis", "saben"] },
        { name: "caer", type: "yo: caigo", forms: ["caigo", "caes", "cae", "caemos", "caéis", "caen"] },
        { name: "traer", type: "yo: traigo", forms: ["traigo", "traes", "trae", "traemos", "traéis", "traen"] },
        { name: "ver", type: "yo: veo", forms: ["veo", "ves", "ve", "vemos", "veis", "ven"] },
        { name: "dar", type: "yo: doy", forms: ["doy", "das", "da", "damos", "dais", "dan"] },
        { name: "salir", type: "yo: salgo", forms: ["salgo", "sales", "sale", "salimos", "salís", "salen"] },
        { name: "producir", type: "yo: produzco", forms: ["produzco", "produces", "produce", "producimos", "producís", "producen"] },
        { name: "agradecer", type: "yo: agradezco", forms: ["agradezco", "agradeces", "agradece", "agradecemos", "agradecéis", "agradecen"] },
        { name: "conducir", type: "yo: conduzco", forms: ["conduzco", "conduces", "conduce", "conducimos", "conducís", "conducen"] },
        { name: "traducir", type: "yo: traduzco", forms: ["traduzco", "traduces", "traduce", "traducimos", "traducís", "traducen"] },
        // ③ 複合型不規則動詞
        { name: "tener", type: "e→ie + go", forms: ["tengo", "tienes", "tiene", "tenemos", "tenéis", "tienen"] },
        { name: "venir", type: "e→ie + go", forms: ["vengo", "vienes", "viene", "venimos", "venís", "vienen"] },
        { name: "decir", type: "e→i + go", forms: ["digo", "dices", "dice", "decimos", "decís", "dicen"] },
        // ④ その他の特殊不規則動詞
        { name: "construir", type: "i→y", forms: ["construyo", "construyes", "construye", "construimos", "construís", "construyen"] },
        { name: "oír", type: "特殊", forms: ["oigo", "oyes", "oye", "oímos", "oís", "oyen"] },
        { name: "ir", type: "完全不規則", forms: ["voy", "vas", "va", "vamos", "vais", "van"] },
        { name: "estar", type: "estar", forms: ["estoy", "estás", "está", "estamos", "estáis", "están"] }
    ];

    // 正規化 (アクセント除去・小文字化・前後空白削除)
    function normalizeStr(str) {
        if (str === null || str === undefined) return "";
        return String(str).toLowerCase().trim()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/\s+/g, ' ');
    }

    let currentVerbsList = [];          // シャッフル後の動詞配列
    let inputsMap = new Map();          // key: `${verbIndex}_${pos}` => input DOM要素
    let currentAnswerMap = new Map();   // key: `${verbIndex}_${pos}` => 正解文字列(正規化済み)

    const container = document.getElementById("verbContainer");

    // 単一動詞の採点＆色付け (完全に対応)
    function gradeSingleVerb(verbIndex, correctFormsRaw) {
        // 正解配列を正規化したものを事前に用意 (アクセント除去など)
        const normalizedCorrect = correctFormsRaw.map(f => normalizeStr(f));
        let allCorrectCount = 0;

        for (let pos = 0; pos < correctFormsRaw.length; pos++) {
            const inputElem = inputsMap.get(`${verbIndex}_${pos}`);
            if (!inputElem) continue;

            const userValue = inputElem.value;
            const normUser = normalizeStr(userValue);
            const normAnswer = normalizedCorrect[pos];
            const isCorrect = (normUser === normAnswer);

            // 色クラス更新 (既存のクラス削除)
            inputElem.classList.remove("correct-input", "wrong-input");
            if (isCorrect) {
                inputElem.classList.add("correct-input");
                allCorrectCount++;
            } else {
                inputElem.classList.add("wrong-input");
            }
        }

        // 簡単なフィードバックをカード内に表示 (任意、ユーザー補助)
        const card = document.querySelector(`.verb-card[data-verb-index='${verbIndex}']`);
        if (card) {
            let feedbackSpan = card.querySelector(".local-feedback");
            if (!feedbackSpan) {
                const btnDiv = card.querySelector(".verb-buttons");
                if (btnDiv) {
                    feedbackSpan = document.createElement("span");
                    feedbackSpan.className = "local-feedback";
                    btnDiv.appendChild(feedbackSpan);
                }
            }
            if (feedbackSpan) {
                feedbackSpan.textContent = ` (${allCorrectCount}/6 正解)`;
                setTimeout(() => {
                    if (feedbackSpan) feedbackSpan.textContent = "";
                }, 1800);
            }
        }
    }

    // 一時的に正解をハイライト＆フラッシュ (表示のみ)
    function flashCorrectAnswers(verbIndex, correctFormsRaw) {
        for (let pos = 0; pos < correctFormsRaw.length; pos++) {
            const inputElem = inputsMap.get(`${verbIndex}_${pos}`);
            if (!inputElem) continue;
            const originalTransition = inputElem.style.transition;
            inputElem.style.transition = "background 0.15s";
            inputElem.style.backgroundColor = "#fff2b5";
            setTimeout(() => {
                if (inputElem) inputElem.style.backgroundColor = "";
                inputElem.style.transition = originalTransition;
            }, 900);
        }
        // ヒントスパンも表示
        const card = document.querySelector(`.verb-card[data-verb-index='${verbIndex}']`);
        if (card) {
            const hintSpan = card.querySelector(".answer-hint");
            if (hintSpan) {
                hintSpan.style.display = "inline-block";
                setTimeout(() => {
                    if (hintSpan) hintSpan.style.display = "none";
                }, 2800);
            }
        }
    }

    // 全動詞一括採点
    function gradeAllVerbs() {
        currentVerbsList.forEach((verb, idx) => {
            gradeSingleVerb(idx, verb.forms);
        });
    }

    // 全色リセット (正誤クラス除去)
    function resetAllColors() {
        for (let [key, inputElem] of inputsMap.entries()) {
            inputElem.classList.remove("correct-input", "wrong-input");
        }
        // ローカルフィードバックスパンも消去
        document.querySelectorAll(".local-feedback").forEach(span => span.textContent = "");
    }

    // 全動詞の正解を一括フラッシュ表示 (色は変えない)
    function globalFlashAnswers() {
        currentVerbsList.forEach((verb, idx) => {
            for (let pos = 0; pos < verb.forms.length; pos++) {
                const inputElem = inputsMap.get(`${idx}_${pos}`);
                if (inputElem) {
                    inputElem.style.transition = "background 0.12s";
                    inputElem.style.backgroundColor = "#fff2b5";
                    setTimeout((el) => {
                        if (el) el.style.backgroundColor = "";
                    }, 800, inputElem);
                }
            }
            const card = document.querySelector(`.verb-card[data-verb-index='${idx}']`);
            if (card) {
                const hintSpan = card.querySelector(".answer-hint");
                if (hintSpan) {
                    hintSpan.style.display = "inline-block";
                    setTimeout(() => {
                        if (hintSpan) hintSpan.style.display = "none";
                    }, 2500);
                }
            }
        });
    }

    // シャッフル (Fisher-Yates)
    function shuffleArray(arr) {
        const newArr = [...arr];
        for (let i = newArr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
        }
        return newArr;
    }

    // 完全再描画 (動詞順序をランダムに)
    function renderAllVerbs(verbsArray) {
        container.innerHTML = "";
        inputsMap.clear();
        currentAnswerMap.clear();

        verbsArray.forEach((verbData, vIdx) => {
            const { name, type, forms } = verbData;
            const card = document.createElement("div");
            card.className = "verb-card";
            card.setAttribute("data-verb-index", vIdx);

            // ヘッダー
            const headerDiv = document.createElement("div");
            headerDiv.className = "verb-header";
            headerDiv.innerHTML = `
                <span class="verb-name">${name}</span>
                <span class="verb-type">${type}</span>
            `;
            card.appendChild(headerDiv);

            // 活用表 (yo, tú, él... / nosotros, vosotros, ellos...)
            const table = document.createElement("table");
            table.className = "conj-table";
            const tbody = document.createElement("tbody");
            const rows = [
                ["yo", "nosotros"],
                ["tú", "vosotros"],
                ["él / ella / usted", "ellos / ellas / ustedes"]
            ];

            for (let r = 0; r < rows.length; r++) {
                const tr = document.createElement("tr");
                const leftPerson = rows[r][0];
                const rightPerson = rows[r][1];
                // 左人称
                const tdLeftPerson = document.createElement("td");
                tdLeftPerson.className = "person-cell";
                tdLeftPerson.textContent = leftPerson;
                tr.appendChild(tdLeftPerson);
                // 左入力セル
                const tdLeftInput = document.createElement("td");
                tdLeftInput.className = "input-cell";
                const leftInput = document.createElement("input");
                leftInput.type = "text";
                leftInput.placeholder = "_____";
                leftInput.className = "blank-input";
                let leftPos = (r === 0 ? 0 : (r === 1 ? 1 : 2));
                leftInput.id = `v${vIdx}_${leftPos}`;
                tdLeftInput.appendChild(leftInput);
                tr.appendChild(tdLeftInput);

                // 右人称
                const tdRightPerson = document.createElement("td");
                tdRightPerson.className = "person-cell";
                tdRightPerson.textContent = rightPerson;
                tr.appendChild(tdRightPerson);
                // 右入力セル
                const tdRightInput = document.createElement("td");
                tdRightInput.className = "input-cell";
                const rightInput = document.createElement("input");
                rightInput.type = "text";
                rightInput.placeholder = "_____";
                rightInput.className = "blank-input";
                let rightPos = 0;
                if (r === 0) rightPos = 3;      // nosotros
                else if (r === 1) rightPos = 4; // vosotros
                else rightPos = 5;              // ellos
                rightInput.id = `v${vIdx}_${rightPos}`;
                tdRightInput.appendChild(rightInput);
                tr.appendChild(tdRightInput);
                tbody.appendChild(tr);
            }
            table.appendChild(tbody);
            card.appendChild(table);

            // 各入力要素を Map に保存 (あとで採点時に使う)
            for (let pos = 0; pos < forms.length; pos++) {
                const inputElem = document.getElementById(`v${vIdx}_${pos}`);
                if (inputElem) {
                    inputsMap.set(`${vIdx}_${pos}`, inputElem);
                    currentAnswerMap.set(`${vIdx}_${pos}`, forms[pos]);
                } else {
                    // 万が一 DOM 未配置なら手動で探すことはないが、安全のため再取得
                    const fallback = document.querySelector(`#v${vIdx}_${pos}`);
                    if (fallback) {
                        inputsMap.set(`${vIdx}_${pos}`, fallback);
                        currentAnswerMap.set(`${vIdx}_${pos}`, forms[pos]);
                    }
                }
            }

            // ボタンエリア
            const btnDiv = document.createElement("div");
            btnDiv.className = "verb-buttons";
            const gradeBtn = document.createElement("button");
            gradeBtn.textContent = "✅ この動詞を採点";
            gradeBtn.className = "grade-verb-btn";
            gradeBtn.addEventListener("click", (e) => {
                e.preventDefault();
                gradeSingleVerb(vIdx, forms);
            });

            const showAnswerBtn = document.createElement("button");
            showAnswerBtn.textContent = "📖 正解をフラッシュ";
            showAnswerBtn.className = "show-answer-btn";
            showAnswerBtn.addEventListener("click", (e) => {
                e.preventDefault();
                flashCorrectAnswers(vIdx, forms);
            });

            const hintSpan = document.createElement("span");
            hintSpan.className = "answer-hint";
            hintSpan.style.display = "none";
            hintSpan.textContent = `📌 正解: ${forms.join(" / ")}`;
            // フラッシュボタンでヒントも同時に出るように改良 (flashCorrectAnswers内でもスパン表示)

            btnDiv.appendChild(gradeBtn);
            btnDiv.appendChild(showAnswerBtn);
            btnDiv.appendChild(hintSpan);
            card.appendChild(btnDiv);
            container.appendChild(card);
        });

        // カードが全て生成された後、念のため inputsMap に未登録がないか最終チェック
        for (let vIdx = 0; vIdx < verbsArray.length; vIdx++) {
            for (let p = 0; p < 6; p++) {
                const key = `${vIdx}_${p}`;
                if (!inputsMap.has(key)) {
                    const el = document.getElementById(`v${vIdx}_${p}`);
                    if (el) {
                        inputsMap.set(key, el);
                        currentAnswerMap.set(key, verbsArray[vIdx].forms[p]);
                    }
                }
            }
        }
    }

    // 初期化 + シャッフル
    function initAndShuffle() {
        const shuffled = shuffleArray(ALL_VERBS_DATA);
        currentVerbsList = shuffled;
        renderAllVerbs(currentVerbsList);
        // 色リセット (新しく生成されたので既に色はないが安全のため)
        resetAllColors();
    }

    // 再シャッフル (ボタン用)
    function reshuffleAndRender() {
        initAndShuffle();
    }

    // DOM構築後にイベント設定
    document.addEventListener("DOMContentLoaded", () => {
        initAndShuffle();

        const reshuffleBtn = document.getElementById("reshuffleBtn");
        const globalGradeBtn = document.getElementById("globalGradeBtn");
        const globalShowAnswersBtn = document.getElementById("globalShowAnswersBtn");
        const globalClearColorsBtn = document.getElementById("globalClearColorsBtn");

        reshuffleBtn.addEventListener("click", () => {
            reshuffleAndRender();
        });

        globalGradeBtn.addEventListener("click", () => {
            gradeAllVerbs();
        });

        globalShowAnswersBtn.addEventListener("click", () => {
            globalFlashAnswers();
        });

        globalClearColorsBtn.addEventListener("click", () => {
            resetAllColors();
        });
    });
</script>
</body>
</html>
