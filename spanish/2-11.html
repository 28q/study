<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>演習2-11：再帰動詞の活用・西訳</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            max-width: 1100px;
            margin: 28px auto;
            padding: 18px;
            background: #fbf8f0;
            color: #21313c;
            line-height: 1.6;
        }
        h1,
        h2,
        h3 {
            margin: 0.35em 0;
        }
        h1 {
            text-align: center;
            font-size: 1.9rem;
            border-bottom: 3px solid #b22234;
            display: inline-block;
            padding-bottom: 4px;
        }
        .title-block {
            text-align: center;
            margin-bottom: 18px;
        }
        .meta-box {
            background: #eef5ea;
            border-left: 8px solid #2c5f2d;
            padding: 12px 16px;
            border-radius: 18px;
            margin: 18px 0 24px;
            font-size: 0.96rem;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            background: #fff4de;
            padding: 12px 16px;
            border-radius: 20px;
            margin-bottom: 22px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }
        button {
            background: #2c5f2d;
            color: #fff;
            border: none;
            padding: 9px 16px;
            border-radius: 28px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .15s ease, background .15s ease;
            font-size: 0.92rem;
        }
        button:hover {
            transform: scale(.98);
            background: #214521;
        }
        .secondary {
            background: #6c757d;
        }
        .danger {
            background: #b23c1c;
        }
        select {
            padding: 8px 12px;
            border-radius: 24px;
            border: 1px solid #cdbb91;
            background: #fff;
        }
        #timer-area {
            font-weight: 700;
            background: #ffe1b8;
            padding: 6px 12px;
            border-radius: 24px;
            color: #b23c1c;
            display: none;
        }
        .section {
            background: #fff;
            border: 1px solid #eadfc7;
            border-radius: 24px;
            padding: 18px 20px;
            margin-bottom: 28px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.04);
        }
        .section h3 {
            border-left: 6px solid #b22234;
            padding-left: 12px;
            margin-bottom: 14px;
            text-align: left;
        }
        .note {
            font-size: 0.88rem;
            background: #f7f1df;
            padding: 8px 12px;
            border-radius: 18px;
            margin: 8px 0 14px;
            display: inline-block;
        }
        .verb-block {
            background: #fcf9f2;
            border: 1px solid #e6dbc8;
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 18px;
        }
        .verb-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .verb-title .jp {
            font-weight: 400;
            font-size: 0.9rem;
            color: #555;
            margin-left: 10px;
        }
        .conj-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 12px;
            margin: 4px 0;
        }
        .conj-row .person {
            font-weight: 600;
            width: 100px;
            display: inline-block;
        }
        .conj-row input {
            width: clamp(100px, 20vw, 200px);
            padding: 6px 8px;
            font-size: 0.95rem;
            border: 1px solid #cfb87c;
            border-radius: 12px;
            background: #fffef9;
            text-align: center;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        .conj-row input:focus {
            outline: none;
            border-color: #2c5f2d;
            box-shadow: 0 0 0 2px rgba(44, 95, 45, 0.18);
        }
        .conj-row input.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            box-shadow: 0 0 0 2px rgba(40, 167, 69, 0.25);
        }
        .audio-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            vertical-align: middle;
            color: #2c5f2d;
            padding: 0 4px;
            margin-left: 6px;
        }
        .answer-hint {
            display: none;
            margin-left: 10px;
            font-size: 0.86rem;
            color: #3d6b3d;
            background: #eef6ea;
            padding: 3px 9px;
            border-radius: 18px;
        }
        .question {
            margin-bottom: 22px;
            padding: 12px;
            border-radius: 18px;
            background: #fffdf7;
            border: 1px solid #f1e7cf;
        }
        .question-text {
            font-size: 1.02rem;
            font-weight: 600;
            margin-bottom: 8px;
            background: #f6f1e6;
            padding: 9px 12px;
            border-radius: 18px;
            display: inline-block;
        }
        .jp-hint {
            display: inline-block;
            margin-left: 10px;
            font-size: 0.84rem;
            color: #005f6b;
            background: #e4f3f5;
            padding: 3px 10px;
            border-radius: 18px;
        }
        textarea.full-input {
            width: 100%;
            max-width: 700px;
            padding: 10px 14px;
            font-size: 1rem;
            border: 1px solid #cfb87c;
            border-radius: 14px;
            background: #fffef9;
            resize: vertical;
            transition: background-color 0.25s ease, border-color 0.25s ease;
            line-height: 1.5;
            font-family: inherit;
        }
        textarea.full-input:focus {
            outline: none;
            border-color: #2c5f2d;
            box-shadow: 0 0 0 2px rgba(44, 95, 45, 0.18);
        }
        textarea.full-input.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            box-shadow: 0 0 0 2px rgba(40, 167, 69, 0.25);
        }
        #result {
            background: #f4f1e1;
            border-radius: 20px;
            padding: 14px 18px;
            margin-top: 18px;
        }
        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 0.82rem;
            color: #5e5e52;
        }
        @media (max-width: 600px) {
            .conj-row .person {
                width: 80px;
            }
            .conj-row input {
                width: 140px;
            }
        }
    </style>
</head>
<body>
    <div class="title-block">
        <h1>📘 演習 2-11</h1>
        <p>再帰動詞の活用・西訳</p>
    </div>

    <div class="meta-box">
        🔹 <strong>第1問</strong>：再帰動詞6種類の現在形活用（全6人称）<br>
        🔹 <strong>第2問</strong>：日本語からスペイン語への全文訳（4問）<br><br>
        🔹 正しい答えを入力すると、その場で空欄が<span style="color:#28a745;font-weight:700;">緑色</span>に変わります。<br>
        🔹 アクセント記号・¿? などの記号も厳密一致です。
    </div>

    <div class="controls">
        <button onclick="generateQuiz()">✨ 問題生成 (リセット)</button>
        <button onclick="gradeQuiz()" class="secondary">📝 総合採点</button>
        <button onclick="toggleAnswers()" id="toggleBtn">🔎 答え表示</button>
        <button onclick="resetHistory()" class="danger">🗑 履歴リセット</button>
        <label for="timeLimit">⏱️ 制限時間:</label>
        <select id="timeLimit">
            <option value="0">制限なし</option>
            <option value="180">3分</option>
            <option value="300">5分</option>
            <option value="480">8分</option>
            <option value="600">10分</option>
        </select>
        <div id="timer-area">⏳ 残り <span id="timeDisplay">--:--</span></div>
    </div>

    <form id="quizForm"></form>
    <div id="result"></div>
    <div class="footer">📗 アクセント記号・¿?などの記号も厳密一致です。正答で空欄が緑色に変わります。</div>

    <script>
        // ===================== データ定義 =====================

        // 第1問：再帰動詞の活用（6動詞 × 6人称）
        const reflexiveVerbs = [{
            infinitive: 'acostarse',
            jp: '寝る',
            forms: ['me acuesto', 'te acuestas', 'se acuesta', 'nos acostamos', 'os acostáis', 'se acuestan']
        }, {
            infinitive: 'arrepentirse',
            jp: '後悔する',
            forms: ['me arrepiento', 'te arrepientes', 'se arrepiente', 'nos arrepentimos', 'os arrepentís', 'se arrepienten']
        }, {
            infinitive: 'irse',
            jp: '立ち去る',
            forms: ['me voy', 'te vas', 'se va', 'nos vamos', 'os vais', 'se van']
        }, {
            infinitive: 'vestirse',
            jp: '着替える',
            forms: ['me visto', 'te vistes', 'se viste', 'nos vestimos', 'os vestís', 'se visten']
        }, {
            infinitive: 'sentarse',
            jp: '座る',
            forms: ['me siento', 'te sientas', 'se sienta', 'nos sentamos', 'os sentáis', 'se sientan']
        }, {
            infinitive: 'bañarse',
            jp: '風呂に入る',
            forms: ['me baño', 'te bañas', 'se baña', 'nos bañamos', 'os bañáis', 'se bañan']
        }];

        const persons = ['yo', 'tú', 'él/ella/usted', 'nosotros/as', 'vosotros/as', 'ellos/as/ustedes'];

        // 第2問：西訳問題（練習問題4）
        const translationQuestions = [{
            jp: 'ラウラは自分のひいきのチームの試合を見ると、いつもとてもドキドキする。',
            es: 'Al ver el partido de su equipo favorito, Laura siempre se emociona mucho.'
        }, {
            jp: 'ラテンアメリカの歌手のコンサートに君は行ったことがある？',
            es: '¿Has ido alguna vez a un concierto de un cantante latinoamericano?'
        }, {
            jp: '肉と魚とあなたはどちらを好みますか。',
            es: '¿Qué prefieres, la carne o el pescado?'
        }, {
            jp: '私はいつの日かクスコの街のインカの壁を見に行くことを夢見ている。',
            es: 'Sueño con ir a ver los muros incaicos de la ciudad de Cusco algún día.'
        }];

        // ===================== グローバル変数 =====================

        let currentQuestions = [];
        let showAnswersFlag = false;
        let timerInterval = null;
        let timeLeft = 0;
        let scoreHistory = JSON.parse(localStorage.getItem('spanish_exam_2_11_history') || '[]');

        // ===================== ユーティリティ =====================

        function strictCompare(userStr, answerStr) {
            if (!userStr || !answerStr) return false;
            return userStr.trim() === answerStr.trim();
        }

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function speakText(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 0.88;
            window.speechSynthesis.speak(utterance);
        }

        // ===================== タイマー =====================

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            const limitSec = parseInt(document.getElementById('timeLimit').value, 10);
            const timerDiv = document.getElementById('timer-area');
            if (limitSec === 0) {
                timerDiv.style.display = 'none';
                return;
            }
            timeLeft = limitSec;
            timerDiv.style.display = 'block';
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (timeLeft <= 1) {
                    clearInterval(timerInterval);
                    timerDiv.style.display = 'none';
                    alert('⏰ 制限時間終了！自動採点します。');
                    gradeQuiz();
                } else {
                    timeLeft--;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timeDisplay').innerText = `${m}:${s.toString().padStart(2, '0')}`;
        }

        // ===================== 答え表示トグル =====================

        function toggleAnswers() {
            showAnswersFlag = !showAnswersFlag;
            document.querySelectorAll('.answer-hint').forEach(el => {
                el.style.display = showAnswersFlag ? 'inline' : 'none';
            });
            document.getElementById('toggleBtn').innerText = showAnswersFlag ? '🔒 答え非表示' : '🔎 答え表示';
        }

        // ===================== 履歴リセット =====================

        function resetHistory() {
            scoreHistory = [];
            localStorage.setItem('spanish_exam_2_11_history', JSON.stringify(scoreHistory));
            document.getElementById('result').innerHTML = '<p>📊 スコア履歴をリセットしました。</p>';
        }

        // ===================== リアルタイム正誤判定 =====================

        function checkSingleInput(inputEl, answerStr) {
            if (!inputEl || !answerStr) return;
            if (strictCompare(inputEl.value, answerStr)) {
                inputEl.classList.add('correct');
            } else {
                inputEl.classList.remove('correct');
            }
        }

        function checkTextarea(textareaEl, answerStr) {
            if (!textareaEl || !answerStr) return;
            if (strictCompare(textareaEl.value, answerStr)) {
                textareaEl.classList.add('correct');
            } else {
                textareaEl.classList.remove('correct');
            }
        }

        // ===================== 問題ビルダ =====================

        // 第1問：再帰動詞活用表（1動詞ごとに6人称）
        function buildReflexiveBlock(verb, verbIndex) {
            const block = document.createElement('div');
            block.className = 'verb-block';
            const title = document.createElement('div');
            title.className = 'verb-title';
            title.innerHTML = `${verb.infinitive} <span class="jp">${verb.jp}</span>`;
            block.appendChild(title);

            const rows = [];
            verb.forms.forEach((form, idx) => {
                const row = document.createElement('div');
                row.className = 'conj-row';
                const personSpan = document.createElement('span');
                personSpan.className = 'person';
                personSpan.textContent = persons[idx];
                const input = document.createElement('input');
                input.type = 'text';
                input.id = `q1_${verbIndex}_${idx}`;
                input.placeholder = '活用形';
                input.autocomplete = 'off';
                // リアルタイム判定
                input.addEventListener('input', () => checkSingleInput(input, form));

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'audio-btn';
                btn.textContent = '🔊';
                btn.onclick = () => speakText(form);

                const hint = document.createElement('span');
                hint.className = 'answer-hint';
                hint.textContent = `→ ${form}`;
                hint.style.display = showAnswersFlag ? 'inline' : 'none';

                row.appendChild(personSpan);
                row.appendChild(input);
                row.appendChild(btn);
                row.appendChild(hint);
                block.appendChild(row);
                rows.push({ id: `q1_${verbIndex}_${idx}`, answer: form, inputEl: input });
            });

            // ブロック全体の正誤を後で判定できるようにデータを保持
            block.dataset.verbIndex = verbIndex;
            return { node: block, rows };
        }

        // 第2問：西訳問題（全文テキストエリア）
        function buildTranslationQuestion(sentence, qIndex) {
            const q = document.createElement('div');
            q.className = 'question';
            q.innerHTML = `
                <div class="question-text">第2問 ${qIndex + 1}. <span class="jp-hint">📖 ${sentence.jp}</span></div>
                <textarea class="full-input" id="q2_${qIndex}" rows="2" placeholder="スペイン語で全文を入力してください" autocomplete="off"></textarea>
            `;

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'audio-btn';
            btn.textContent = '🔊';
            btn.style.marginTop = '6px';
            btn.onclick = () => speakText(sentence.es);
            q.appendChild(btn);

            const hint = document.createElement('span');
            hint.className = 'answer-hint';
            hint.textContent = `→ ${sentence.es}`;
            hint.style.display = showAnswersFlag ? 'inline' : 'none';
            q.appendChild(hint);

            const textarea = q.querySelector('textarea');
            textarea.addEventListener('input', () => checkTextarea(textarea, sentence.es));

            return { node: q, id: `q2_${qIndex}`, answer: sentence.es };
        }

        // ===================== メイン問題生成 =====================

        function generateQuiz() {
            if (timerInterval) clearInterval(timerInterval);
            currentQuestions = [];
            const form = document.getElementById('quizForm');
            form.innerHTML = '';
            document.getElementById('result').innerHTML = '';

            // ---- 第1問：再帰動詞活用 ----
            const sec1 = document.createElement('div');
            sec1.className = 'section';
            sec1.innerHTML = `
                <h3>第1問：再帰動詞の現在形活用（6動詞 × 6人称）</h3>
                <div class="note">各動詞の現在形（再帰代名詞＋動詞）を入力してください。正答で枠が緑色になります。</div>
            `;

            const shuffledVerbs = shuffleArray(reflexiveVerbs);
            shuffledVerbs.forEach((verb, idx) => {
                const built = buildReflexiveBlock(verb, idx);
                sec1.appendChild(built.node);
                // 各入力欄の情報をcurrentQuestionsに保存（動詞単位でグループ化）
                currentQuestions.push({
                    type: 'q1_verb',
                    verbIndex: idx,
                    rows: built.rows,
                    jp: `${verb.infinitive} (${verb.jp})`
                });
            });
            form.appendChild(sec1);

            // ---- 第2問：西訳 ----
            const sec2 = document.createElement('div');
            sec2.className = 'section';
            sec2.innerHTML = `
                <h3>第2問：日本語→スペイン語 全文訳</h3>
                <div class="note">日本語の文に合うスペイン語の全文を入力してください。アクセント記号・¿? も厳密一致です。</div>
            `;
            const shuffledTrans = shuffleArray(translationQuestions);
            shuffledTrans.forEach((sent, idx) => {
                const built = buildTranslationQuestion(sent, idx);
                sec2.appendChild(built.node);
                currentQuestions.push({
                    type: 'q2_trans',
                    id: built.id,
                    answer: built.answer,
                    jp: sent.jp
                });
            });
            form.appendChild(sec2);

            if (showAnswersFlag) {
                document.querySelectorAll('.answer-hint').forEach(el => el.style.display = 'inline');
            }

            startTimer();
        }

        // ===================== 総合採点 =====================

        function gradeQuiz() {
            if (timerInterval) clearInterval(timerInterval);
            let correctCount = 0;
            let totalCount = 0;
            let html = '<h3>📋 採点結果</h3><ul style="list-style:none; padding-left:0;">';

            // 第1問：各動詞ごとに6人称すべて正解なら正解
            const q1Items = currentQuestions.filter(q => q.type === 'q1_verb');
            q1Items.forEach((q, idx) => {
                totalCount++;
                let allCorrect = true;
                let userAnswers = [];
                let correctAnswers = [];
                q.rows.forEach(row => {
                    const el = document.getElementById(row.id);
                    const userVal = el ? el.value : '';
                    userAnswers.push(userVal || '(空白)');
                    correctAnswers.push(row.answer);
                    if (!strictCompare(userVal, row.answer)) allCorrect = false;
                    // リアルタイムで色付け（再確認）
                    if (el) {
                        if (strictCompare(userVal, row.answer)) el.classList.add('correct');
                        else el.classList.remove('correct');
                    }
                });
                if (allCorrect) correctCount++;
                html += `<li>${allCorrect ? '✅' : '❌'} <strong>第1問 ${idx + 1}</strong> (${q.jp})<br>
                <span style="font-size:0.92rem;">入力: ${userAnswers.join(' / ')}<br>
                正解: <span style="color:#2c5f2d; font-weight:bold;">${correctAnswers.join(' / ')}</span></span></li><br>`;
            });

            // 第2問：各西訳問題
            const q2Items = currentQuestions.filter(q => q.type === 'q2_trans');
            q2Items.forEach((q, idx) => {
                totalCount++;
                const el = document.getElementById(q.id);
                const userVal = el ? el.value : '';
                const ok = strictCompare(userVal, q.answer);
                if (ok) correctCount++;
                if (el) {
                    if (ok) el.classList.add('correct');
                    else el.classList.remove('correct');
                }
                html += `<li>${ok ? '✅' : '❌'} <strong>第2問 ${idx + 1}</strong> (${q.jp})<br>
                <span style="font-size:0.92rem;">入力: ${userVal || '(空白)'}<br>
                正解: <span style="color:#2c5f2d; font-weight:bold;">${q.answer}</span></span></li><br>`;
            });

            const percent = totalCount ? Math.round(correctCount / totalCount * 100) : 0;
            html += `</ul><p style="font-size:1.2rem;">🎯 ${correctCount} / ${totalCount} 正解 (${percent}%)</p>`;

            scoreHistory.push(percent);
            if (scoreHistory.length > 8) scoreHistory.shift();
            localStorage.setItem('spanish_exam_2_11_history', JSON.stringify(scoreHistory));
            const avg = scoreHistory.length ? Math.round(scoreHistory.reduce((a, b) => a + b, 0) / scoreHistory.length) : 0;
            html += `<p>📈 直近${scoreHistory.length}回の平均点: ${avg}%</p>`;

            document.getElementById('result').innerHTML = html;
        }

        // ===================== グローバル公開 =====================

        window.generateQuiz = generateQuiz;
        window.gradeQuiz = gradeQuiz;
        window.toggleAnswers = toggleAnswers;
        window.resetHistory = resetHistory;
        window.speakText = speakText;

        // ===================== 初期化 =====================

        window.onload = () => {
            generateQuiz();
        };
    </script>
</body>
</html>
