<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>西訳問題（第2課〜第5課）</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            max-width: 1100px;
            margin: 28px auto;
            padding: 18px;
            background: #fbf8f0;
            color: #21313c;
            line-height: 1.6;
        }
        h1, h2, h3 {
            margin: 0.35em 0;
        }
        h1 {
            text-align: center;
            font-size: 1.9rem;
            border-bottom: 3px solid #b22234;
            display: inline-block;
            padding-bottom: 4px;
        }
        .title-block {
            text-align: center;
            margin-bottom: 18px;
        }
        .meta-box {
            background: #eef5ea;
            border-left: 8px solid #2c5f2d;
            padding: 12px 16px;
            border-radius: 18px;
            margin: 18px 0 24px;
            font-size: 0.96rem;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            background: #fff4de;
            padding: 12px 16px;
            border-radius: 20px;
            margin-bottom: 22px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }
        button {
            background: #2c5f2d;
            color: #fff;
            border: none;
            padding: 9px 16px;
            border-radius: 28px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .15s ease, background .15s ease;
            font-size: 0.92rem;
        }
        button:hover {
            transform: scale(.98);
            background: #214521;
        }
        .secondary { background: #6c757d; }
        .danger { background: #b23c1c; }
        select {
            padding: 8px 12px;
            border-radius: 24px;
            border: 1px solid #cdbb91;
            background: #fff;
        }
        #timer-area {
            font-weight: 700;
            background: #ffe1b8;
            padding: 6px 12px;
            border-radius: 24px;
            color: #b23c1c;
            display: none;
        }
        .section {
            background: #fff;
            border: 1px solid #eadfc7;
            border-radius: 24px;
            padding: 18px 20px;
            margin-bottom: 28px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.04);
        }
        .section h3 {
            border-left: 6px solid #b22234;
            padding-left: 12px;
            margin-bottom: 14px;
            text-align: left;
        }
        .note {
            font-size: 0.88rem;
            background: #f7f1df;
            padding: 8px 12px;
            border-radius: 18px;
            margin: 8px 0 14px;
            display: inline-block;
        }
        .question {
            margin-bottom: 22px;
            padding: 12px;
            border-radius: 18px;
            background: #fffdf7;
            border: 1px solid #f1e7cf;
        }
        .question-text {
            font-size: 1.02rem;
            font-weight: 600;
            margin-bottom: 8px;
            background: #f6f1e6;
            padding: 9px 12px;
            border-radius: 18px;
            display: inline-block;
        }
        .jp-hint {
            display: inline-block;
            margin-left: 10px;
            font-size: 0.84rem;
            color: #005f6b;
            background: #e4f3f5;
            padding: 3px 10px;
            border-radius: 18px;
        }
        .answer-hint {
            display: none;
            margin-left: 10px;
            font-size: 0.86rem;
            color: #3d6b3d;
            background: #eef6ea;
            padding: 3px 9px;
            border-radius: 18px;
        }
        .audio-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            vertical-align: middle;
            color: #2c5f2d;
            padding: 0 4px;
            margin-left: 6px;
        }
        textarea.full-input {
            width: 100%;
            max-width: 700px;
            padding: 10px 14px;
            font-size: 1rem;
            border: 1px solid #cfb87c;
            border-radius: 14px;
            background: #fffef9;
            resize: vertical;
            transition: background-color 0.25s ease, border-color 0.25s ease;
            line-height: 1.5;
            font-family: inherit;
        }
        textarea.full-input:focus {
            outline: none;
            border-color: #2c5f2d;
            box-shadow: 0 0 0 2px rgba(44, 95, 45, 0.18);
        }
        textarea.full-input.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            box-shadow: 0 0 0 2px rgba(40, 167, 69, 0.25);
        }
        #result {
            background: #f4f1e1;
            border-radius: 20px;
            padding: 14px 18px;
            margin-top: 18px;
        }
        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 0.82rem;
            color: #5e5e52;
        }
        @media (max-width: 760px) {
            textarea.full-input { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="title-block">
        <h1>📘 西訳問題</h1>
        <p>第２課 〜 第５課 から抜粋</p>
    </div>

    <div class="meta-box">
        🔹 <strong>全16問</strong>：日本語を読んで、正しいスペイン語の全文を入力してください。<br>
        🔹 アクセント記号・大文字小文字・¿? なども厳密一致です。<br>
        🔹 正しい答えを入力すると、その場で入力欄が<span style="color:#28a745;font-weight:700;">緑色</span>に変わります。
    </div>

    <div class="controls">
        <button onclick="generateQuiz()">✨ 問題生成 (シャッフル)</button>
        <button onclick="gradeQuiz()" class="secondary">📝 総合採点</button>
        <button onclick="toggleAnswers()" id="toggleBtn">🔎 答え表示</button>
        <button onclick="resetHistory()" class="danger">🗑 履歴リセット</button>
        <label for="timeLimit">⏱️ 制限時間:</label>
        <select id="timeLimit">
            <option value="0">制限なし</option>
            <option value="180">3分</option>
            <option value="300">5分</option>
            <option value="480">8分</option>
            <option value="600">10分</option>
        </select>
        <div id="timer-area">⏳ 残り <span id="timeDisplay">--:--</span></div>
    </div>

    <form id="quizForm"></form>
    <div id="result"></div>
    <div class="footer">📗 正答で空欄が緑色に変わります。答え表示ボタンで正解を確認できます。</div>

    <script>
        function strictCompare(userStr, answerStr) {
            if (!userStr || !answerStr) return false;
            return userStr.trim() === answerStr.trim();
        }

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function speakText(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 0.88;
            window.speechSynthesis.speak(utterance);
        }

        let currentQuestions = [];
        let showAnswersFlag = false;
        let timerInterval = null;
        let timeLeft = 0;
        let scoreHistory = JSON.parse(localStorage.getItem('spanish_translation_history') || '[]');

        // ========== 西訳問題データ（第2課〜第5課） ==========
        const translationSentences = [
            { jp: 'あなた方はどこのご出身ですか。', es: '¿De dónde son ustedes?' },
            { jp: '私達の大学は町の中心部にあります。', es: 'Nuestra universidad está en el centro de la ciudad.' },
            { jp: '君の家は駅から近いが、私の家は遠い。', es: 'Tu casa está cerca de la estación, pero la mía está lejos.' },
            { jp: 'そのビルの中には、喫茶店が２軒あります。', es: 'En ese edificio hay dos cafeterías.' },
            { jp: '私は水泳とスキーが好きです。', es: 'Me gustan nadar y esquiar.' },
            { jp: '日本人の主食は米だ。', es: 'El alimento básico de los japoneses es el arroz.' },
            { jp: '私達は彼らのためにワインを一本買います。', es: 'Compramos una botella de vino para ellos.' },
            { jp: 'ワカモレには、アボカド、トマト、玉ねぎ、その他の食材が入っている。', es: 'El guacamole lleva aguacate, tomate, cebolla y otros ingredientes.' },
            { jp: '私が買おうとしているギターはこれです。', es: 'Esta es la guitarra que voy a comprar.' },
            { jp: '日本には他にもっと面白い観光地がありますよ。', es: 'En Japón hay otros lugares turísticos más interesantes.' },
            { jp: '良い指導者になるためには、寛容さと忍耐力を持つ必要がある。', es: 'Para ser un buen líder, es necesario tener generosidad y paciencia.' },
            { jp: '私は春休みを利用して運転免許を取るつもりだ。', es: 'Voy a aprovechar las vacaciones de primavera para sacar el carné de conducir.' },
            { jp: 'ラウラは自分のひいきのチームの試合を見ると、いつもとてもドキドキする。', es: 'Cuando Laura ve el partido de su equipo favorito, siempre se emociona mucho.' },
            { jp: 'ラテンアメリカの歌手のコンサートに君は行ったことがある？', es: '¿Has ido alguna vez a un concierto de cantantes latinoamericanos?' },
            { jp: '肉と魚とあなたはどちらを好みますか。', es: '¿Qué prefieres, carne o pescado?' },
            { jp: '私はいつの日かクスコの街のインカの壁を見に行くことを夢見ている。', es: 'Sueño con ir a ver los muros incaicos de la ciudad de Cusco algún día.' }
        ];

        // ========== タイマー ==========
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            const limitSec = parseInt(document.getElementById('timeLimit').value, 10);
            const timerDiv = document.getElementById('timer-area');
            if (limitSec === 0) {
                timerDiv.style.display = 'none';
                return;
            }
            timeLeft = limitSec;
            timerDiv.style.display = 'block';
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (timeLeft <= 1) {
                    clearInterval(timerInterval);
                    timerDiv.style.display = 'none';
                    alert('⏰ 制限時間終了！自動採点します。');
                    gradeQuiz();
                } else {
                    timeLeft--;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timeDisplay').innerText = `${m}:${s.toString().padStart(2, '0')}`;
        }

        function toggleAnswers() {
            showAnswersFlag = !showAnswersFlag;
            document.querySelectorAll('.answer-hint').forEach(el => {
                el.style.display = showAnswersFlag ? 'inline' : 'none';
            });
            document.getElementById('toggleBtn').innerText = showAnswersFlag ? '🔒 答え非表示' : '🔎 答え表示';
        }

        function resetHistory() {
            scoreHistory = [];
            localStorage.setItem('spanish_translation_history', JSON.stringify(scoreHistory));
            document.getElementById('result').innerHTML = '<p>📊 スコア履歴をリセットしました。</p>';
        }

        // ========== リアルタイム正誤判定 ==========
        function checkTextarea(textareaEl, answerStr) {
            if (!textareaEl || !answerStr) return;
            if (strictCompare(textareaEl.value, answerStr)) {
                textareaEl.classList.add('correct');
            } else {
                textareaEl.classList.remove('correct');
            }
        }

        // ========== 問題ビルダ ==========
        function buildTranslationQuestion(sentenceData, qIndex) {
            const q = document.createElement('div');
            q.className = 'question';
            q.innerHTML = `
                <div class="question-text">第${qIndex + 1}問 <span class="jp-hint">📖 ${sentenceData.jp}</span></div>
                <textarea class="full-input" id="q_${qIndex}" rows="2" placeholder="スペイン語で全文を入力してください" autocomplete="off"></textarea>
            `;

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'audio-btn';
            btn.textContent = '🔊';
            btn.style.marginTop = '6px';
            btn.onclick = () => speakText(sentenceData.es);
            q.appendChild(btn);

            const hint = document.createElement('span');
            hint.className = 'answer-hint';
            hint.textContent = `→ ${sentenceData.es}`;
            hint.style.display = showAnswersFlag ? 'inline' : 'none';
            q.appendChild(hint);

            const id = `q_${qIndex}`;
            setTimeout(() => {
                const textarea = document.getElementById(id);
                if (textarea) {
                    textarea.addEventListener('blur', () => checkTextarea(textarea, sentenceData.es));
                    textarea.addEventListener('input', () => {
                        if (strictCompare(textarea.value, sentenceData.es)) {
                            textarea.classList.add('correct');
                        } else {
                            textarea.classList.remove('correct');
                        }
                    });
                }
            }, 0);

            return { node: q, id: id, answer: sentenceData.es, jp: sentenceData.jp };
        }

        // ========== メイン問題生成 ==========
        function generateQuiz() {
            if (timerInterval) clearInterval(timerInterval);
            currentQuestions = [];
            const form = document.getElementById('quizForm');
            form.innerHTML = '';
            document.getElementById('result').innerHTML = '';

            // ---- 第3問：西訳問題（第2課〜第5課） ----
            const sec = document.createElement('div');
            sec.className = 'section';
            sec.innerHTML = `
                <h3>西訳問題（第2課〜第5課）</h3>
                <div class="note">日本語を見て、スペイン語の全文を入力してください。アクセント記号・大文字小文字・¿? も厳密一致です。</div>
            `;
            const shuffledSentences = shuffleArray(translationSentences);
            shuffledSentences.forEach((sent, idx) => {
                const built = buildTranslationQuestion(sent, idx);
                sec.appendChild(built.node);
                currentQuestions.push(built);
            });
            form.appendChild(sec);

            if (showAnswersFlag) {
                document.querySelectorAll('.answer-hint').forEach(el => el.style.display = 'inline');
            }

            startTimer();
        }

        // ========== 総合採点 ==========
        function gradeQuiz() {
            if (timerInterval) clearInterval(timerInterval);
            let correctCount = 0;
            let totalCount = currentQuestions.length;

            let html = '<h3>📋 採点結果</h3><ul style="list-style:none; padding-left:0;">';

            currentQuestions.forEach((q, idx) => {
                const el = document.getElementById(q.id);
                const userVal = el ? el.value : '';
                const isCorrect = strictCompare(userVal, q.answer);

                if (isCorrect) correctCount++;
                if (el) {
                    if (isCorrect) el.classList.add('correct');
                    else el.classList.remove('correct');
                }

                html += `<li>${isCorrect ? '✅' : '❌'} <strong>Q${idx + 1}</strong> (${q.jp})<br>
                <span style="font-size:0.92rem;">入力: ${userVal || '(空白)'}<br>
                正解: <span style="color:#2c5f2d; font-weight:bold;">${q.answer}</span></span></li><br>`;
            });

            const percent = totalCount ? Math.round(correctCount / totalCount * 100) : 0;
            html += `</ul><p style="font-size:1.2rem;">🎯 ${correctCount} / ${totalCount} 正解 (${percent}%)</p>`;

            scoreHistory.push(percent);
            if (scoreHistory.length > 8) scoreHistory.shift();
            localStorage.setItem('spanish_translation_history', JSON.stringify(scoreHistory));
            const avg = scoreHistory.length ? Math.round(scoreHistory.reduce((a, b) => a + b, 0) / scoreHistory.length) : 0;
            html += `<p>📈 直近${scoreHistory.length}回の平均点: ${avg}%</p>`;

            document.getElementById('result').innerHTML = html;
        }

        window.generateQuiz = generateQuiz;
        window.gradeQuiz = gradeQuiz;
        window.toggleAnswers = toggleAnswers;
        window.resetHistory = resetHistory;
        window.speakText = speakText;

        window.onload = () => {
            generateQuiz();
        };
    </script>
</body>
</html>
