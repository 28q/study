<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>演習：動詞原形＋句法（全14問）</title>
  <style>
    * { box-sizing: border-box; }
    body{
      font-family: 'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
      max-width: 900px;
      margin: 28px auto;
      padding: 18px;
      background:#fbf8f0;
      color:#21313c;
      line-height:1.6;
    }
    h1,h2,h3{ margin:0.35em 0; }
    h1{
      text-align:center;
      font-size:1.9rem;
      border-bottom:3px solid #b22234;
      display:inline-block;
      padding-bottom:4px;
    }
    .title-block{ text-align:center; margin-bottom:18px; }
    .meta-box{
      background:#eef5ea;
      border-left:8px solid #2c5f2d;
      padding:12px 16px;
      border-radius:18px;
      margin:18px 0 24px;
      font-size:0.96rem;
    }
    .controls{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
      background:#fff4de;
      padding:12px 16px;
      border-radius:20px;
      margin-bottom:22px;
      box-shadow:0 2px 6px rgba(0,0,0,0.05);
    }
    button{
      background:#2c5f2d;
      color:#fff;
      border:none;
      padding:9px 16px;
      border-radius:28px;
      font-weight:700;
      cursor:pointer;
      transition:transform .15s ease, background .15s ease;
      font-size:0.92rem;
    }
    button:hover{ transform:scale(.98); background:#214521; }
    .secondary{ background:#6c757d; }
    .danger{ background:#b23c1c; }
    select{
      padding:8px 12px;
      border-radius:24px;
      border:1px solid #cdbb91;
      background:#fff;
    }
    #timer-area{
      font-weight:700;
      background:#ffe1b8;
      padding:6px 12px;
      border-radius:24px;
      color:#b23c1c;
      display:none;
    }
    .section{
      background:#fff;
      border:1px solid #eadfc7;
      border-radius:24px;
      padding:18px 20px;
      margin-bottom:28px;
      box-shadow:0 5px 15px rgba(0,0,0,0.04);
    }
    .section h3{
      border-left:6px solid #b22234;
      padding-left:12px;
      margin-bottom:14px;
      text-align:left;
    }
    .note{
      font-size:0.88rem;
      background:#f7f1df;
      padding:8px 12px;
      border-radius:18px;
      margin:8px 0 14px;
      display:inline-block;
    }
    .question{
      margin-bottom:22px;
      padding:12px;
      border-radius:18px;
      background:#fffdf7;
      border:1px solid #f1e7cf;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
    }
    .question-text{
      font-size:1.02rem;
      font-weight:600;
      background:#f6f1e6;
      padding:9px 12px;
      border-radius:18px;
      display:inline-block;
      margin-bottom:0;
    }
    .jp-hint{
      display:inline-block;
      margin-left:10px;
      font-size:0.84rem;
      color:#005f6b;
      background:#e4f3f5;
      padding:3px 10px;
      border-radius:18px;
    }
    .answer-hint{
      display:none;
      margin-left:10px;
      font-size:0.86rem;
      color:#3d6b3d;
      background:#eef6ea;
      padding:3px 9px;
      border-radius:18px;
    }
    .audio-btn{
      background:none;
      border:none;
      font-size:1.2rem;
      cursor:pointer;
      vertical-align:middle;
      color:#2c5f2d;
      padding:0 4px;
      margin-left:6px;
    }
    input.blank-input{
      width: clamp(140px, 24vw, 260px);
      min-width: 120px;
      padding: 8px 10px;
      font-size: 1rem;
      border: 1px solid #cfb87c;
      border-radius: 14px;
      background:#fffef9;
      text-align:center;
      vertical-align:middle;
      margin: 2px 4px;
      transition: background 0.15s, border-color 0.15s;
    }
    input.blank-input:focus{
      outline:none;
      border-color:#2c5f2d;
      box-shadow:0 0 0 2px rgba(44,95,45,0.18);
    }
    input.correct-highlight {
      background-color: #c8e6c9 !important;
      border-color: #2c5f2d !important;
    }
    #result{
      background:#f4f1e1;
      border-radius:20px;
      padding:14px 18px;
      margin-top:18px;
    }
    .footer{
      text-align:center;
      margin-top:28px;
      font-size:0.82rem;
      color:#5e5e52;
    }
    @media (max-width: 760px){
      input.blank-input{ width: 140px; }
    }
  </style>
</head>
<body>
  <div class="title-block">
    <h1>📘 演習：動詞原形 ＋ 句法</h1>
    <p>全14問（動詞原形11＋句法3）をランダム出題</p>
  </div>

  <div class="meta-box">
    🔹 <strong>全14問</strong>をランダム順で出題（動詞の原形＋重要な句法3つ）。<br>
    🔹 <strong>入力と同時に正解判定！</strong> 正解を入れると空欄が <span style="background:#c8e6c9; padding:2px 8px; border-radius:12px;">緑色</span> に変わります。<br>
    🔹 アクセント記号なしでも正答扱いです。
  </div>

  <div class="controls">
    <button onclick="generateQuiz()">✨ 問題生成（シャッフル）</button>
    <button onclick="gradeQuiz()" class="secondary">📝 採点</button>
    <button onclick="toggleAnswers()" id="toggleBtn">🔎 答え表示</button>
    <button onclick="resetHistory()" class="danger">🗑 履歴リセット</button>
    <label for="timeLimit">⏱️ 制限時間:</label>
    <select id="timeLimit">
      <option value="0">制限なし</option>
      <option value="180">3分</option>
      <option value="300">5分</option>
      <option value="480">8分</option>
    </select>
    <div id="timer-area">⏳ 残り <span id="timeDisplay">--:--</span></div>
  </div>

  <form id="quizForm"></form>
  <div id="result"></div>
  <div class="footer">📗 音声ボタンで正解の読み上げができます（リスニング練習に）。</div>

  <script>
    // 正規化（アクセント除去・小文字化・スペース除去）
    function normalize(str){
      if(!str) return '';
      return str.toLowerCase().trim()
        .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .replace(/\s+/g,' ')
        .replace(/[¿?¡!.,;:]/g,'');
    }

    function shuffleArray(arr){
      const a = [...arr];
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
      }
      return a;
    }

    function speakText(text){
      if(!text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.rate = 0.88;
      window.speechSynthesis.speak(utterance);
    }

    let currentQuestions = [];
    let showAnswersFlag = false;
    let timerInterval = null;
    let timeLeft = 0;
    let scoreHistory = JSON.parse(localStorage.getItem('spanish_infinitive_14') || '[]');
    window.answerMap = {};

    // ---------------------------------------------
    // 問題データ：動詞原形11個 ＋ 句法3個 → 合計14問
    // 【修正】句法の問題は日本語の意味だけにし、（）で答えを書かない
    // ---------------------------------------------
    const questionList = [
      { jp: 'する・作る', answer: 'hacer' },
      { jp: '置く・〜にする', answer: 'poner' },
      { jp: '知っている（人・場所に）', answer: 'conocer' },
      { jp: '聞く', answer: 'oír' },
      { jp: '行く', answer: 'ir' },
      { jp: '落ちる', answer: 'caer' },
      { jp: '知っている（知識）・できる', answer: 'saber' },
      { jp: '与える', answer: 'dar' },
      { jp: '言う', answer: 'decir' },
      { jp: '持っている', answer: 'tener' },
      { jp: '欲しい・好き', answer: 'querer' },
      // 句法（3つ）- 日本語の意味だけに修正
      { jp: '〜しなければならない', answer: 'tener que' },
      { jp: '〜するつもりである', answer: 'ir a' },
      { jp: '〜したい', answer: 'querer' }
    ];

    // タイマー
    function startTimer(){
      if(timerInterval) clearInterval(timerInterval);
      const limitSec = parseInt(document.getElementById('timeLimit').value, 10);
      const timerDiv = document.getElementById('timer-area');
      if(limitSec === 0){
        timerDiv.style.display = 'none';
        return;
      }
      timeLeft = limitSec;
      timerDiv.style.display = 'block';
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        if(timeLeft <= 1){
          clearInterval(timerInterval);
          timerDiv.style.display = 'none';
          alert('⏰ 制限時間終了！自動採点します。');
          gradeQuiz();
        }else{
          timeLeft--;
          updateTimerDisplay();
        }
      }, 1000);
    }

    function updateTimerDisplay(){
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      document.getElementById('timeDisplay').innerText = `${m}:${s.toString().padStart(2,'0')}`;
    }

    function toggleAnswers(){
      showAnswersFlag = !showAnswersFlag;
      document.querySelectorAll('.answer-hint').forEach(el => {
        el.style.display = showAnswersFlag ? 'inline' : 'none';
      });
      document.getElementById('toggleBtn').innerText = showAnswersFlag ? '🔒 答え非表示' : '🔎 答え表示';
    }

    function resetHistory(){
      scoreHistory = [];
      localStorage.setItem('spanish_infinitive_14', JSON.stringify(scoreHistory));
      document.getElementById('result').innerHTML = '<p>📊 スコア履歴をリセットしました。</p>';
    }

    // ライブ正解チェック（緑色に）
    function validateInput(el) {
      const expected = window.answerMap ? window.answerMap[el.id] : null;
      if (expected === undefined || expected === null) return;
      const normUser = normalize(el.value);
      const normExpected = normalize(expected);
      if (normUser === normExpected) {
        el.classList.add('correct-highlight');
      } else {
        el.classList.remove('correct-highlight');
      }
    }

    // ---------------------------------------------
    // 問題生成（すべて第1問として1セクションに）
    // ---------------------------------------------
    function buildAllQuestions(items){
      const section = document.createElement('div');
      section.className = 'section';
      section.innerHTML = `
        <h3>第1問：動詞の原形と句法（全14問・ランダム）</h3>
        <div class="note">日本語の意味に合う <strong>スペイン語（原形・句法）</strong> を書きなさい。</div>
      `;

      items.forEach((item, idx) => {
        const q = document.createElement('div');
        q.className = 'question';
        q.innerHTML = `<div class="question-text">${idx + 1}. <span class="jp-hint">📖 ${item.jp}</span></div>`;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'blank-input';
        input.id = `q_${idx}`;
        input.placeholder = 'スペイン語で入力';
        input.autocomplete = 'off';
        input.oninput = function() { validateInput(this); };
        q.appendChild(input);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'audio-btn';
        btn.textContent = '🔊';
        btn.onclick = () => speakText(item.answer);
        q.appendChild(btn);

        const hint = document.createElement('span');
        hint.className = 'answer-hint';
        hint.textContent = `→ ${item.answer}`;
        q.appendChild(hint);

        section.appendChild(q);
        currentQuestions.push({ type: 'main', ids: [`q_${idx}`], answers: [item.answer] });
      });
      return section;
    }

    // ---------------------------------------------
    // メイン問題生成
    // ---------------------------------------------
    function generateQuiz(){
      if(timerInterval) clearInterval(timerInterval);
      currentQuestions = [];
      window.answerMap = {};
      const form = document.getElementById('quizForm');
      form.innerHTML = '';
      document.getElementById('result').innerHTML = '';

      const shuffled = shuffleArray(questionList);
      form.appendChild(buildAllQuestions(shuffled));

      currentQuestions.forEach(q => {
        q.ids.forEach((id, idx) => {
          window.answerMap[id] = q.answers[idx];
        });
      });

      if(showAnswersFlag){
        document.querySelectorAll('.answer-hint').forEach(el => el.style.display = 'inline');
      }
      startTimer();
    }

    // ---------------------------------------------
    // 採点
    // ---------------------------------------------
    function gradeQuiz(){
      if(timerInterval) clearInterval(timerInterval);
      let correctCount = 0;
      let totalCount = 0;
      let html = '<h3>📋 採点結果</h3><ul style="list-style:none; padding-left:0;">';

      currentQuestions.forEach((q, idx) => {
        totalCount++;
        let ok = true;
        const userAnswers = [];
        for(let i=0;i<q.ids.length;i++){
          const el = document.getElementById(q.ids[i]);
          const user = el ? el.value : '';
          userAnswers.push(user);
          if(normalize(user) !== normalize(q.answers[i])) ok = false;
        }
        if(ok) correctCount++;
        html += `<li>${ok ? '✅' : '❌'} <strong>問${idx + 1}</strong><br>
          <span style="font-size:0.92rem;">入力: ${userAnswers.join(' / ') || '(空白)'}<br>
          正解: ${q.answers.join(' / ')}</span></li><br>`;
      });

      const percent = totalCount ? Math.round(correctCount / totalCount * 100) : 0;
      html += `</ul><p style="font-size:1.2rem;">🎯 ${correctCount} / ${totalCount} 正解 (${percent}%)</p>`;
      scoreHistory.push(percent);
      if(scoreHistory.length > 8) scoreHistory.shift();
      localStorage.setItem('spanish_infinitive_14', JSON.stringify(scoreHistory));
      const avg = scoreHistory.length ? Math.round(scoreHistory.reduce((a,b) => a + b, 0) / scoreHistory.length) : 0;
      html += `<p>📈 直近${scoreHistory.length}回の平均点: ${avg}%</p>`;
      document.getElementById('result').innerHTML = html;
    }

    window.generateQuiz = generateQuiz;
    window.gradeQuiz = gradeQuiz;
    window.toggleAnswers = toggleAnswers;
    window.resetHistory = resetHistory;
    window.speakText = speakText;
    window.validateInput = validateInput;

    window.onload = () => {
      generateQuiz();
    };
  </script>
</body>
</html>
