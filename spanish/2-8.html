<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>演習：動詞活用（全11問）＋ 比較級</title>
  <style>
    * { box-sizing: border-box; }
    body{
      font-family: 'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
      max-width: 1100px;
      margin: 28px auto;
      padding: 18px;
      background:#fbf8f0;
      color:#21313c;
      line-height:1.6;
    }
    h1,h2,h3{ margin:0.35em 0; }
    h1{
      text-align:center;
      font-size:1.9rem;
      border-bottom:3px solid #b22234;
      display:inline-block;
      padding-bottom:4px;
    }
    .title-block{ text-align:center; margin-bottom:18px; }
    .meta-box{
      background:#eef5ea;
      border-left:8px solid #2c5f2d;
      padding:12px 16px;
      border-radius:18px;
      margin:18px 0 24px;
      font-size:0.96rem;
    }
    .controls{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
      background:#fff4de;
      padding:12px 16px;
      border-radius:20px;
      margin-bottom:22px;
      box-shadow:0 2px 6px rgba(0,0,0,0.05);
    }
    button{
      background:#2c5f2d;
      color:#fff;
      border:none;
      padding:9px 16px;
      border-radius:28px;
      font-weight:700;
      cursor:pointer;
      transition:transform .15s ease, background .15s ease;
      font-size:0.92rem;
    }
    button:hover{ transform:scale(.98); background:#214521; }
    .secondary{ background:#6c757d; }
    .danger{ background:#b23c1c; }
    select{
      padding:8px 12px;
      border-radius:24px;
      border:1px solid #cdbb91;
      background:#fff;
    }
    #timer-area{
      font-weight:700;
      background:#ffe1b8;
      padding:6px 12px;
      border-radius:24px;
      color:#b23c1c;
      display:none;
    }
    .section{
      background:#fff;
      border:1px solid #eadfc7;
      border-radius:24px;
      padding:18px 20px;
      margin-bottom:28px;
      box-shadow:0 5px 15px rgba(0,0,0,0.04);
    }
    .section h3{
      border-left:6px solid #b22234;
      padding-left:12px;
      margin-bottom:14px;
      text-align:left;
    }
    .note{
      font-size:0.88rem;
      background:#f7f1df;
      padding:8px 12px;
      border-radius:18px;
      margin:8px 0 14px;
      display:inline-block;
    }
    .question{
      margin-bottom:22px;
      padding:12px;
      border-radius:18px;
      background:#fffdf7;
      border:1px solid #f1e7cf;
    }
    .question-text{
      font-size:1.02rem;
      font-weight:600;
      margin-bottom:8px;
      background:#f6f1e6;
      padding:9px 12px;
      border-radius:18px;
      display:inline-block;
    }
    .jp-hint{
      display:inline-block;
      margin-left:10px;
      font-size:0.84rem;
      color:#005f6b;
      background:#e4f3f5;
      padding:3px 10px;
      border-radius:18px;
    }
    .answer-hint{
      display:none;
      margin-left:10px;
      font-size:0.86rem;
      color:#3d6b3d;
      background:#eef6ea;
      padding:3px 9px;
      border-radius:18px;
    }
    .audio-btn{
      background:none;
      border:none;
      font-size:1.2rem;
      cursor:pointer;
      vertical-align:middle;
      color:#2c5f2d;
      padding:0 4px;
      margin-left:6px;
    }
    input.blank-input{
      width: clamp(80px, 15vw, 180px);
      min-width: 75px;
      padding: 8px 10px;
      font-size: 1rem;
      border: 1px solid #cfb87c;
      border-radius: 14px;
      background:#fffef9;
      text-align:center;
      vertical-align:middle;
      margin: 2px 4px;
      transition: background 0.15s, border-color 0.15s;
    }
    input.blank-input:focus{
      outline:none;
      border-color:#2c5f2d;
      box-shadow:0 0 0 2px rgba(44,95,45,0.18);
    }
    /* 第1問用：正解時に適用される緑色（JSで付与） */
    input.correct-highlight {
      background-color: #c8e6c9 !important;
      border-color: #2c5f2d !important;
    }
    .sentence-line{
      line-height:2.1;
      font-size:1.02rem;
      margin-top:6px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }
    .word{
      display:inline-block;
      margin:0 2px;
      white-space:nowrap;
    }
    table.conj-table{
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
      table-layout:fixed;
    }
    .conj-table th,.conj-table td{
      border:1px solid #d9ccb0;
      padding:10px 8px;
      text-align:center;
      vertical-align:middle;
    }
    .conj-table th{
      background:#f6f1e6;
      font-weight:700;
    }
    .conj-table td.person{
      background:#fff7ea;
      font-weight:600;
      width:18%;
    }
    .conj-table td.form{
      width:32%;
    }
    .conj-table input{
      width:100%;
      max-width:none;
      margin:0;
      border-radius:12px;
      text-align:center;
    }
    #result{
      background:#f4f1e1;
      border-radius:20px;
      padding:14px 18px;
      margin-top:18px;
    }
    .footer{
      text-align:center;
      margin-top:28px;
      font-size:0.82rem;
      color:#5e5e52;
    }
    @media (max-width: 760px){
      .conj-table td.person{ width:auto; }
      input.blank-input{ width: 88px; }
    }
  </style>
</head>
<body>
  <div class="title-block">
    <h1>📘 演習：動詞活用 + 比較級</h1>
    <p>全11動詞の現在形活用表 ＋ 比較級穴埋め（フルバージョン）</p>
  </div>

  <div class="meta-box">
    🔹 <strong>第1問</strong>：<strong>11個の動詞</strong>すべてを 3×2 の表で出題（1マス＝1入力ボックス）。<br>
    🔹 <strong>第1問は入力と同時に正解判定！</strong> 正解を入れると空欄が <span style="background:#c8e6c9; padding:2px 8px; border-radius:12px;">緑色</span> に変わります。<br>
    🔹 <strong>第2問</strong>：比較級（規則・不規則）の穴埋め問題。<br>
    🔹 アクセント記号なしでも正答扱いです。
  </div>

  <div class="controls">
    <button onclick="generateQuiz()">✨ 問題生成（リセット）</button>
    <button onclick="gradeQuiz()" class="secondary">📝 採点</button>
    <button onclick="toggleAnswers()" id="toggleBtn">🔎 答え表示</button>
    <button onclick="resetHistory()" class="danger">🗑 履歴リセット</button>
    <label for="timeLimit">⏱️ 制限時間:</label>
    <select id="timeLimit">
      <option value="0">制限なし</option>
      <option value="180">3分</option>
      <option value="300">5分</option>
      <option value="480">8分</option>
    </select>
    <div id="timer-area">⏳ 残り <span id="timeDisplay">--:--</span></div>
  </div>

  <form id="quizForm"></form>
  <div id="result"></div>
  <div class="footer">📗 空欄は1つずつ個別の入力ボックスで答えてください。音声ボタンで全文リスニングもできます。</div>

  <script>
    // 正規化（アクセント除去・小文字化・句読点除去）
    function normalize(str){
      if(!str) return '';
      return str.toLowerCase().trim()
        .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .replace(/\s+/g,' ')
        .replace(/[¿?¡!.,;:]/g,'');
    }

    function shuffleArray(arr){
      const a = [...arr];
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
      }
      return a;
    }

    function speakText(text){
      if(!text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.rate = 0.88;
      window.speechSynthesis.speak(utterance);
    }

    let currentQuestions = [];
    let showAnswersFlag = false;
    let timerInterval = null;
    let timeLeft = 0;
    let scoreHistory = JSON.parse(localStorage.getItem('spanish_exam_history_v8') || '[]');
    window.answerMap = {}; // 第1問の正解マップ

    // ---------------------------------------------
    // 1. 活用データ（全11動詞）
    // ---------------------------------------------
    const conjugationData = {
      hacer: ['hago','haces','hace','hacemos','hacéis','hacen'],
      poner: ['pongo','pones','pone','ponemos','ponéis','ponen'],
      conocer: ['conozco','conoces','conoce','conocemos','conocéis','conocen'],
      oír: ['oigo','oyes','oye','oímos','oís','oyen'],
      ir: ['voy','vas','va','vamos','vais','van'],
      caer: ['caigo','caes','cae','caemos','caéis','caen'],
      saber: ['sé','sabes','sabe','sabemos','sabéis','saben'],
      dar: ['doy','das','da','damos','dáis','dan'],
      decir: ['digo','dices','dice','decimos','decís','dicen'],
      tener: ['tengo','tienes','tiene','tenemos','tenéis','tienen'],
      querer: ['quiero','quieres','quiere','queremos','queréis','quieren']
    };

    // ---------------------------------------------
    // 2. 第2問：比較級データ（全7問）
    // ---------------------------------------------
    const comparativoStock = [
      { parts: ['Yo', 'soy', 'más', 'alto', 'que', 'tú.'], jp: '私はあなたより背が高い。', answer: ['más', 'alto', 'que'] },
      { parts: ['Este', 'problema', 'es', 'tan', 'difícil', 'como', 'aquel.'], jp: 'この問題はあの問題と同じくらい難しい。', answer: ['tan', 'como'] },
      { parts: ['Él', 'tiene', 'tantos', 'libros', 'como', 'yo.'], jp: '彼は私より本をたくさん持っている。', answer: ['tantos', 'como'] },
      { parts: ['Este', 'restaurante', 'es', 'mejor', 'que', 'aquel.'], jp: 'このレストランはあのレストランより良い。', answer: ['mejor', 'que'] },
      { parts: ['Hoy', 'hace', 'peor', 'tiempo', 'que', 'ayer.'], jp: '今日は昨日より天気が悪い。', answer: ['peor', 'que'] },
      { parts: ['Mi', 'hermana', 'es', 'mayor', 'que', 'yo.'], jp: '私の姉は私より年上だ。', answer: ['mayor', 'que'] },
      { parts: ['No', 'corro', 'tan', 'rápido', 'como', 'él.'], jp: '私は彼ほど速く走れない。', answer: ['tan', 'como'] }
    ];

    // タイマー関連
    function startTimer(){
      if(timerInterval) clearInterval(timerInterval);
      const limitSec = parseInt(document.getElementById('timeLimit').value, 10);
      const timerDiv = document.getElementById('timer-area');
      if(limitSec === 0){
        timerDiv.style.display = 'none';
        return;
      }
      timeLeft = limitSec;
      timerDiv.style.display = 'block';
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        if(timeLeft <= 1){
          clearInterval(timerInterval);
          timerDiv.style.display = 'none';
          alert('⏰ 制限時間終了！自動採点します。');
          gradeQuiz();
        }else{
          timeLeft--;
          updateTimerDisplay();
        }
      }, 1000);
    }

    function updateTimerDisplay(){
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      document.getElementById('timeDisplay').innerText = `${m}:${s.toString().padStart(2,'0')}`;
    }

    function toggleAnswers(){
      showAnswersFlag = !showAnswersFlag;
      document.querySelectorAll('.answer-hint').forEach(el => {
        el.style.display = showAnswersFlag ? 'inline' : 'none';
      });
      document.getElementById('toggleBtn').innerText = showAnswersFlag ? '🔒 答え非表示' : '🔎 答え表示';
    }

    function resetHistory(){
      scoreHistory = [];
      localStorage.setItem('spanish_exam_history_v8', JSON.stringify(scoreHistory));
      document.getElementById('result').innerHTML = '<p>📊 スコア履歴をリセットしました。</p>';
    }

    // ---------------------------------------------
    // 第1問 ライブ正解チェック（入力時に緑色に）
    // ---------------------------------------------
    function validateInput(el) {
      // 第1問の入力欄（IDが q1_ で始まるもの）のみ対象
      if (!el.id || !el.id.startsWith('q1_')) return;
      
      const expected = window.answerMap ? window.answerMap[el.id] : null;
      if (expected === undefined || expected === null) return;

      // 正規化して比較（アクセント・大文字小文字を無視）
      if (normalize(el.value) === normalize(expected)) {
        el.classList.add('correct-highlight');
      } else {
        el.classList.remove('correct-highlight');
      }
    }

    // ---------------------------------------------
    // インライン穴埋めレンダリング（第2問用）
    // ---------------------------------------------
    function renderSentence(parts, answerWords, qId){
      const container = document.createElement('div');
      container.className = 'sentence-line';
      const blankAnswers = [];
      let answerIdx = 0;
      const ansNorm = answerWords.map(w => normalize(w));

      parts.forEach((part, idx) => {
        const partNorm = normalize(part);
        if(answerIdx < ansNorm.length && partNorm === ansNorm[answerIdx]){
          // この部分が空欄対象
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'blank-input';
          input.id = `${qId}_b${blankAnswers.length}`;
          input.placeholder = '□';
          input.autocomplete = 'off';
          container.appendChild(input);
          blankAnswers.push(answerWords[answerIdx]);
          answerIdx++;
        } else {
          // そのまま表示
          const span = document.createElement('span');
          span.className = 'word';
          span.textContent = part + ' ';
          container.appendChild(span);
        }
      });
      return { container, blanks: blankAnswers.length, answers: blankAnswers };
    }

    // ---------------------------------------------
    // 第1問：活用表生成（全動詞）
    // ---------------------------------------------
    function buildQ1Section(verbs){
      const section = document.createElement('div');
      section.className = 'section';
      section.innerHTML = `
        <h3>第1問：現在形活用（全11動詞）</h3>
        <div class="note">各動詞について 6人称を埋めてください。<strong>1マス＝1入力ボックス</strong>です。<br>✅ 正解を入力するとその欄が緑色になります。</div>
      `;

      verbs.forEach((verb, idx) => {
        const forms = conjugationData[verb];
        const q = document.createElement('div');
        q.className = 'question';
        q.innerHTML = `<div class="question-text">${idx + 1}. ${verb}</div>`;

        const table = document.createElement('table');
        table.className = 'conj-table';
        table.innerHTML = `
          <thead><tr><th>人称</th><th>活用</th><th>人称</th><th>活用</th></tr></thead>
          <tbody>
            <tr><td class="person">yo</td><td class="form"><input class="blank-input" id="q1_${idx}_0" type="text" oninput="validateInput(this)"></td>
                <td class="person">nosotros</td><td class="form"><input class="blank-input" id="q1_${idx}_3" type="text" oninput="validateInput(this)"></td></tr>
            <tr><td class="person">tú</td><td class="form"><input class="blank-input" id="q1_${idx}_1" type="text" oninput="validateInput(this)"></td>
                <td class="person">vosotros</td><td class="form"><input class="blank-input" id="q1_${idx}_4" type="text" oninput="validateInput(this)"></td></tr>
            <tr><td class="person">él / ella / usted</td><td class="form"><input class="blank-input" id="q1_${idx}_2" type="text" oninput="validateInput(this)"></td>
                <td class="person">ellos / ellas / ustedes</td><td class="form"><input class="blank-input" id="q1_${idx}_5" type="text" oninput="validateInput(this)"></td></tr>
          </tbody>
        `;
        q.appendChild(table);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'audio-btn';
        btn.textContent = '🔊';
        btn.onclick = () => speakText(forms.join(' '));
        q.appendChild(btn);

        const hint = document.createElement('span');
        hint.className = 'answer-hint';
        hint.textContent = `→ ${forms.join(' / ')}`;
        q.appendChild(hint);

        section.appendChild(q);
        currentQuestions.push({
          type: 'q1',
          verb,
          ids: [`q1_${idx}_0`,`q1_${idx}_1`,`q1_${idx}_2`,`q1_${idx}_3`,`q1_${idx}_4`,`q1_${idx}_5`],
          answers: forms
        });
      });
      return section;
    }

    // ---------------------------------------------
    // 第2問：インライン穴埋め（比較級）
    // ---------------------------------------------
    function buildComparativoSection(items){
      const section = document.createElement('div');
      section.className = 'section';
      section.innerHTML = `
        <h3>第2問：比較級（穴埋め）</h3>
        <div class="note">más / menos / tan / tanto / como / que / mejor / peor / mayor / menor などを空欄にしています。</div>
      `;

      items.forEach((item, idx) => {
        const qNum = currentQuestions.length + 1;
        const q = document.createElement('div');
        q.className = 'question';
        q.innerHTML = `<div class="question-text">${qNum}. <span class="jp-hint">📖 ${item.jp}</span></div>`;
        const qId = `q_comp_${idx}`;
        const rendered = renderSentence(item.parts, item.answer, qId);
        q.appendChild(rendered.container);

        // 音声ボタン（全文読み上げ）
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'audio-btn';
        btn.textContent = '🔊';
        btn.onclick = () => speakText(item.parts.join(' '));
        q.appendChild(btn);

        // 答え表示用ヒント
        const hint = document.createElement('span');
        hint.className = 'answer-hint';
        hint.textContent = `→ ${item.parts.join(' ')}`;
        q.appendChild(hint);

        section.appendChild(q);
        currentQuestions.push({
          type: 'inline',
          ids: rendered.answers.map((_, i) => `${qId}_b${i}`),
          answers: rendered.answers
        });
      });
      return section;
    }

    // ---------------------------------------------
    // メイン問題生成
    // ---------------------------------------------
    function generateQuiz(){
      if(timerInterval) clearInterval(timerInterval);
      currentQuestions = [];
      window.answerMap = {}; // リセット
      const form = document.getElementById('quizForm');
      form.innerHTML = '';
      document.getElementById('result').innerHTML = '';

      // 第1問：全11動詞（固定）
      const allVerbs = ['hacer','poner','conocer','oír','ir','caer','saber','dar','decir','tener','querer'];
      form.appendChild(buildQ1Section(allVerbs));

      // 第2問：比較級（全7問）
      form.appendChild(buildComparativoSection(comparativoStock));

      // ---- 第1問の正解マップを構築（ライブチェック用） ----
      currentQuestions.forEach(q => {
        if (q.type === 'q1') {
          q.ids.forEach((id, idx) => {
            window.answerMap[id] = q.answers[idx];
          });
        }
      });

      if(showAnswersFlag){
        document.querySelectorAll('.answer-hint').forEach(el => el.style.display = 'inline');
      }
      startTimer();
    }

    // ---------------------------------------------
    // 採点
    // ---------------------------------------------
    function gradeQuiz(){
      if(timerInterval) clearInterval(timerInterval);
      let correctCount = 0;
      let totalCount = 0;
      let html = '<h3>📋 採点結果</h3><ul style="list-style:none; padding-left:0;">';

      currentQuestions.forEach((q, idx) => {
        totalCount++;
        let ok = true;
        const userAnswers = [];
        for(let i=0;i<q.ids.length;i++){
          const el = document.getElementById(q.ids[i]);
          const user = el ? el.value : '';
          userAnswers.push(user);
          if(normalize(user) !== normalize(q.answers[i])) ok = false;
        }
        if(ok) correctCount++;
        html += `<li>${ok ? '✅' : '❌'} <strong>問${idx + 1}</strong><br>
          <span style="font-size:0.92rem;">入力: ${userAnswers.join(' / ') || '(空白)'}<br>
          正解: ${q.answers.join(' / ')}</span></li><br>`;
      });

      const percent = totalCount ? Math.round(correctCount / totalCount * 100) : 0;
      html += `</ul><p style="font-size:1.2rem;">🎯 ${correctCount} / ${totalCount} 正解 (${percent}%)</p>`;
      scoreHistory.push(percent);
      if(scoreHistory.length > 8) scoreHistory.shift();
      localStorage.setItem('spanish_exam_history_v8', JSON.stringify(scoreHistory));
      const avg = scoreHistory.length ? Math.round(scoreHistory.reduce((a,b) => a + b, 0) / scoreHistory.length) : 0;
      html += `<p>📈 直近${scoreHistory.length}回の平均点: ${avg}%</p>`;
      document.getElementById('result').innerHTML = html;
    }

    // グローバル公開
    window.generateQuiz = generateQuiz;
    window.gradeQuiz = gradeQuiz;
    window.toggleAnswers = toggleAnswers;
    window.resetHistory = resetHistory;
    window.speakText = speakText;
    window.validateInput = validateInput;

    window.onload = () => {
      generateQuiz();
    };
  </script>
</body>
</html>
